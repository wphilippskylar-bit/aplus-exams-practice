<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e13">
<meta name="description" content="CompTIA A+ Core 1 (220-1201) and Core 2 (220-1202) from zero to confident IT tech: locked learning path, flashcards, explained questions and hands-on labs.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="A+ Range">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>A+ Range</title>
<style>
:root{
  --bg:#0a0e13;--bg2:#0f141b;--panel:#131a23;--panel2:#18212c;--line:#223040;--line2:#2c3d50;
  --text:#dbe4ee;--muted:#8a9bb0;--dim:#5d6f84;
  --acc:#2dd4bf;--acc2:#0ea5a0;--accInk:#032a26;
  --lock:#f5b942;--ok:#3ddc84;--bad:#f2555a;--info:#6aa9ff;
  --r:12px;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,system-ui,sans-serif;
  --safeB:env(safe-area-inset-bottom,0px);--safeT:env(safe-area-inset-top,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
body{min-height:100dvh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
input,textarea,select{font-size:16px}
a{color:var(--acc)}
code,kbd,pre,.mono{font-family:var(--mono)}
code{background:#0c1219;border:1px solid var(--line);padding:1px 5px;border-radius:5px;font-size:.88em}
h1,h2,h3,h4{line-height:1.2;margin:0 0 .5em}
h1{font-size:1.5rem}h2{font-size:1.25rem}h3{font-size:1.05rem}
p{margin:.4em 0 .8em}
.muted{color:var(--muted)}.dim{color:var(--dim)}.small{font-size:.85rem}.center{text-align:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}
.stack>*+*{margin-top:12px}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}

/* shell */
#top{position:sticky;top:0;z-index:20;background:rgba(10,14,19,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:calc(var(--safeT) + 8px) 14px 8px;display:flex;align-items:center;gap:10px}
#top .brand{font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .brand .dot{width:10px;height:10px;border-radius:3px;background:var(--acc);box-shadow:0 0 10px var(--acc)}
#top .prog{margin-left:auto;font:600 12px var(--mono);color:var(--muted);display:flex;align-items:center;gap:8px}
.bar{height:6px;background:#0c1219;border:1px solid var(--line);border-radius:6px;overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc))}
#main{padding:16px 14px calc(84px + var(--safeB));max-width:1180px;margin:0 auto}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:rgba(15,20,27,.96);border-top:1px solid var(--line);
  padding:6px 4px calc(6px + var(--safeB))}
#nav button{flex:1;background:none;border:0;padding:6px 2px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;cursor:pointer}
#nav button svg{width:22px;height:22px}
#nav button.on{color:var(--acc)}

/* PC layout */
body.pc #nav{top:0;bottom:0;right:auto;width:84px;flex-direction:column;justify-content:flex-start;padding-top:70px;border-top:0;border-right:1px solid var(--line)}
body.pc #nav button{flex:0;padding:12px 4px}
body.pc #top{padding-left:98px}
body.pc #main{padding:24px 28px 40px 112px}

/* cards & panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel.tight{padding:12px}
.grid{display:grid;gap:12px}
body.pc .grid.two{grid-template-columns:1fr 1fr}
body.pc .grid.three{grid-template-columns:repeat(3,1fr)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--panel2);border-radius:10px;padding:10px 14px;cursor:pointer;min-height:42px;font-weight:600;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--acc2)}
.btn.pri{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.btn.warn{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:6px 10px;font-size:.88rem}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;padding:3px 10px;font-size:.78rem;color:var(--muted);background:var(--bg2)}
.chip.ok{color:var(--ok);border-color:rgba(61,220,132,.4)}
.chip.lock{color:var(--lock);border-color:rgba(245,185,66,.4)}
.chip.acc{color:var(--acc);border-color:rgba(45,212,191,.4)}
.tag{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* device picker */
.picker{position:fixed;inset:0;z-index:100;background:radial-gradient(1200px 600px at 50% -10%,rgba(45,212,191,.18),transparent),var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.picker .box{max-width:560px;width:100%;text-align:center}
.picker .opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}
.picker .opt{background:var(--panel);border:1px solid var(--line2);border-radius:16px;padding:22px 12px;cursor:pointer;color:var(--text)}
.picker .opt:hover{border-color:var(--acc)}
.picker .opt svg{width:44px;height:44px;color:var(--acc)}
.picker .opt b{display:block;margin-top:8px;font-size:1.05rem}
.picker .opt span{display:block;color:var(--muted);font-size:.82rem;margin-top:4px}

/* path map */
.tier{margin:18px 0 8px;display:flex;align-items:baseline;gap:10px}
.tier h2{margin:0}
.path{position:relative;display:grid;gap:10px}
body.pc .path{grid-template-columns:repeat(2,1fr)}
.node{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left;width:100%;color:var(--text)}
.node .num{flex:0 0 40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font:700 14px var(--mono);background:var(--bg2);border:1px solid var(--line2)}
.node.done .num{background:rgba(61,220,132,.12);border-color:rgba(61,220,132,.5);color:var(--ok)}
.node.cur{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.node.cur .num{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.node.locked{opacity:.55;cursor:not-allowed}
.node.locked .num{color:var(--lock)}
.node .t{font-weight:650}
.node .s{font-size:.82rem;color:var(--muted)}

/* stage */
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:12px -2px;padding:2px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:1px solid var(--line2);background:var(--bg2);color:var(--muted);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:.9rem}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.req{display:flex;gap:8px;flex-wrap:wrap}
.lesson h3{margin-top:1.2em;color:#fff}
.lesson table{border-collapse:collapse;width:100%;font-size:.88rem;margin:.6em 0;display:block;overflow-x:auto}
.lesson th,.lesson td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.lesson th{background:var(--bg2)}
.lesson pre{background:#070b10;border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-x:auto;font-size:.82rem;line-height:1.45}
.lesson ul,.lesson ol{padding-left:1.2em}
.lesson li{margin:.2em 0}
.callout{border-left:3px solid var(--info);background:rgba(106,169,255,.07);padding:10px 12px;border-radius:0 10px 10px 0;margin:12px 0}
.callout.trap{border-color:var(--bad);background:rgba(242,85,90,.07)}
.callout.pro{border-color:var(--lock);background:rgba(245,185,66,.07)}
.callout b.k{display:block;font:700 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.callout.trap b.k{color:var(--bad)}.callout.pro b.k{color:var(--lock)}.callout b.k{color:var(--info)}

/* flashcards */
.flash{perspective:1200px;height:240px;cursor:pointer;margin:6px 0 12px}
body.pc .flash{height:280px}
.flash .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flash.flip .in{transform:rotateY(180deg)}
.flash .f,.flash .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;border:1px solid var(--line2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center;background:var(--panel);overflow:auto}
.flash .f b{font-size:1.4rem}
.flash .b{transform:rotateY(180deg);background:var(--panel2);font-size:1rem}
body.lite .flash .in{transition:none}
body.lite .flash .f,body.lite .flash .b{backface-visibility:visible;-webkit-backface-visibility:visible}
body.lite .flash .b{transform:none;display:none}
body.lite .flash.flip .in{transform:none}
body.lite .flash.flip .f{display:none}
body.lite .flash.flip .b{display:flex}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* quiz */
.q{font-size:1.05rem;font-weight:600;margin-bottom:12px;white-space:pre-wrap}
.choices{display:grid;gap:8px}
.choice{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:11px 12px;cursor:pointer;color:var(--text)}
.choice .l{font:700 12px var(--mono);color:var(--muted);flex:0 0 18px;padding-top:2px}
.choice.sel{border-color:var(--acc)}
.choice.right{border-color:var(--ok);background:rgba(61,220,132,.09)}
.choice.wrong{border-color:var(--bad);background:rgba(242,85,90,.09)}
.explain{margin-top:12px;padding:12px;border-radius:10px;background:#0c1219;border:1px solid var(--line)}
.explain b.v{display:block;margin-bottom:4px}
.answer-in{width:100%;background:#070b10;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font-family:var(--mono)}
.qmeta{display:flex;justify-content:space-between;color:var(--muted);font:600 12px var(--mono);margin-bottom:8px}
.timer{font:700 14px var(--mono);color:var(--lock)}

/* lab */
.lab{display:grid;gap:12px}
body.pc .lab{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);align-items:start}
body.pc .lab .termwrap{position:sticky;top:70px}
.topo{width:100%;height:auto;background:radial-gradient(circle at 50% 40%,#101823,#0b1017);border:1px solid var(--line);border-radius:var(--r);touch-action:manipulation}
.topo .dev{cursor:pointer}
.topo .dev text{fill:var(--text);font:600 11px var(--sans)}
.topo .dev.sel rect.hit,.topo .dev.sel circle.hit{stroke:var(--acc);stroke-width:2.5}
.topo .lk{stroke-width:2.5}
.topo .lk.up{stroke:var(--ok)}.topo .lk.down{stroke:var(--bad);stroke-dasharray:6 5}
.topo .pl{fill:var(--muted);font:500 9px var(--mono)}
.tasks{list-style:none;padding:0;margin:0}
.tasks li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.tasks li:last-child{border-bottom:0}
.tasks .ck{flex:0 0 20px;height:20px;border-radius:6px;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:13px}
.tasks li.ok .ck{background:var(--ok);border-color:var(--ok);color:#03210f}
.tasks li.ok span{color:var(--muted)}
.term{background:#05080c;border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden}
.term .bar2{display:flex;gap:6px;overflow-x:auto;padding:8px;border-bottom:1px solid var(--line);background:#0a0f15;scrollbar-width:none}
.term .bar2::-webkit-scrollbar{display:none}
.term .bar2 button{flex:0 0 auto;border:1px solid var(--line2);background:transparent;color:var(--muted);border-radius:8px;padding:4px 10px;font:600 12px var(--mono);cursor:pointer}
.term .bar2 button.on{color:var(--acc);border-color:var(--acc)}
.term .out{font:12.5px/1.45 var(--mono);white-space:pre-wrap;word-break:break-word;padding:10px 12px;height:340px;overflow-y:auto;color:#c9d6e3}
body.pc .term .out{height:440px}
.term .out .cmd{color:var(--acc)}
.term .out .hint{color:var(--lock)}
.term .inl{display:flex;align-items:center;border-top:1px solid var(--line);padding:6px 10px;gap:6px;background:#070b10}
.term .inl .pr{font:600 12.5px var(--mono);color:var(--acc);white-space:nowrap}
.term .inl input{flex:1;min-width:0;background:transparent;border:0;outline:0;font-family:var(--mono);color:#fff;padding:6px 0}
.keys{display:flex;gap:6px;overflow-x:auto;padding:6px 8px 8px;background:#070b10;scrollbar-width:none}
.keys::-webkit-scrollbar{display:none}
.keys button{flex:0 0 auto;border:1px solid var(--line2);background:var(--panel);color:var(--text);border-radius:8px;padding:6px 10px;font:600 12px var(--mono);cursor:pointer}
body.pc .keys{display:none}

/* code / checkpoint */
.code{font:700 1.25rem var(--mono);letter-spacing:.06em;color:var(--acc);background:#06100f;border:1px dashed var(--acc2);border-radius:12px;padding:14px;text-align:center;word-break:break-all;user-select:all;-webkit-user-select:all}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safeB));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--acc2);padding:10px 16px;border-radius:12px;z-index:200;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:90vw}
.modal{position:fixed;inset:0;z-index:150;background:rgba(4,7,10,.75);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .panel{max-width:520px;width:100%;max-height:88dvh;overflow:auto}
.big{font-size:2.6rem;font-weight:800;font-family:var(--mono)}
.list{display:grid;gap:8px}
.li{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;color:var(--text);text-align:left;width:100%}
.li .grow .s{font-size:.82rem;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select,.field textarea{background:#070b10;border:1px solid var(--line2);border-radius:10px;padding:10px 12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font:13px var(--mono)}
.kv b{color:var(--muted);font-weight:500}

/* lite (phone) mode: cut the expensive stuff */
body.lite #top,body.lite #nav{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg2)}
body.lite *{transition:none!important;animation:none!important}
body.lite .node.cur,body.lite .toast{box-shadow:none}
body.lite #top .brand .dot{box-shadow:none}
body.lite .picker{background:var(--bg)}
body.lite .topo{background:#0b1017}
@media (max-width:420px){.term .out{height:300px}h1{font-size:1.3rem}}
.lab>*,.stack,.termwrap,.term,#main{min-width:0}
html,body{overflow-x:hidden}
.tabs.trk button{font-size:.95rem;padding:9px 16px}
/* cloud resource map */
.rmap{max-height:none}
.rv{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;background:var(--bg2)}
.rs{border-left:2px solid var(--line2);margin:6px 0 2px 4px;padding-left:10px}
.rh{margin:2px 0;line-height:1.6}
.ri{margin:3px 0;line-height:1.6;word-break:break-word}
.rv code{font-size:.78em}
.rb{display:inline-block;font:600 10.5px var(--mono);padding:1px 7px;border-radius:999px;border:1px solid}
.rb.ok{color:var(--ok);border-color:rgba(61,220,132,.45);background:rgba(61,220,132,.08)}
.rb.no{color:var(--bad);border-color:rgba(242,85,90,.45);background:rgba(242,85,90,.08)}
/* ---- PBQ labs ---- */
.pbq-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);margin:6px 0}
.pbq-row .it{flex:1 1 220px;font-size:.92rem}
.pbq-row select,.pbq input.num,.acl select,.acl input{background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:8px;padding:8px;font-size:16px;max-width:100%}
.pbq-row.ok{border-color:rgba(61,220,132,.55)}
.pbq-row.bad{border-color:rgba(255,92,108,.6)}
.ord{display:flex;gap:8px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);margin:6px 0}
.ord .n{font:700 13px var(--mono);color:var(--acc);flex:0 0 22px}
.ord .t{flex:1}
.ord button{min-width:40px}
.acl{width:100%;border-collapse:collapse;font-size:.85rem}
.acl td,.acl th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:middle}
.acl select,.acl input{width:100%;font-size:15px;padding:6px}
.flow{font:12px var(--mono);padding:6px 8px;border-radius:8px;margin:4px 0;background:var(--bg2);border:1px solid var(--line)}
.flow.ok{border-color:rgba(61,220,132,.55)}.flow.bad{border-color:rgba(255,92,108,.6)}
.reftable{width:100%;border-collapse:collapse;font-size:.85rem}.reftable td,.reftable th{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
.reftable th{color:var(--acc);font-weight:600}

</style>
</head>

  ],

/* A+ Core 1 — 1.0 Mobile Devices */
(function () {
  var S = COURSE.stages, Q = window.Q, T = window.TYPE, L = COURSE.labs;

  S.push({
    id: 'a1', track: 'core1', tier: 'c1-mobile', title: 'Laptops & mobile devices', code: 'A1-FOLD-AND-GO',
    goal: 'Laptop parts and how to replace them safely, display tech, and the ports and accessories that connect mobile devices.',
    lesson: [
      { h: 'What makes a laptop a laptop', html: '<p>A laptop packs a whole computer into a hinged shell: a <b>display</b>, a <b>keyboard</b>, a <b>trackpad</b> (pointing device), a <b>battery</b>, and a motherboard with CPU, RAM and storage — all in a small, power-sipping package. Because space is tight, parts are smaller and often proprietary, so you always check the manufacturer\'s service manual before opening one.</p><ul><li><b>Battery</b>: usually lithium-ion. A <b>swollen (spicy) battery</b> is a fire/rupture hazard — power the device off, stop using it, and dispose of it safely. Never puncture it.</li><li><b>Keyboard</b> and <b>trackpad</b> are common replacements; a sticky key or dead trackpad is often a whole-assembly swap.</li><li>Laptops use <b>SODIMM</b> memory (smaller than desktop DIMMs) and increasingly <b>M.2</b> storage. Some RAM and storage are <b>soldered</b> and not upgradeable.</li></ul>' },
      { h: 'The display assembly', html: '<ul><li><b>LCD</b> panels are lit by a <b>backlight</b>. Older ones used a <b>CCFL</b> tube driven by an <b>inverter</b> (which converts DC to the AC the lamp needs); modern ones use <b>LED</b> backlights (no inverter). A dim display that still shows a faint image points at the backlight or inverter.</li><li><b>OLED</b> panels light each pixel themselves — deeper blacks, no separate backlight, but risk of burn-in.</li><li>The lid also holds <b>Wi-Fi antennas</b> (wires routed around the screen), the <b>webcam</b>, microphone, and sometimes a <b>digitizer</b> for touch/pen input.</li><li>A <b>privacy filter</b> narrows the viewing angle so people beside the user can\'t read the screen.</li></ul>' },
      { h: 'Ports, connectivity and accessories', html: '<ul><li><b>USB-C / Thunderbolt</b> carries data, video (DisplayPort alt mode) and power on one reversible connector. A <b>docking station</b> turns one cable into many ports; a simpler <b>port replicator</b> just adds ports.</li><li>Wireless: <b>Wi-Fi</b> (networks), <b>Bluetooth</b> (peripherals, pair by making the device discoverable), <b>NFC</b> (tap-to-pay, very short range), and <b>cellular</b> (a mobile hotspot shares that connection over Wi-Fi).</li><li>Location uses <b>GPS</b> (needs sky view) or cell/Wi-Fi assisted location indoors.</li><li>Mobile sync: back up and move data over USB, Wi-Fi, or the cloud; corporate mail often uses a <b>mail profile</b> or MDM to configure accounts and enforce policy.</li></ul>' }
    ],
    cards: [
      ['Swollen battery', 'Fire/rupture hazard — power off, stop using, dispose safely. Never puncture.'],
      ['SODIMM', 'Small-outline memory module used in laptops (desktops use full-size DIMMs).'],
      ['M.2 / NVMe', 'Small circuit-board SSD that plugs into a slot; NVMe runs over PCIe for high speed.'],
      ['Inverter', 'Converts DC to AC to drive a CCFL backlight. A dim-but-visible LCD often means backlight/inverter.'],
      ['LED backlight', 'Modern LCD lighting; no inverter needed.'],
      ['OLED', 'Each pixel emits light — deep blacks, thin panel, burn-in risk.'],
      ['Digitizer', 'The touch/pen input layer on a display.'],
      ['Docking station', 'Adds many ports (and often power/video) through one connector.'],
      ['USB-C / Thunderbolt', 'Reversible connector carrying data, video and power.'],
      ['NFC', 'Near-field communication — tap-to-pay range (a few cm).'],
      ['Bluetooth pairing', 'Make the device discoverable, then confirm the code to pair a peripheral.'],
      ['Mobile hotspot', 'Shares a cellular data connection with other devices over Wi-Fi.'],
      ['Privacy filter', 'Narrows viewing angle so bystanders cannot read the screen.'],
      ['Field replaceable unit (FRU)', 'A part a tech can swap in the field: battery, keyboard, RAM, drive, display.']
    ],
    qs: [
      Q("A laptop's battery has begun swelling and is pushing up on the trackpad. What should a technician do first?", "Power off the device and stop using it immediately, then arrange safe disposal", ["Continue using the laptop until a replacement battery arrives", "Puncture the battery to release trapped gas", "Charge the battery fully to test its capacity"], "A swollen battery indicates a dangerous chemical breakdown and fire/rupture risk. The device should be powered off and not used until the battery is safely replaced and disposed of properly.", 1),
      Q("Which mobile device component would a technician most likely replace to fix a laptop that no longer detects any wireless networks, when the antenna itself tests fine?", "Wireless card", ["Digitizer", "Inverter", "Trackpad"], "The wireless (Wi-Fi) card is the component responsible for detecting and connecting to networks; if the antenna is confirmed good, the card itself is the next suspect.", 1),
      Q("A user wants to unlock their phone using their face instead of a PIN. Which category of component enables this?", "Physical privacy and security components (biometrics)", ["Wireless card", "Digitizer", "Docking station"], "Biometric hardware, such as a front-facing IR camera for facial recognition or a fingerprint reader, falls under physical privacy and security components.", 1),
      Q("Which connection method is most associated with contactless mobile payments at a store terminal?", "NFC", ["Bluetooth", "Lightning", "Tethering"], "Near-field communication (NFC) is a very short-range wireless technology commonly used for contactless payments and quick pairing.", 1),
      Q("A technician wants to give a laptop access to full-size HDMI, Ethernet, and USB-A ports it lacks natively. What accessory accomplishes this?", "Docking station", ["Stylus", "Webcam", "Trackpad"], "A docking station (or port replicator) expands the available ports on a laptop by connecting through a single cable or bay.", 1),
      Q("Which technology allows a laptop to use a smartphone's cellular data connection over Wi-Fi?", "Hotspot/tethering", ["NFC", "Bluetooth pairing PIN", "SIM ejection"], "Tethering (creating a mobile hotspot) shares a phone's cellular data connection with other devices over Wi-Fi, Bluetooth, or USB.", 1),
      Q("During Bluetooth pairing, a phone displays a six-digit code that must match on both devices. What step of the pairing process is this?", "Entering the appropriate PIN code", ["Enabling Bluetooth", "Finding a device for pairing", "Testing connectivity"], "Confirming a matching passkey/PIN is the authentication step of Bluetooth pairing, ensuring the correct device is being paired with.", 1),
      Q("An organization allows employees to enroll their personal phones for corporate email while restricting corporate data with a management profile. What model does this describe?", "BYOD (Bring Your Own Device)", ["Corporate-owned device configuration", "Tethering", "APIPA"], "Bring Your Own Device (BYOD) is an MDM configuration model where employees use personally owned hardware enrolled under corporate policy enforcement.", 1),
      Q("Which mobile location technology can determine a device's position indoors, where GPS signals are typically weak or unavailable?", "Cellular location services", ["SIM swapping", "eSIM provisioning", "Bluetooth pairing"], "Cellular (and Wi-Fi) location services triangulate position using nearby towers/access points, which works better indoors than GPS satellite signals.", 1),
      Q("A user is warned they are about to exceed their monthly mobile plan allotment while streaming video over cellular. What mobile device synchronization concept does this describe?", "Recognizing data caps", ["Calendar sync", "Contact sync", "Cloud storage sync"], "Recognizing data caps refers to monitoring and warning users about cellular data usage limits imposed by their carrier plan.", 1),
      Q("Which component would a technician check first if a tablet's on-screen keyboard stops responding to touch in one specific area of the screen?", "Digitizer", ["Inverter", "Wireless card", "Microphone"], "The digitizer is the touch-sensing layer; localized dead zones for touch input point to a digitizer issue rather than the display panel itself.", 1),
      Q("A company issues corporate smartphones and pushes required apps, restricts the camera, and enforces a passcode policy remotely. Which technology enables this?", "Mobile device management (MDM)", ["NFC pairing", "Tethering", "eSIM"], "MDM software lets an organization enforce policies, push corporate applications, and manage configurations on enrolled corporate or BYOD devices.", 1),
      Q("A laptop's keyboard has several keys that have stopped registering input, while the rest work fine. What is the most direct fix?", "Replace the keyboard assembly", ["Replace the wireless card", "Replace the inverter", "Reinstall the OS"], "A keyboard with multiple dead keys, especially in a cluster, usually points to a failing keyboard membrane/assembly that needs replacement.", 1),
      Q("Which mobile hardware component converts the low-voltage DC signal into the higher voltage needed to power a CCFL backlight on older LCD laptop screens?", "Inverter", ["Digitizer", "Wireless card", "Docking station"], "The inverter boosts DC voltage to the level required by a CCFL backlight; failing inverters commonly cause dim or flickering older laptop displays.", 1),
      Q("A user wants to add extended battery life to an older laptop by carrying a spare charged battery. Which mobile hardware component are they replacing/swapping?", "Battery", ["RAM", "SSD", "Camera/webcam"], "Swapping in a charged spare battery replaces the primary power source, extending runtime away from an outlet.", 1),
      Q("Which accessory is specifically designed for precise handwriting or drawing input on a touchscreen tablet?", "Stylus", ["Webcam", "Headset", "Port replicator"], "A stylus provides fine-tipped, pressure-sensitive input for handwriting, sketching, or precise navigation on touchscreens.", 1),
      Q("A conference room laptop needs a single cable connection to simultaneously provide external monitor output, wired network, and extra USB ports. What device is best suited?", "Docking station", ["Stylus", "Speaker", "Webcam"], "A docking station consolidates video, network, and USB expansion into a single connector, ideal for quickly connecting a laptop to peripherals.", 1),
      Q("Which short-range wireless technology is most associated with pairing a wireless keyboard, mouse, or headset to a laptop?", "Bluetooth", ["NFC", "Cellular data", "RFID"], "Bluetooth is the standard short-range wireless technology for pairing peripherals such as keyboards, mice, and headsets.", 1),
      Q("A corporate MDM enforces a 6-digit passcode and can remotely wipe a lost phone. Which MDM capability makes the remote wipe possible?", "Enrollment of the device under the MDM so policies and remote actions apply", ["A longer cellular contract", "Enabling the device hotspot", "Installing a larger battery"], "Devices must be enrolled/managed by the MDM; enrollment is what lets it enforce passcodes and push remote-wipe or lock commands.", 1),      Q("A phone uses an embedded, non-removable chip to store carrier profile information instead of a physical card. What is this called?", "eSIM", ["NFC chip", "TPM", "Digitizer"], "An eSIM (embedded SIM) is soldered into the device and can be provisioned with carrier profiles digitally, without a removable physical SIM card.", 1),
      Q("Which mobile synchronization category ensures a user's meeting appointments update across their phone, tablet, and desktop automatically?", "Calendar sync", ["Data cap tracking", "Business application (mail)", "Cloud storage"], "Calendar synchronization keeps appointment data consistent across all of a user's enrolled devices in near real time.", 1),
      Q("A technician needs to determine whether a tablet's poor Wi-Fi reception is caused by the antenna or the wireless card. Which is more likely if signal strength varies noticeably depending on how the device is physically held?", "The antenna or its connector/placement", ["The wireless card's firmware", "The battery", "The digitizer"], "Signal strength that changes with how a device is physically oriented or held often points to an antenna or antenna-connector issue rather than the card itself.", 1),
      Q("Which biometric technology captures a unique pattern from a fingertip pressed against a small sensor, often built into a phone's power button?", "Fingerprint biometric sensor", ["Facial recognition camera", "Near-field scanner for payments", "Iris scanner only"], "A fingerprint sensor reads the unique ridge pattern of a fingertip and is commonly embedded in a phone's power button or home button.", 1),
      Q("A phone's front camera fails to focus and produces consistently blurry selfies, while the rear camera works fine. What is the most likely cause?", "A hardware fault in the front camera module", ["A corrupted wireless card driver", "A failing digitizer", "A depleted eSIM profile"], "Since only the front camera is affected, the issue is isolated to that specific camera module rather than a broader system or software issue.", 1),
    ],
    labs: ['la-ports', 'la-laptop'],
    gateN: 20
  });

  // ---- labs for this stage ----
  L['la-ports'] = { kind: 'match', title: 'Match the connector to its job', sum: 'Mobile ports & wireless → use',
    brief: 'Pick the right technology for each mobile-device need.',
    options: ['USB-C / Thunderbolt', 'Bluetooth', 'NFC', 'Wi-Fi', 'Cellular (hotspot)', 'GPS', 'Docking station'],
    items: [
      { t: 'One reversible cable for data, external display and charging', a: 'USB-C / Thunderbolt', why: 'Alt mode carries DisplayPort video plus data and power.' },
      { t: 'Pair a wireless mouse or headset to the laptop', a: 'Bluetooth', why: 'Short-range peripheral pairing.' },
      { t: 'Tap the phone on a reader to pay', a: 'NFC', why: 'A few centimeters of range.' },
      { t: 'Share the phone\'s internet with a laptop in a coffee shop', a: 'Cellular (hotspot)', why: 'The phone bridges cellular data to Wi-Fi.' },
      { t: 'Turn-by-turn navigation outdoors', a: 'GPS', why: 'Needs a view of the sky to lock satellites.' },
      { t: 'Connect to the office network for file shares', a: 'Wi-Fi', why: 'Local wireless networking.' },
      { t: 'Plug in once at the desk and get monitor, keyboard, wired network and power', a: 'Docking station', why: 'One connector expands to many ports.' }
    ],
    hints: ['Tap-to-pay is the shortest range of all.', 'A hotspot turns cellular into Wi-Fi for other devices.'],
    debrief: 'Knowing which radio or port solves a need is a daily help-desk skill and a frequent exam target.' };

  L['la-laptop'] = { kind: 'order', title: 'Replace a laptop battery safely', sum: 'Order the service steps',
    brief: 'Put the steps for safely replacing a laptop battery in order.',
    items: [
      { t: 'Check the manufacturer service manual for this exact model', why: 'Procedures and screws differ; always confirm first.' },
      { t: 'Power off the laptop and unplug the AC adapter', why: 'Remove external power before opening.' },
      { t: 'Put on an anti-static (ESD) strap and work on a grounded mat', why: 'Protect components from static discharge.' },
      { t: 'Remove the access panel and disconnect the battery connector', why: 'Disconnect internal power before handling parts.' },
      { t: 'Remove the old battery and inspect for swelling or damage', why: 'Note hazards; a swollen cell needs safe disposal.' },
      { t: 'Install the new battery, reconnect it, and reassemble', why: 'Reverse the disassembly.' },
      { t: 'Power on, verify charging, and recycle the old battery properly', why: 'Confirm the fix and dispose of lithium-ion safely.' }
    ],
    hints: ['Documentation first; disposal last.', 'Power down and remove AC before touching anything inside.'],
    debrief: 'Manual → power down → ESD protection → work → verify → safe disposal is the shape of almost every hardware repair.' };
})();

/* A+ Core 1 — 2.0 Networking */
(function () {
  var S = COURSE.stages, Q = window.Q, T = window.TYPE, L = COURSE.labs;

  S.push({
    id: 'a2', track: 'core1', tier: 'c1-net', title: 'Networking fundamentals', code: 'A2-PACKETS-AND-PORTS',
    goal: 'Ports and protocols, the devices that move traffic, Wi-Fi standards, IP addressing, and setting up a small office / home network.',
    lesson: [
      { h: 'Ports & protocols you must memorize', html: '<table><tr><th>Port</th><th>Protocol</th><th>Use</th></tr><tr><td>20/21</td><td>FTP</td><td>File transfer (insecure)</td></tr><tr><td>22</td><td>SSH / SFTP</td><td>Secure remote shell & file copy</td></tr><tr><td>23</td><td>Telnet</td><td>Remote shell (insecure)</td></tr><tr><td>25</td><td>SMTP</td><td>Send email</td></tr><tr><td>53</td><td>DNS</td><td>Name → IP</td></tr><tr><td>67/68</td><td>DHCP</td><td>Hand out IP addresses</td></tr><tr><td>80</td><td>HTTP</td><td>Web (insecure)</td></tr><tr><td>110</td><td>POP3</td><td>Receive email (download)</td></tr><tr><td>143</td><td>IMAP</td><td>Receive email (sync)</td></tr><tr><td>161/162</td><td>SNMP</td><td>Monitor/manage devices</td></tr><tr><td>389</td><td>LDAP</td><td>Directory lookups</td></tr><tr><td>443</td><td>HTTPS</td><td>Secure web (TLS)</td></tr><tr><td>445</td><td>SMB</td><td>Windows file sharing</td></tr><tr><td>3389</td><td>RDP</td><td>Remote Desktop</td></tr></table><p><b>TCP</b> is connection-oriented and reliable (web, email, file transfer); <b>UDP</b> is fast and connectionless (DNS queries, DHCP, streaming, VoIP).</p>' },
      { h: 'Devices & IP addressing', html: '<ul><li><b>Switch</b> connects devices inside a LAN using MAC addresses; <b>router</b> connects different networks and is the <b>default gateway</b> off the LAN; <b>access point</b> adds Wi-Fi; a home "router" is usually all three plus a firewall.</li><li><b>IPv4</b> is 32 bits (e.g. 192.168.1.10) with a <b>subnet mask</b> (/24 = 255.255.255.0). Private ranges: <b>10.0.0.0/8</b>, <b>172.16.0.0/12</b>, <b>192.168.0.0/16</b> — not routable on the Internet, so <b>NAT</b> translates them to one public address.</li><li><b>APIPA</b> (169.254.x.x) means the client could not reach a <b>DHCP</b> server. <b>Loopback</b> is 127.0.0.1.</li><li>A host needs four things: IP, subnet mask, <b>default gateway</b>, and <b>DNS server</b>. DNS resolves names; DHCP leases the addresses automatically.</li><li><b>IPv6</b> is 128 bits in hex; it has no broadcast and does not need NAT.</li></ul>' },
      { h: 'Wi-Fi & the SOHO network', html: '<ul><li>Standards: <b>802.11n</b> (Wi-Fi 4, 2.4/5 GHz), <b>ac</b> (Wi-Fi 5, 5 GHz), <b>ax</b> (Wi-Fi 6/6E, adds 6 GHz). <b>2.4 GHz</b> goes farther and through walls but is slower and crowded (use channels 1, 6, 11); <b>5/6 GHz</b> is faster with shorter range.</li><li>Secure Wi-Fi with <b>WPA3</b> (or WPA2-AES); avoid WEP/WPA/TKIP. <b>WPS</b> PIN is easily brute-forced — disable it.</li><li>SOHO setup: change default admin credentials, set a strong SSID passphrase, update firmware, enable the firewall, and use <b>DHCP reservations</b> or <b>port forwarding</b> only as needed.</li><li>Internet access types: <b>fiber</b> (fastest), <b>cable</b> (coax/DOCSIS), <b>DSL</b> (phone line), <b>cellular</b>, <b>satellite</b> (high latency), and legacy <b>fixed wireless</b>.</li></ul>' }
    ],
    cards: [
      ['TCP vs UDP', 'TCP = reliable/ordered (web, email); UDP = fast/connectionless (DNS, DHCP, VoIP).'],
      ['Default gateway', 'The router address a host uses to reach other networks.'],
      ['DNS (53)', 'Resolves names to IP addresses.'],
      ['DHCP (67/68)', 'Automatically leases IP, mask, gateway and DNS to clients.'],
      ['APIPA 169.254.x.x', 'Self-assigned address — the client could not reach DHCP.'],
      ['Private ranges', '10/8, 172.16/12, 192.168/16 — need NAT to reach the Internet.'],
      ['HTTPS (443)', 'Secure web over TLS; HTTP (80) is unencrypted.'],
      ['RDP (3389)', 'Windows Remote Desktop.'],
      ['SMB (445)', 'Windows file and printer sharing.'],
      ['WPA3', 'Current Wi-Fi security; avoid WEP/WPA/TKIP.'],
      ['2.4 vs 5 GHz', '2.4 = range/penetration, slower; 5 = speed, shorter range.'],
      ['NAT', 'Translates many private addresses to one public IP.'],
      ['Subnet mask /24', '255.255.255.0 — first three octets are the network.'],
      ['ONT / modem', 'Converts the ISP signal (fiber/cable/DSL) to Ethernet.']
    ],
    qs: [
      Q("Which port does HTTPS use by default?", "443", ["21", "80", "3389"], "HTTPS (secure web traffic) uses TCP port 443 by default, while unencrypted HTTP uses port 80.", 2),
      Q("A technician needs to securely copy files to a remote Linux server using an encrypted terminal session. Which port/protocol pair is used?", "22 - SSH", ["23 - Telnet", "25 - SMTP", "110 - POP3"], "SSH (port 22) provides an encrypted remote shell and secure file transfer, replacing the unencrypted Telnet (port 23).", 2),
      Q("Which protocol resolves human-readable domain names like example.com into IP addresses?", "DNS", ["DHCP", "LDAP", "NTP"], "DNS (port 53) translates domain names into IP addresses so devices can locate each other on a network.", 2),
      Q("A workstation is configured to automatically request an IP address, subnet mask, and gateway from the network. Which protocol provides this on ports 67/68?", "DHCP", ["FTP", "SMB", "RDP"], "Dynamic Host Configuration Protocol (DHCP) automatically leases IP addressing information to clients using UDP ports 67 (server) and 68 (client).", 2),
      Q("Which port is used by Remote Desktop Protocol (RDP) to remotely control a Windows machine's desktop?", "3389", ["445", "389", "143"], "RDP uses TCP port 3389 to provide a full graphical remote desktop session to a Windows system.", 2),
      Q("A file share on a Windows network is accessed using SMB. Which port does this use?", "445", ["110", "53", "23"], "Server Message Block (SMB), used for Windows file and printer sharing, communicates over TCP port 445.", 2),
      Q("Which of these protocols is connection-oriented and guarantees delivery through acknowledgments and retransmission?", "TCP", ["UDP", "ICMP", "ARP"], "TCP is connection-oriented, using a handshake and acknowledgments to guarantee ordered, reliable delivery, unlike the connectionless UDP.", 2),
      Q("An office wants a wireless frequency band with the least interference from older devices such as cordless phones and microwaves, at the cost of shorter range. Which should they choose?", "5GHz", ["2.4GHz", "900MHz", "AM band"], "5GHz offers more non-overlapping channels and less interference from common household devices than 2.4GHz, though at shorter range.", 2),
      Q("Which wireless technology is used for passive inventory tags that are read by a nearby scanner without a battery?", "RFID", ["Bluetooth", "NFC", "802.11ac"], "Radio-frequency identification (RFID) tags, especially passive ones, are powered by the reader's signal and used widely for inventory tracking.", 2),
      Q("A network appliance filters incoming email for spam and malware attachments before it reaches the mail server. What is this device called?", "Spam gateway", ["Load balancer", "Proxy server", "Syslog server"], "A spam gateway inspects and filters inbound/outbound email traffic to block spam and malicious content before delivery.", 2),
      Q("Which network appliance distributes incoming client requests across multiple servers to prevent any single server from being overwhelmed?", "Load balancer", ["UTM", "Proxy server", "Syslog collector"], "A load balancer distributes traffic across multiple backend servers for performance and redundancy.", 2),
      Q("A factory uses legacy embedded systems to monitor and control industrial equipment like pumps and valves remotely. What is this type of system called?", "SCADA", ["IoT thermostat", "SOHO router", "VLAN"], "Supervisory Control and Data Acquisition (SCADA) systems are legacy embedded systems used to monitor and control industrial processes.", 2),
      Q("Which DNS record type maps a domain name directly to an IPv4 address?", "A", ["AAAA", "CNAME", "MX"], "An A record maps a hostname to an IPv4 address; the AAAA record does the same for IPv6.", 2),
      Q("An email domain publishes a TXT record listing the servers authorized to send mail on its behalf, in order to reduce spoofing. What is this record?", "SPF", ["MX", "CNAME", "AAAA"], "Sender Policy Framework (SPF) is a TXT record specifying which mail servers are authorized to send email for a domain, helping combat spoofing.", 2),
      Q("A DHCP administrator wants a specific server to always receive the same IP address from the DHCP pool. What should they configure?", "A DHCP reservation", ["A DHCP exclusion", "A DHCP scope", "APIPA"], "A DHCP reservation binds a specific MAC address to a specific IP address within the scope, so that device always leases the same address.", 2),
      Q("Which device logically separates a single physical switch into multiple isolated broadcast domains?", "VLAN", ["Patch panel", "PoE injector", "ONT"], "A Virtual LAN (VLAN) segments a physical switch into multiple logically isolated networks, each its own broadcast domain.", 2),
      Q("A technician needs to power a ceiling-mounted wireless access point through the same cable that carries its data, with no nearby electrical outlet. What technology should be used?", "Power over Ethernet (PoE)", ["eSATA", "USB-C", "Thunderbolt"], "PoE delivers electrical power over standard Ethernet cabling, eliminating the need for a separate power connection at devices like APs and cameras.", 2),
      Q("A device receives no DHCP response on the network and self-assigns an address in the 169.254.x.x range. What is this behavior called?", "APIPA", ["NAT", "VLAN tagging", "DNS caching"], "Automatic Private IP Addressing (APIPA) assigns a 169.254.x.x address when a DHCP server cannot be reached, indicating a network connectivity issue.", 2),
      Q("Which internet connection type uses light pulses through glass strands and offers the highest typical bandwidth with low latency?", "Fiber", ["DSL", "Satellite", "Cellular"], "Fiber optic connections transmit data as light through glass fibers, delivering very high bandwidth and low latency compared to copper or satellite links.", 2),
      Q("A remote cabin with no cable or DSL availability uses a dish aimed at an orbiting relay for internet access, at the cost of high latency. Which connection type is this?", "Satellite", ["WISP", "Fiber", "Cellular"], "Satellite internet routes data through an orbiting satellite, which provides coverage in remote areas but introduces significant latency due to the distance signals travel.", 2),
      Q("A technician uses a handheld device to trace a specific cable through a wall by sending a tone down it and listening with a probe at the far end. What tool combination is this?", "Toner probe", ["Cable tester", "Crimper", "Loopback plug"], "A toner probe (tone generator and probe) injects an audible signal onto a cable so a technician can trace it through walls or bundles.", 2),
      Q("Which port is used by the insecure, plaintext remote terminal protocol that has largely been replaced by SSH?", "23", ["21", "110", "443"], "Telnet uses port 23 and transmits data, including credentials, in plaintext, which is why SSH (port 22) is preferred today.", 2),
      Q("An administrator configures a mail server to both send (port 25) and let clients retrieve messages while keeping them synced across multiple devices. Which retrieval protocol supports that synchronized, multi-device behavior best?", "IMAP", ["POP3", "FTP", "Telnet"], "IMAP keeps mail synchronized on the server and across multiple devices, unlike POP3, which typically downloads and often removes mail from the server.", 2),
      Q("Which protocol and port combination is used by legacy Windows file/printer sharing broadcasts, distinct from modern SMB port 445?", "137-139 - NetBIOS/NetBT", ["389 - LDAP", "3389 - RDP", "53 - DNS"], "NetBIOS over TCP/IP (NetBT) operates on ports 137-139 and predates the modern SMB direct-hosting approach on port 445.", 2),
      Q("A directory service query for user account information over an unencrypted connection typically uses which port?", "389 - LDAP", ["443 - HTTPS", "110 - POP3", "25 - SMTP"], "LDAP (Lightweight Directory Access Protocol) uses port 389 for unencrypted directory queries; LDAPS (encrypted) uses port 636.", 2),
      Q("Which protocol favors speed over reliability, has no built-in handshake or delivery guarantee, and is commonly used for streaming and VoIP?", "UDP", ["TCP", "SMB", "LDAP"], "UDP is connectionless and does not guarantee delivery or order, trading reliability for lower overhead, which suits latency-sensitive traffic like streaming and VoIP.", 2),
      Q("Which frequency band offers the greatest wall-penetration range for Wi-Fi at the cost of more channel congestion in a typical home?", "2.4GHz", ["5GHz", "6GHz", "60GHz"], "Lower frequencies like 2.4GHz travel farther and penetrate walls better, though they are more prone to interference from other devices sharing that band.", 2),
      Q("An 802.11 wireless standard is chosen specifically because it introduces the newest features in the 6GHz band with additional channels. Which standard is this most likely to be?", "802.11ax (Wi-Fi 6E)", ["802.11n", "802.11ac", "802.11g"], "Wi-Fi 6E (based on 802.11ax) extends operation into the 6GHz band, offering more available channels and less congestion than older standards.", 2),

    lesson: [

      { h: 'Motherboard, CPU & expansion', html: '<ul><li>Form factors by size: <b>ATX</b> &gt; <b>microATX</b> &gt; <b>Mini-ITX</b>. The <b>chipset</b> and <b>CPU socket</b> must match the processor.</li><li>CPUs: <b>x86/x64</b> vs <b>ARM</b> (phones, Apple Silicon — low power). Features: multiple <b>cores</b>, <b>threads</b> (hyper-threading), and <b>virtualization</b> support (Intel VT-x / AMD-V) enabled in UEFI/BIOS.</li><li>Expansion: <b>PCIe</b> slots (x1, x4, x8, x16 for GPUs). <b>UEFI/BIOS</b> firmware holds boot order, Secure Boot and the <b>RTC battery (CMOS)</b> that keeps time/settings — a dead CMOS battery resets the clock and settings.</li><li>Cooling: heat sinks, fans, thermal paste; good airflow prevents thermal shutdowns.</li></ul>' },

})();

/* A+ Core 1 — 4.0 Virtualization & Cloud */
(function () {
  var S = COURSE.stages, Q = window.Q, T = window.TYPE, L = COURSE.labs;

  S.push({
    id: 'a4', track: 'core1', tier: 'c1-virt', title: 'Virtualization & cloud', code: 'A4-MACHINES-ON-MACHINES',
    goal: 'Cloud service and deployment models, their key traits, and running virtual machines on a client PC.',
    lesson: [
      { h: 'Cloud models', html: '<ul><li><b>Service models</b>: <b>IaaS</b> (you rent VMs/storage/networking and manage the OS up), <b>PaaS</b> (you deploy apps on a managed platform), <b>SaaS</b> (you just use the software — Microsoft 365, Google Workspace).</li><li><b>Deployment models</b>: <b>public</b> (shared provider), <b>private</b> (your own), <b>hybrid</b> (both, working together), <b>community</b> (shared by similar orgs).</li><li><b>Key traits</b>: <b>on-demand self-service</b>, <b>rapid elasticity</b> (scale up/down automatically), <b>measured/metered usage</b> (pay for what you use), <b>resource pooling</b>, and broad network access. <b>High availability</b> spreads workloads so one failure doesn\'t take the service down.</li><li>File sync services keep data consistent across devices; be mindful of sync conflicts and storage limits.</li></ul>' },
      { h: 'Client-side virtualization', html: '<ul><li>A <b>hypervisor</b> runs virtual machines. <b>Type 1</b> runs directly on hardware (servers); <b>Type 2</b> runs as an app on your OS (VirtualBox, VMware Workstation, Hyper-V on a desktop).</li><li>Requirements: enough <b>CPU cores, RAM and disk</b>, and <b>virtualization enabled in UEFI/BIOS</b> (Intel VT-x / AMD-V). Without it, VMs won\'t start or run slowly.</li><li>Uses: testing, sandboxing suspicious software, running legacy or other operating systems, and training labs. A <b>sandbox</b> isolates risky code from the host.</li><li>VMs share the host\'s resources, so over-committing RAM/CPU slows everything. Each VM gets a <b>virtual NIC</b> (bridged, NAT, or host-only networking).</li></ul>' }
    ],
    cards: [
      ['IaaS', 'Rent infrastructure (VMs, storage); you manage the OS and up.'],
      ['PaaS', 'Managed platform to deploy apps; provider handles the OS/runtime.'],
      ['SaaS', 'Finished software you just use (M365, Google Workspace).'],
      ['Public / private / hybrid', 'Shared provider / your own / a combination.'],
      ['Rapid elasticity', 'Scale resources up and down automatically on demand.'],
      ['Measured service', 'Pay only for what you use (metered).'],
      ['Type 1 hypervisor', 'Runs on bare metal (servers).'],
      ['Type 2 hypervisor', 'Runs as an app on your desktop OS.'],
      ['VT-x / AMD-V', 'CPU virtualization enabled in UEFI/BIOS; required for VMs.'],
      ['Sandbox', 'Isolated environment to run risky or untrusted software safely.'],
      ['High availability', 'Design so one failure does not take the service down.'],
      ['Virtual NIC modes', 'Bridged (on the LAN), NAT (shares host IP), host-only (isolated).']
    ],
    qs: [
      Q("A developer wants to test a new application in an isolated environment without risking the host system, and plans to discard the environment afterward. What is the best use of a VM here?", "Sandbox", ["Desktop virtualization", "Public cloud IaaS", "Load balancing"], "A sandbox VM provides an isolated, disposable environment ideal for testing potentially unstable or unknown software safely.", 4),
      Q("An organization runs an old accounting application that only supports a legacy operating system no longer installed on any physical machines. Which virtualization use case addresses this?", "Application virtualization for legacy software/OS", ["Cross-platform virtualization only", "Type 1 hypervisor on bare desktop", "Containerization only"], "Running the legacy OS inside a VM lets the old application continue functioning on modern hardware without requiring dedicated legacy machines.", 4),
      Q("Which hypervisor type runs directly on server hardware without a host operating system underneath it, typically used in datacenters?", "Type 1 (bare-metal)", ["Type 2 (hosted)", "Container runtime only", "Desktop emulator"], "A Type 1 hypervisor installs directly on the hardware (bare-metal), offering better performance and is common in enterprise/datacenter deployments.", 4),
      Q("A hypervisor such as VirtualBox or VMware Workstation runs as an application on top of Windows. What type of hypervisor is this?", "Type 2", ["Type 1", "Container engine", "Bare-metal"], "A Type 2 (hosted) hypervisor runs as an application on top of an existing host operating system, unlike a Type 1 which runs directly on hardware.", 4),
      Q("Which virtualization technology packages an application with its dependencies but shares the host OS kernel, making it more lightweight than a full VM?", "Container", ["Type 1 hypervisor", "VDI session", "Sandbox VM"], "Containers share the host operating system's kernel and package only the application and its dependencies, making them more lightweight than full VMs.", 4),
      Q("Employees connect from thin clients to centrally hosted desktop sessions running on datacenter servers. What is this architecture called?", "VDI (Virtual Desktop Infrastructure)", ["IaaS", "Community cloud", "SCADA"], "Virtual Desktop Infrastructure (VDI) hosts full desktop operating systems centrally, letting users connect remotely from thin clients or other devices.", 4),
      Q("A cloud provider allows a company to rent virtual servers, storage, and networking, while the company manages its own OS and applications on top. What cloud service model is this?", "IaaS", ["SaaS", "PaaS", "DaaS"], "Infrastructure as a Service (IaaS) provides virtualized compute, storage, and network resources, leaving the OS and application layer to the customer.", 4),
      Q("A cloud environment automatically adds or removes virtual server instances based on real-time demand. Which cloud characteristic does this describe?", "Elasticity", ["Multitenancy", "Metered utilization", "File synchronization"], "Elasticity is the ability of a cloud environment to automatically scale resources up or down in response to changing demand.", 4),
      Q("Several unrelated organizations share the same underlying physical cloud infrastructure while their data remains logically isolated from each other. What is this called?", "Multitenancy", ["Private cloud", "Community cloud", "VDI"], "Multitenancy describes multiple customers (tenants) sharing the same physical infrastructure in a public cloud, with logical separation of their data.", 4),
      Q("Several hospitals within the same healthcare network jointly fund and share a cloud environment tailored to their shared regulatory needs, but it is not open to the general public. What cloud model is this?", "Community cloud", ["Public cloud", "Private cloud", "Hybrid cloud"], "A community cloud is shared by several organizations with common concerns (such as compliance requirements), and access is restricted to that community rather than the general public.", 4),
      Q("A software company wants developers to test their app across Windows, macOS, and Linux without owning separate physical machines for each. Which VM use case fits best?", "Cross-platform virtualization", ["SCADA monitoring", "PoE injection", "RAID striping"], "Cross-platform virtualization lets a single physical host run VMs of different guest operating systems, enabling multi-OS testing without dedicated hardware for each.", 4),
      Q("Which resource requirement is most critical to plan for when hosting many VMs on a single server, since each guest OS consumes its own share continuously?", "RAM (memory) allocation", ["Bluetooth pairing", "NFC range", "RFID tag count"], "Because each VM runs its own OS instance, sufficient RAM allocation across all guests is one of the most critical resource planning factors on a virtualization host.", 4),
      Q("Which virtualization requirement addresses isolating VM network traffic from other tenants or VMs on the same physical host?", "Network requirements (segmentation/isolation)", ["Storage requirements", "CPU core count", "Cooling requirements"], "Proper network configuration, including VLANs or virtual switches, is required to isolate and secure traffic between VMs sharing a physical host.", 4),
      Q("Which hypervisor type would a home user most likely install to run a single VM on their existing Windows gaming PC?", "Type 2 (hosted) hypervisor", ["Type 1 (bare-metal) hypervisor", "SCADA controller", "Container orchestrator only"], "A Type 2 hosted hypervisor, like VirtualBox or VMware Workstation, installs as an application on an existing OS, which is the typical setup for home/desktop use.", 4),
      Q("A datacenter runs dozens of VMs directly on server hardware with no underlying general-purpose OS, maximizing performance and resource allocation. Which hypervisor type is this?", "Type 1 (bare-metal)", ["Type 2 (hosted)", "Container runtime only", "Emulator"], "Type 1 (bare-metal) hypervisors install directly on server hardware, avoiding the overhead of a host OS and offering better performance for many VMs.", 4),
      Q("Which cloud model would best fit a startup that wants to avoid owning any physical servers and rents shared infrastructure from a major provider available to the general public?", "Public cloud", ["Private cloud", "Community cloud", "On-premises datacenter"], "A public cloud is owned and operated by a third-party provider and made available to the general public/multiple customers on shared infrastructure.", 4),
      Q("A large enterprise maintains its own dedicated cloud infrastructure, accessible only to its internal departments, for strict regulatory reasons. What cloud model is this?", "Private cloud", ["Public cloud", "Community cloud", "Hybrid cloud"], "A private cloud is dedicated to a single organization, offering greater control, often chosen to meet strict security or regulatory requirements.", 4),
      Q("An organization keeps sensitive data on-premises but bursts additional compute capacity into a public cloud provider during peak demand. What cloud model combines these?", "Hybrid cloud", ["Community cloud", "Private cloud only", "IaaS only"], "A hybrid cloud combines private/on-premises infrastructure with public cloud resources, allowing workloads to move between them as needed.", 4),
      Q("A company subscribes to a web-based email and office suite, accessing it entirely through a browser without installing or managing any servers. What cloud service model is this?", "SaaS", ["IaaS", "PaaS", "VDI"], "Software as a Service (SaaS) delivers a fully managed application over the internet, with the provider handling the underlying infrastructure and platform.", 4),
      Q("A developer deploys application code to a managed cloud platform that automatically handles the underlying OS, runtime, and scaling, letting them focus only on code. What cloud service model is this?", "PaaS", ["IaaS", "SaaS", "On-premises virtualization"], "Platform as a Service (PaaS) provides a managed runtime/platform layer so developers can deploy code without managing servers or OS patching themselves.", 4),
    ],
    labs: ['la-cloud'],
    gateN: 16
  });

  L['la-cloud'] = { kind: 'match', title: 'Classify the cloud scenario', sum: 'Match each example to its model',
    brief: 'Pick the cloud service or deployment model each scenario describes.',

    items: [
      { t: 'A company uses Microsoft 365 email and Office apps in the browser', a: 'SaaS', why: 'Finished software, nothing to manage.' },

      { t: 'A team rents virtual machines and installs their own OS and software', a: 'IaaS', why: 'They manage the OS and up.' },
      { t: 'Servers automatically add capacity during a traffic spike, then shrink', a: 'Rapid elasticity', why: 'Scales on demand.' },
      { t: 'Sensitive workloads stay in the company\'s own data center only', a: 'Private cloud', why: 'Owned and operated internally.' },
      { t: 'Everyday apps run in the public cloud but regulated data stays on-prem, linked together', a: 'Hybrid cloud', why: 'Public and private working together.' },
      { t: 'A startup uses a shared provider like AWS or Azure with no hardware of its own', a: 'Public cloud', why: 'Shared multi-tenant provider.' }
    ],
    hints: ['IaaS = you manage the OS; PaaS = you manage the app; SaaS = you just use it.', 'Hybrid mixes public and private.'],
    debrief: 'Sorting a scenario into the right model is exactly how the exam tests cloud, and how you advise a customer.' };
})();
