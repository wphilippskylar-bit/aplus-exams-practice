/* A+ Core 1 — 5.0 Hardware & Network Troubleshooting (+ Core 1 exam-ready capstone) */
(function () {
  var S = COURSE.stages, Q = window.Q, T = window.TYPE, L = COURSE.labs;

  S.push({
    id: 'a5', track: 'core1', tier: 'c1-ts', title: 'Hardware & network troubleshooting', code: 'A5-ISOLATE-THE-FAULT',
    goal: 'The CompTIA troubleshooting method, then the symptoms and fixes for power, POST, storage, display, network and printer problems.',
    lesson: [
      { h: 'The CompTIA troubleshooting method', html: '<ol><li><b>Identify the problem</b> — gather information, question the user, back up before changes, note what changed.</li><li><b>Establish a theory</b> of probable cause (question the obvious).</li><li><b>Test the theory.</b> If confirmed, continue; if not, form a new one or escalate.</li><li><b>Establish a plan of action</b> and consider the impact.</li><li><b>Implement</b> the solution or escalate.</li><li><b>Verify full functionality</b> and apply preventive measures.</li><li><b>Document</b> findings, actions and outcomes.</li></ol><p>Memorize this order — the exam tests which step comes next.</p>' },
      { h: 'Power, POST & component symptoms', html: '<ul><li><b>No power at all</b>: check outlet, PSU switch/voltage, power button header; a failing PSU can cause random reboots.</li><li><b>POST beeps / no display</b>: reseat RAM and GPU; a dead <b>CMOS battery</b> resets time and BIOS settings.</li><li><b>Overheating / thermal shutdown</b>: clean dust, check fans, reapply thermal paste.</li><li><b>Storage</b>: clicking/grinding + S.M.A.R.T. warnings = failing HDD — back up now; slow boot often means a dying drive or full disk.</li><li><b>Burning smell / smoke</b>: power off immediately (PSU or capacitor failure).</li></ul>' },
      { h: 'Display, network & printer symptoms', html: '<ul><li><b>Dim display (image faintly visible)</b>: backlight/inverter; <b>no image but system runs</b>: check brightness, external-display toggle, cable, GPU.</li><li><b>Flickering/artifacts</b>: cable, GPU or driver; <b>dead pixels</b>: panel.</li><li><b>No network</b>: check link lights, cable, that the NIC has a valid IP (not 169.254.x.x = DHCP problem); <b>intermittent Wi-Fi</b>: interference, channel, distance, or a weak signal.</li><li>Printers: <b>streaks</b> (inkjet: clean/align heads; laser: drum/toner), <b>ghosting</b> (laser fuser/drum), <b>paper jams</b> (rollers, wrong paper), <b>garbled output</b> (wrong driver), <b>faded print</b> (low toner/ink).</li></ul>' }
    ],
    cards: [
      ['Step 1', 'Identify the problem (gather info, back up, note changes).'],
      ['Step 6', 'Verify full functionality and apply preventive measures.'],
      ['Last step', 'Document findings, actions and outcomes.'],
      ['Swollen/clicking drive', 'Failing — back up immediately; S.M.A.R.T. warns early.'],
      ['Dead CMOS battery', 'Clock resets, BIOS settings lost, boot errors.'],
      ['Dim LCD', 'Backlight or inverter (image still faintly visible).'],
      ['169.254.x.x', 'APIPA — DHCP not reachable; no real network access.'],
      ['Burning smell/smoke', 'Power off immediately — PSU/capacitor failure.'],
      ['Thermal shutdown', 'Dust, failed fan, or dried thermal paste.'],
      ['Garbled print', 'Usually the wrong or corrupt printer driver.'],
      ['Laser ghosting', 'Faint repeat image — drum or fuser issue.'],
      ['No POST', 'Reseat RAM/GPU; listen for beep codes.']
    ],
    qs: [
      Q("A desktop emits a series of beeps on startup and does not display any video. What should a technician suspect first?", "A POST (power-on self-test) failure, likely RAM or video card", ["A printer driver conflict", "A DNS resolution failure", "A Bluetooth pairing failure"], "Beep codes occur during POST when the system detects a critical hardware failure before video output initializes, often pointing to RAM, video, or other core components.", 5),
      Q("A PC intermittently reboots and the case feels unusually warm to the touch. What is the most likely cause?", "Inadequate cooling — dust buildup, a failing fan, or dried thermal paste", ["A corrupt display driver", "An expired security certificate", "A full DNS cache"], "A hot chassis with unexpected reboots points to thermal protection kicking in; clean the fans/vents and reapply thermal paste before suspecting software.", 5),
      Q("A user reports their PC's clock keeps resetting to 2002 every time it's powered off. What is the most likely cause?", "A dead CMOS battery", ["A failing power supply fan", "A corrupted printer driver", "A missing DHCP reservation"], "A depleted CMOS battery causes the BIOS/UEFI to lose its saved date/time and other settings whenever the system loses power.", 5),
      Q("A technician opens a case and notices several motherboard capacitors are visibly bulging at the top. What should they conclude?", "The capacitors are failing and the board likely needs replacement", ["This is normal wear and no action is needed", "The PSU wattage is too low", "The RAM needs reseating"], "Bulging or swollen capacitors are a classic sign of capacitor failure, often leading to instability, and typically require motherboard replacement.", 5),
      Q("A hard drive makes a repeated clicking sound and Windows can no longer detect it. What does this most likely indicate?", "Mechanical failure of the drive (e.g., failing read/write heads)", ["A loose HDMI cable", "A driver update is needed", "The drive needs to be defragmented"], "Repeated clicking noises from a mechanical hard drive typically indicate the read/write head is failing to find data correctly, a sign of imminent drive failure.", 5),
      Q("A RAID 5 array reports one failed drive but the array continues to function normally. What should the technician do?", "Replace the failed drive promptly to restore redundancy before a second failure occurs", ["Ignore it since the array still works", "Convert it to RAID 0 immediately", "Reformat all drives in the array"], "RAID 5 can tolerate a single drive failure using parity, but the array is running in a degraded state; a second failure before the disk is replaced would cause data loss.", 5),
      Q("S.M.A.R.T. monitoring on a drive reports a predictive failure warning. What should a technician do?", "Immediately back up data and plan to replace the drive", ["Ignore the warning since S.M.A.R.T. is often wrong", "Run a full format to clear the warning", "Increase the drive's spindle speed"], "S.M.A.R.T. predictive failure alerts indicate the drive is reporting internal errors consistent with impending failure; data should be backed up and the drive replaced.", 5),
      Q("A projected image is present but appears washed out and significantly darker than expected. What is the most likely cause?", "An aging or failing bulb", ["Incorrect subnet mask", "A missing printer driver", "A failed RAID array"], "As projector bulbs age, brightness gradually degrades, producing a dim image; a dying bulb is the most common cause of this symptom.", 5),
      Q("A monitor displays a persistent faint image of a previously static desktop icon, even after changing the wallpaper. What is this called?", "Display burn-in", ["Dead pixel", "Incorrect input source", "Sizing issue"], "Burn-in occurs when a static image is displayed for a prolonged period, leaving a faint permanent ghost image on the panel.", 5),
      Q("A user's external monitor shows the wrong content source, cycling between a blank screen and a 'no signal' message. What is the first thing to check?", "That the correct input source is selected on the monitor", ["The RAID configuration", "The DNS server address", "The printer's toner level"], "Many monitors have multiple inputs (HDMI, DisplayPort, VGA); selecting the wrong one commonly produces a no-signal or blank screen.", 5),
      Q("A smartphone discharges from full to empty in under three hours with little use, and the phone runs hot. What should a technician check FIRST?", "Background apps/processes and the battery's health in settings", ["The SIM card slot", "The display's refresh rate", "The DNS server"], "A rogue background process or a degraded cell causes fast drain and heat; review battery usage per app and the battery health report before replacing hardware.", 5),
      Q("After a phone is dropped in a puddle, it powers on but touch input is erratic in random locations. What is this called?", "Digitizer issues (following liquid damage)", ["Cursor drift/touch calibration only", "Poor battery health", "Stylus does not work"], "Liquid intrusion can damage the digitizer layer, causing erratic or unresponsive touch input (digitizer issues) in addition to other potential liquid damage symptoms.", 5),
      Q("A laptop trackpad cursor drifts on its own and occasionally registers phantom taps. What is the BEST first fix?", "Update/adjust the touchpad driver and recalibrate sensitivity (disable it if a USB mouse is used)", ["Replace the entire display assembly", "Reinstall the operating system", "Replace the CMOS battery"], "Erratic trackpad behavior is usually a driver/calibration or palm-sensitivity issue; update the driver and recalibrate before replacing hardware.", 5),      Q("Users on one wireless network have connections that drop for a few seconds and reconnect all day. Which is the MOST likely cause to check first?", "RF interference or channel overlap / an overloaded access point (check channels, signal and AP load)", ["A failed power supply in each laptop", "An expired TLS certificate", "A dead CMOS battery"], "Intermittent Wi-Fi drops point to the RF environment: interference, channel overlap, weak signal or an overloaded access point.", 5),      Q("A network switch port's link light rapidly turns on and off as the connection repeatedly comes up and goes down. What is this called?", "Port flapping", ["Jitter", "External interference", "Authentication failure"], "Port flapping describes a switch interface repeatedly transitioning between up and down states, often due to a bad cable, NIC, or duplex mismatch.", 5),
      Q("During a VoIP call, users hear audio arriving with inconsistent, uneven delay between packets, distorting the conversation. What network symptom is this?", "Jitter", ["High latency (steady delay)", "Port flapping", "Authentication failure"], "Jitter refers to variation in packet arrival timing, which is especially disruptive for real-time traffic like VoIP, causing choppy or distorted audio.", 5),
      Q("A wireless network in a warehouse experiences poor throughput specifically near a bank of running forklifts and microwave ovens. What is the likely cause?", "External interference", ["Port flapping", "DNS misconfiguration", "RAID failure"], "Certain equipment (motors, microwaves) emits radio interference in the same frequency bands used by Wi-Fi, degrading wireless performance nearby.", 5),
      Q("Employees repeatedly fail to log into a domain resource despite entering the correct password, and the account eventually locks. What category of network issue is this?", "Authentication failure", ["Jitter", "Port flapping", "External interference"], "Authentication failures occur when credentials, time sync, or account status prevent successful login, and repeated failures can trigger account lockout policies.", 5),
      Q("A printer produces a page with a faint vertical line running down every printout. What is the most likely cause on a laser printer?", "A scratch or defect on the imaging drum", ["A jammed paper tray sensor", "A DNS misconfiguration", "A failed power supply"], "A consistent vertical line/streak on every laser-printed page is typically caused by a scratch, groove, or debris on the drum unit, which repeats each rotation.", 5),
      Q("Print jobs sent from multiple users are stuck showing as 'pending' and never begin printing. What is a likely first troubleshooting step?", "Restart the print spooler service", ["Replace the toner cartridge", "Recalibrate the printer's color settings", "Replace the fuser"], "A frozen or stuck print queue is commonly resolved by restarting the print spooler service, which manages queued print jobs on the system.", 5),
      Q("An inkjet printer produces prints with visible fine dot patterns scattered across otherwise blank areas of the page. What is this defect called?", "Speckling", ["Garbled print", "Double/echo image", "Paper jam"], "Speckling refers to unwanted small dots appearing on the printed page, often from a dirty printhead, contaminated ink, or debris inside the printer.", 5),
      Q("A printout shows a faint, shifted duplicate of the same image slightly offset from the original. What is this printing defect called?", "Double/echo image", ["Speckling", "Faded print", "Garbled print"], "A double or echo image is a shifted secondary copy of the printed content, commonly caused by a drum or transfer roller issue on a laser printer.", 5),
      Q("A page comes out of the printer with distorted, unreadable characters instead of the correct text. What is this most likely caused by?", "A corrupt or mismatched print driver", ["A dirty printhead only", "A paper jam sensor fault", "Low toner"], "Garbled print, where text appears as random or corrupted characters, is most often caused by an incorrect, corrupt, or mismatched print driver.", 5),
      Q("After clearing a paper jam, a laser printer's display continues to show a jam error and will not print. What should be checked next?", "Whether any torn paper fragments remain inside the paper path", ["The DNS server settings", "The Wi-Fi password", "The RAID configuration"], "Persistent jam errors after clearing a visible jam often mean small torn paper fragments remain in the path and are still triggering the paper sensors.", 5),
      Q("A finishing stapler on a multifunction printer periodically jams and refuses to staple collated documents. What component/feature is affected?", "Finishing (staple jam)", ["Fuser assembly", "ADF pickup roller", "Toner cartridge"], "Staple jams fall under the finishing category of printer issues, distinct from core print-engine problems like fuser or toner faults.", 5),
      Q("A desktop powers on, fans spin, but there is absolutely no video output and no beep codes at all. What should a technician check first?", "Whether the video cable is connected to the correct port (discrete GPU vs. onboard)", ["The DNS server address", "The printer spooler service", "The Wi-Fi password"], "A common cause of 'no video, no beeps' is the monitor cable being plugged into onboard video when a discrete GPU is installed (or vice versa), which the system doesn't flag as an error.", 5),
      Q("A PC will not power on at all — no lights, no fans, nothing. What should a technician check first?", "The power cable, outlet, and PSU switch", ["The RAID configuration", "The DNS settings", "The Bluetooth pairing"], "When a system shows absolutely no signs of power, basic power delivery, the cable, outlet, surge protector, and PSU switch, should always be checked first.", 5),
      Q("A system runs fine for a few minutes then shuts down abruptly under any sustained load, such as gaming or rendering. What should be investigated first?", "Overheating (CPU/GPU thermal shutdown)", ["A missing printer driver", "A DNS misconfiguration", "An HDMI cable issue"], "Shutdowns that occur specifically under sustained load strongly suggest thermal protection triggering due to inadequate cooling or a buildup of dust.", 5),
      Q("A user reports a burning smell coming from the computer case. What is the correct immediate action?", "Power off and unplug the system immediately, then inspect for damaged components", ["Continue running it since it may just be dust burning off", "Increase the fan speed and keep working", "Reboot the system to see if the smell goes away"], "A burning smell indicates a potential electrical fault or component failure; the system should be powered down and unplugged immediately to prevent fire or further damage.", 5),
      Q("A system exhibits sluggish performance days after a malware infection was supposedly removed. What should be verified next?", "That the malware removal was fully successful and no remnants remain running", ["That the RAID array is rebuilding", "That the projector bulb is not burnt out", "That the printer queue is not frozen"], "Continued sluggishness after a claimed malware removal warrants re-scanning to confirm no malicious processes or remnants remain active.", 5),
      Q("An external hard drive is not recognized by any USB port on a laptop, though it lights up when connected. What should be tried next?", "Test the drive on a different computer or with a different cable to isolate the fault", ["Reformat the internal drive", "Replace the laptop's motherboard", "Update the printer driver"], "Isolating the variable, trying a different host or cable, helps determine whether the fault lies with the drive, the cable, or the original system's ports.", 5),
      Q("A RAID array shows as 'missing' entirely in the OS, though all drives appear to spin up normally. What should be checked first?", "The RAID controller configuration and cabling", ["The printer's ink level", "The Wi-Fi antenna placement", "The projector's bulb life"], "If drives are powered but the array itself isn't recognized, the RAID controller's configuration, firmware, or cabling to the drives is the most likely point of failure.", 5),
      Q("A storage array reports unusually low input/output operations per second (IOPS), causing sluggish database performance. What could explain this on a spinning-disk array?", "The array may be degraded (a failed drive) or drives may be reaching their mechanical performance limits under heavy load", ["The printer driver is outdated", "The DHCP scope is exhausted", "The DNS cache is corrupted"], "Low IOPS on spinning disks can result from a degraded array recalculating parity, drive contention, or simply exceeding the mechanical throughput of HDDs under load.", 5),
      Q("A monitor displays a single pixel that is always black regardless of what's on screen. What is this called?", "A dead pixel", ["Burn-in", "Incorrect input source", "Sizing issue"], "A dead pixel fails to illuminate at all and remains black regardless of the displayed image, unlike a stuck pixel which is locked to one color.", 5),
      Q("A projected image intermittently flickers and the projector shuts off on its own every 10-15 minutes, especially in a warm room. What is the most likely cause?", "Overheating causing intermittent projector shutdown", ["A missing HDMI driver", "A dead pixel on the projector panel", "Incorrect color display calibration"], "Projectors that shut down intermittently, especially in warm environments, often suffer from inadequate cooling or blocked vents triggering thermal protection.", 5),
      Q("An image on an external monitor appears stretched horizontally and doesn't fill the screen correctly. What category of issue is this?", "Sizing/scaling issue (often incorrect resolution or aspect ratio setting)", ["Dead pixel", "Burnt-out bulb", "Audio issue"], "Stretching or incorrect proportions usually indicate the display resolution or scaling setting doesn't match the monitor's native aspect ratio.", 5),
      Q("A tablet's screen shows visible spider-web cracks after being dropped, but the display still lights up and shows an image. What is the correct classification of this symptom?", "Broken screen", ["Digitizer issue", "Poor battery health", "Liquid damage"], "Visible physical cracking of the glass/panel from an impact is classified as a broken screen, distinct from digitizer/touch issues, which relate to input responsiveness.", 5),
      Q("After a phone's charging port is bent from rough handling, the device will only charge intermittently when the cable is held at a certain angle. What is this classified as?", "A physically damaged port", ["Poor battery health", "Malware", "Cursor drift"], "A bent or damaged charging port causing inconsistent contact is classified as physical port damage, distinct from a battery health issue.", 5),
      Q("A phone's performance has steadily degraded over many months, with apps taking longer to open even after a factory reset. What symptom best matches this?", "Degraded performance (often from aging storage/battery or accumulated background processes)", ["Broken screen", "Liquid damage", "Stylus does not work"], "Gradual, month-over-month slowdown that persists even after a reset points to hardware-level degraded performance, such as aging flash storage or battery throttling.", 5),

      Q("Which Windows file system supports large volume sizes, journaling, and file/folder permissions, and is the default for Windows installations?", "NTFS", ["FAT32", "exFAT", "ext4"], "NTFS is the default modern Windows file system, supporting journaling, large file/volume sizes, and granular permissions, unlike FAT32/exFAT.", 1),

      Q("Which Windows tool displays real-time CPU, memory, disk, and network utilization, and allows ending unresponsive processes?", "Task Manager", ["Event Viewer", "Certificate Manager", "Local Group Policy Editor"], "Task Manager shows live resource usage across processes, users, startup items, and services, and lets a technician end tasks directly.", 1),

      Q("Which boot method allows a technician to install an OS over the network without any local removable media?", "PXE (network boot)", ["USB boot", "Internal hard drive boot", "Multiboot"], "Preboot eXecution Environment (PXE) boot lets a machine load an OS installer image directly over the network, useful for mass deployments.", 1),
      Q("A technician wants to install Windows on a new PC while completely erasing any existing data and configuration. What type of installation is this?", "Clean install", ["In-place upgrade", "Multiboot install", "Image deployment restore"], "A clean install wipes the target drive and installs the OS fresh, as opposed to an in-place upgrade which preserves existing files, apps, and settings.", 1),

      Q("Which Windows 11 hardware requirement is a dedicated security chip that stores cryptographic keys and enables features like Secure Boot integration?", "TPM", ["UEFI legacy CSM", "VRAM", "ECC RAM"], "Windows 11 requires a Trusted Platform Module (TPM), typically version 2.0, along with UEFI firmware, as part of its minimum hardware requirements.", 1),
      Q("A user account on a shared computer should be able to browse the internet and use installed apps but should not be able to install new software or change system settings. What account type fits best?", "Standard account", ["Administrator account", "Guest account with admin rights", "Domain Admin"], "A standard account allows normal day-to-day use without the ability to make system-wide changes or install software requiring elevation, unlike an administrator account.", 1),
      Q("Which Windows feature prompts a user for confirmation (or credentials) before allowing an action that requires administrative privileges?", "User Account Control (UAC)", ["BitLocker", "EFS", "Group Policy"], "User Account Control (UAC) intercepts privileged actions and requires explicit confirmation or elevated credentials before they proceed.", 1),

      Q("Which NTFS concept determines whether a file or folder automatically receives the permissions set on its parent folder?", "Inheritance", ["Explicit share permission", "File encryption", "Disk quota"], "Inheritance allows permissions applied to a parent folder to automatically propagate down to child files and subfolders unless explicitly blocked.", 1),

    lesson: [
      { h: 'Threats & social engineering', html: '<ul><li><b>Social engineering</b>: <b>phishing</b> (email), <b>spear phishing</b> (targeted), <b>vishing</b> (voice), <b>smishing</b> (SMS), <b>tailgating</b> (follow someone through a door), <b>shoulder surfing</b>, <b>impersonation</b>, <b>dumpster diving</b>, <b>pretexting</b>.</li><li><b>Malware</b>: <b>virus</b> (needs a host), <b>worm</b> (self-spreads), <b>Trojan</b> (disguised), <b>ransomware</b> (encrypts for payment), <b>spyware/keylogger</b>, <b>rootkit</b> (hides deep), <b>cryptominer</b>, <b>botnet</b> zombie.</li><li>Attacks: <b>DoS/DDoS</b>, <b>on-path</b> (man-in-the-middle), <b>brute force / dictionary</b>, <b>zero-day</b>, <b>SQL injection</b>, <b>XSS</b>.</li></ul>' },
      { h: 'Access control & authentication', html: '<ul><li><b>MFA</b> combines factors: something you <b>know</b> (password/PIN), <b>have</b> (token, phone, smart card), <b>are</b> (biometric), and sometimes <b>where</b>/<b>do</b>.</li><li><b>Least privilege</b>, strong unique passwords, account lockout, and disabling unused accounts. <b>Principle of least privilege</b> limits damage.</li><li>Directory & logon: <b>Active Directory</b> domains, <b>Group Policy</b>, login scripts; local vs Microsoft accounts.</li><li>Data protection: <b>BitLocker</b> (full-disk, Pro+), <b>EFS</b> (file-level), and <b>NTFS vs Share permissions</b> — the <b>most restrictive</b> of the two wins across the network; NTFS also applies locally.</li></ul>' },
      { h: 'Physical, wireless & best practices', html: '<ul><li>Physical: locks, badge readers, <b>access control vestibule (mantrap)</b>, cameras, cable locks, privacy screens, secure server rooms.</li><li>Wireless: <b>WPA3</b> (or WPA2-AES); <b>WPA3-Personal</b> uses a passphrase (SAE), <b>Enterprise</b> uses 802.1X/RADIUS for per-user logins. Disable <b>WPS</b>, hide nothing in place of real encryption, change default SSID/credentials.</li><li>Hardening: patch/update, antivirus/anti-malware, host firewall, disable AutoRun, remove bloatware, and use <b>screen locks</b> and <b>encryption</b> on mobile devices. <b>Secure boot</b> and <b>UEFI passwords</b> protect the boot path.</li><li>Disposal: wipe/degauss/destroy drives before recycling; follow data-retention and privacy rules.</li></ul>' }

    qs: [
      Q("Which wireless security protocol replaced WPA2 and introduces stronger encryption along with protections like forward secrecy?", "WPA3", ["WEP", "TKIP", "Open authentication"], "WPA3 is the current wireless security standard, offering stronger encryption and protections such as forward secrecy compared to WPA2.", 2),
      Q("Which outdated wireless encryption protocol is now considered fundamentally broken and should never be used?", "WEP", ["WPA3", "WPA2-Enterprise", "AES-CCMP"], "Wired Equivalent Privacy (WEP) has well-known cryptographic weaknesses and can be cracked quickly; it should never be used on modern networks.", 2),

      Q("An email urgently asks an employee to wire money to a new vendor account, impersonating the CEO. What social engineering / attack category best describes this?", "Business Email Compromise (BEC)", ["Shoulder surfing", "Tailgating", "Dumpster diving"], "Business Email Compromise (BEC) involves impersonating a trusted figure, often an executive, via email to trick an employee into a fraudulent transfer or action.", 2),
      Q("An attacker follows closely behind an authorized employee through a secured door without badging in themselves. What social engineering technique is this?", "Tailgating", ["Phishing", "Vishing", "Shoulder surfing"], "Tailgating (or piggybacking) is gaining unauthorized physical access by following someone with legitimate access through a secured entrance.", 2),
      Q("A caller pretends to be from IT support over the phone, asking an employee to read back their password to 'verify their account.' What is this attack called?", "Vishing", ["Tailgating", "Dumpster diving", "Zero-day exploit"], "Vishing (voice phishing) uses phone calls to trick victims into revealing sensitive information or credentials.", 2),
      Q("Malware that appears to be a legitimate free utility, but secretly installs a backdoor once run, is best classified as which type?", "Trojan", ["Worm", "Ransomware", "Rootkit"], "A Trojan disguises itself as legitimate or desirable software while covertly performing malicious actions once executed.", 2),
      Q("Malware self-replicates and spreads across a network by exploiting vulnerabilities, without needing a user to open a file. What type of malware is this?", "Worm", ["Trojan", "Keylogger", "Adware"], "A worm is self-propagating malware that spreads automatically across networks by exploiting vulnerabilities, unlike a virus which needs a host file.", 2),
      Q("Malware encrypts all of a victim's files and displays a message demanding payment for the decryption key. What type of malware is this?", "Ransomware", ["Spyware", "Adware", "Worm"], "Ransomware encrypts a victim's data and demands payment (a ransom) in exchange for the decryption key.", 2),
      Q("Malware embeds itself deep in the OS kernel to hide its own presence and that of other malicious processes from normal detection tools. What is this called?", "Rootkit", ["Adware", "Keylogger", "Trojan"], "A rootkit gains privileged, kernel-level access specifically to conceal itself and other malware from standard detection and monitoring tools.", 2),
      Q("Which malware type silently records every keystroke a user types, including passwords, and sends the data to an attacker?", "Keylogger", ["Adware", "Worm", "Ransomware"], "A keylogger captures keystrokes, often to steal credentials or sensitive information, and transmits them to the attacker.", 2),
      Q("During SOHO malware remediation, after quarantining an infected system, what step should typically come next?", "Disable System Restore (on Windows Home) before remediating", ["Immediately enable System Restore", "Reconnect the system to the network", "Delete all user data"], "Disabling System Restore before remediation prevents the infection from being reintroduced via an infected restore point during cleanup.", 2),
      Q("After successfully removing malware from a workstation, what should a technician do before considering the incident closed?", "Educate the end user on how the infection likely occurred", ["Immediately reformat unrelated systems", "Disable the antivirus software", "Delete all system logs"], "User education helps prevent reinfection by addressing the behavior or vulnerability (e.g., clicking a phishing link) that led to the original infection.", 2),
      Q("Which authentication factor category does a fingerprint scan belong to?", "Something you are", ["Something you know", "Something you have", "Somewhere you are"], "A fingerprint is a biometric trait, classified as 'something you are' in multifactor authentication models.", 2),
      Q("A user logs in with a password and then must also approve a push notification on their registered phone. What security concept does this combination demonstrate?", "Multifactor authentication (MFA)", ["Single sign-on (SSO)", "Role-based access control", "Least privilege"], "Requiring both a password (something you know) and a phone approval (something you have) is a practical example of multifactor authentication.", 2),
      Q("A company wants users to log in once and gain access to multiple integrated applications without re-entering credentials for each one. What does this describe?", "Single sign-on (SSO)", ["Multifactor authentication", "BitLocker", "Role separation"], "Single sign-on (SSO) allows a user to authenticate once and gain access to multiple connected services without logging in separately to each.", 2),
      Q("Which principle states that users and processes should be granted only the minimum access necessary to perform their job functions?", "Least privilege", ["Zero trust", "Non-repudiation", "Defense in depth"], "The principle of least privilege limits accounts and processes to only the access rights required to perform their specific tasks, reducing overall risk.", 2),

      Q("A company disables USB ports on workstations in a secure lab to prevent data exfiltration via removable media. What category of security control is this?", "Workstation hardening technique", ["Wireless security protocol", "MFA method", "Malware type"], "Restricting physical ports like USB is a hardening technique aimed at reducing the attack surface and preventing data loss via removable devices.", 2),
      Q("A security policy mandates that after several failed login attempts, an account is temporarily locked. What is this policy designed to prevent?", "Brute-force password attacks", ["Phishing", "Tailgating", "Rootkit installation"], "Account lockout policies slow or prevent brute-force attacks that repeatedly guess passwords by locking the account after a set number of failed attempts.", 2),

      Q("A coworker glances at a user's screen and monitor to catch a glimpse of their typed password. What is this called?", "Shoulder surfing", ["Vishing", "Dumpster diving", "Tailgating"], "Shoulder surfing is observing someone's screen or keyboard, often to steal credentials or sensitive information, typically in person.", 2),

      Q("Which wireless authentication mode requires each device to use a shared passphrase, commonly seen on home routers rather than enterprise networks?", "WPA2/WPA3-Personal", ["WPA2/WPA3-Enterprise", "802.1X only", "RADIUS-only mode"], "Personal mode (PSK) uses a single shared passphrase for all devices, appropriate for home/small networks, unlike Enterprise mode's per-user RADIUS authentication.", 2),

      Q("An attacker sends a fraudulent email that appears to come from a bank, directing the victim to a fake login page to harvest credentials. What is this attack called?", "Phishing", ["Tailgating", "Dumpster diving", "Rootkit installation"], "Phishing uses deceptive emails or messages, often impersonating a trusted entity, to trick victims into revealing credentials or clicking malicious links.", 2),

      Q("After quarantining an infected system, which anti-malware related step should be performed before running scans to ensure detection is effective?", "Update the anti-malware software's definitions", ["Disable the firewall", "Enable macros in Office", "Delete all system restore points immediately"], "Updating anti-malware definitions before scanning ensures the tool can detect the latest known threats, improving remediation effectiveness.", 2),
      Q("Which authentication factor category does a physical security key (like a USB hardware token) belong to?", "Something you have", ["Something you know", "Something you are", "Somewhere you are"], "A hardware token or security key is a physical object the user possesses, classified as 'something you have' in authentication factor models.", 2),

      Q("A company requires that no single employee can both approve and process a financial payment, splitting the responsibilities between two people. What security principle is this?", "Separation of duties", ["Least privilege", "Single sign-on", "Multifactor authentication"], "Separation of duties divides critical tasks between multiple people, reducing the risk of fraud or error by any single individual acting alone.", 2),
      Q("A company enforces a policy assuming no user or device should be automatically trusted, requiring continuous verification regardless of network location. What security model is this?", "Zero trust", ["Least privilege only", "Single sign-on", "Role-based access control only"], "Zero trust assumes no implicit trust for any user or device, inside or outside the network perimeter, and requires continuous verification for access.", 2),
      Q("Which Windows security feature specifically encrypts removable USB drives so their data is unreadable if lost or stolen?", "BitLocker To Go", ["EFS", "Share permissions", "Windows Hello"], "BitLocker To Go extends BitLocker's full-volume encryption specifically to removable drives like USB flash drives.", 2),
      Q("A workstation is hardened by disabling AutoRun for removable media, in addition to disabling unused ports. What threat does disabling AutoRun primarily reduce?", "Automatic execution of malware from an infected USB drive", ["Phishing emails", "Tailgating", "Weak passwords"], "Disabling AutoRun prevents malicious code on removable media from automatically launching the moment a device is connected.", 2),
      Q("An organization requires all laptops to have their local firewall enabled and antivirus running before being allowed to connect to internal network resources. What security concept is being enforced?", "Endpoint/workstation security hardening as a connection prerequisite (posture check)", ["Chain of custody", "Change management", "Asset tagging"], "Requiring a minimum security posture (firewall, antivirus) before granting network access is a hardening/compliance check to reduce the risk introduced by unmanaged devices.", 2),

      Q("An organization requires visitors to be escorted at all times while inside secured areas of the building. What physical security concept does this address?", "Preventing tailgating/unauthorized access by unescorted individuals", ["Malware prevention", "Password complexity", "Data encryption"], "Escort requirements for visitors are a physical security control aimed at preventing unauthorized individuals from wandering unsupervised in secured areas.", 2),
      Q("A company's password policy requires a minimum length, a mix of character types, and periodic expiration. What is this policy category called?", "Password complexity/policy requirements", ["Least privilege", "Chain of custody", "Asset tagging"], "Password policies define requirements like minimum length, complexity, and expiration to reduce the likelihood of successful password-guessing attacks.", 2),
      Q("Which security control specifically limits which MAC addresses are permitted to connect to a given switch port?", "Port security (MAC filtering)", ["BitLocker", "EFS", "UAC"], "Port security restricts a switch port to only accept traffic from specific, authorized MAC addresses, helping prevent unauthorized device connections.", 2),
      Q("A user reports that a coworker was able to see their password as they typed it on a shared kiosk. What preventive control best addresses this going forward?", "A privacy screen and better physical positioning of the keyboard/monitor", ["A stronger firewall rule", "A longer DHCP lease", "A new DNS server"], "Privacy screens and thoughtful physical layout reduce the risk of shoulder surfing on shared or public terminals.", 2),
      Q("Which malware defense technique involves regularly updating software and operating systems to close known vulnerabilities before they can be exploited?", "Patch management", ["Port flapping mitigation", "VLAN tagging", "RAID configuration"], "Patch management, keeping software and OS updated, closes known security vulnerabilities before attackers can exploit them.", 2),
      Q("An organization segments its guest Wi-Fi network from its internal corporate network using a separate VLAN and firewall rules. What is the primary security benefit?", "Preventing untrusted guest devices from directly accessing internal corporate resources", ["Improving Wi-Fi signal range", "Reducing electricity usage", "Improving printer speed"], "Network segmentation isolates untrusted guest traffic from sensitive internal resources, limiting the potential impact of a compromised guest device.", 2),

    id: 'b3', track: 'core2', tier: 'c2-swts', title: 'Software troubleshooting', code: 'B3-FIX-THE-SOFTWARE',

    lesson: [
      { h: 'OS & boot problems', html: '<ul><li><b>Won\'t boot</b>: check boot order, failed drive, corrupt bootloader. Use <b>Startup Repair</b>, <b>Safe Mode</b>, <b>Last Known Good</b>, <b>System Restore</b>, or <b>bootrec</b> / <b>sfc</b>.</li><li><b>Blue Screen (BSOD) / spinning pinwheel</b>: often a bad driver, failing RAM/disk, or a recent update — note the stop code, boot to Safe Mode, roll back the driver/update.</li><li><b>Slow performance</b>: too many startup apps (MSConfig/Task Manager), low disk space, fragmentation (HDD), malware, or failing hardware.</li><li><b>Services not starting / crashing apps</b>: check Event Viewer, reinstall or repair the app, update, verify dependencies.</li></ul>' },
      { h: 'Malware removal — the 7 steps', html: '<ol><li><b>Investigate and verify</b> malware symptoms.</li><li><b>Quarantine</b> the infected system (disconnect from the network).</li><li><b>Disable System Restore</b> (Windows) so you don\'t re-infect from a restore point.</li><li><b>Remediate</b>: update anti-malware definitions, then scan and remove (boot to Safe Mode or use a rescue environment if needed).</li><li><b>Schedule scans and run updates.</b></li><li><b>Re-enable System Restore</b> and create a fresh restore point.</li><li><b>Educate the end user</b> to prevent reinfection.</li></ol>' },
      { h: 'Application & mobile software issues', html: '<ul><li>App won\'t install/open: check <b>compatibility</b>, permissions, corrupt install (repair/reinstall), missing dependencies, or insufficient resources.</li><li>Mobile symptoms: fast <b>battery drain</b> or overheating (rogue app, bad signal), <b>no connectivity</b> (airplane mode, Wi-Fi/Bluetooth, APN), frozen/slow (close apps, reboot, update), <b>app crashes</b> (clear cache, reinstall), and <b>high data usage</b>.</li><li>Security symptoms: unexpected pop-ups, redirected browser, new toolbars, fake security alerts, leaked personal files — treat as malware and follow the removal steps.</li><li>Always <b>back up</b> before major fixes, and verify the fix held before closing the ticket.</li></ul>' }

    cards: [

      ['BSOD stop code', 'Note it — points at a driver, RAM or disk.'],
      ['Startup Repair / bootrec', 'Fix a corrupt bootloader / boot config.'],
      ['Malware step 2', 'Quarantine (disconnect from the network).'],
      ['Malware step 3', 'Disable System Restore before cleaning.'],
      ['Malware last step', 'Educate the end user.'],
      ['MSConfig / Task Manager', 'Disable unneeded startup apps for slow boots.'],

      ['Battery drain', 'Rogue app, poor signal, or background sync.'],
      ['Browser redirect/pop-ups', 'Treat as malware; run the removal steps.'],

    qs: [
      Q("A Windows PC displays a blue screen with a stop code and reboots unexpectedly. What is this commonly known as?", "BSOD (Blue Screen of Death)", ["Boot loop", "Kernel panic", "Grey screen error"], "A Blue Screen of Death (BSOD) is a Windows stop error indicating a serious system fault, often caused by a driver, hardware, or kernel-level issue.", 3),
      Q("A Windows computer restarts repeatedly right after the manufacturer logo appears, never fully reaching the desktop. What is this symptom called?", "Boot loop", ["BSOD", "Slow profile load", "Application crash"], "A boot loop occurs when the system continually restarts before completing startup, often due to corrupted system files or a failing update.", 3),
      Q("A user reports that Windows takes several minutes to reach the desktop after login, though the machine performs normally once loaded. What should a technician check first?", "Startup programs and services launching automatically", ["The printer's toner level", "The RAID array status", "The projector bulb"], "Excessive startup programs and services are a very common cause of slow boot/login times and should be reviewed first, e.g., via Task Manager's Startup tab.", 3),
      Q("A specific application crashes immediately every time it's launched, while all other applications run fine. What is a good first troubleshooting step?", "Reinstall or repair the application", ["Reinstall the entire operating system", "Replace the hard drive", "Update the BIOS"], "When only one application consistently crashes, reinstalling or repairing that specific application (fixing corrupted files) is the appropriate first step.", 3),
      Q("A Windows system is running extremely slowly, with high disk activity even when idle. Which built-in tool best helps identify the responsible process?", "Task Manager's Processes/Performance tab", ["Disk Management", "Local Users and Groups", "Certificate Manager"], "Task Manager's Processes and Performance tabs show real-time CPU, memory, and disk usage per process, helping pinpoint what's consuming resources.", 3),
      Q("After a failed update, Windows will not boot normally. Which built-in recovery option lets a technician boot with only essential drivers and services loaded?", "Safe Mode", ["Fast Startup", "Sleep mode", "Airplane mode"], "Safe Mode boots Windows with a minimal set of drivers and services, useful for troubleshooting issues that prevent a normal boot, including bad updates or drivers.", 3),
      Q("A user's mouse pointer freezes and the whole system becomes completely unresponsive to any input. What is this described as?", "A system lock-up/freeze", ["A slow profile load", "A failed print job", "A blue screen"], "A total freeze or lock-up describes a system that stops responding entirely to keyboard/mouse input, often requiring a hard reset.", 3),

      Q("After removing malware, a technician wants to confirm no traces remain and system files are intact. Which built-in Windows tool checks and repairs protected system files?", "System File Checker (sfc /scannow)", ["Disk Cleanup", "Task Scheduler", "Certificate Manager"], "System File Checker (sfc /scannow) scans protected system files for corruption and attempts to repair them using cached copies.", 3),
      Q("A mobile app on a smartphone repeatedly force-closes shortly after opening. Which troubleshooting step is most appropriate first?", "Clear the app's cache/data or reinstall the app", ["Factory reset the entire phone", "Replace the battery", "Disable cellular data permanently"], "Clearing an app's cache/data or reinstalling it addresses corrupted local app data, which is a common and less drastic cause of repeated crashing.", 3),
      Q("A smartphone user is unable to install any new applications, receiving a storage error each time. What should be checked first?", "Available internal storage space", ["The Wi-Fi password", "The wallpaper settings", "The wireless card"], "Insufficient storage space is the most common cause of failed app installations; freeing up space usually resolves the error.", 3),
      Q("A Windows machine shows a 'disk full' error even though Explorer reports plenty of free space remaining. What might explain this discrepancy?", "Hidden system files, shadow copies, or a corrupted file system reporting incorrect free space", ["A missing NIC driver", "An expired TPM certificate", "A jammed paper tray"], "Discrepancies between reported free space and actual disk state can result from restore points/shadow copies, hidden data, or file system corruption needing a check disk.", 3),
      Q("After a driver update, a video card starts showing graphical artifacts and random screen corruption. What is a reasonable first step?", "Roll back the driver to the previous version", ["Replace the motherboard", "Reinstall the OS from scratch", "Reformat the hard drive"], "Rolling back to the previously working driver is a quick, low-risk way to resolve graphical issues introduced by a recent driver update.", 3),
      Q("An application repeatedly prompts for activation even though a valid license key was entered correctly. What Windows tool can help review detailed licensing/activation status?", "Command Prompt slmgr utility / Settings Activation page", ["Disk Management", "Device Manager", "Local Group Policy Editor"], "Windows provides the slmgr command-line tool and the Settings Activation page to review and troubleshoot license activation status in detail.", 3),
      Q("A user reports their browser homepage keeps changing to an unfamiliar search site, and unwanted toolbars have appeared. What is this most likely caused by?", "A potentially unwanted program (PUP) or browser hijacker", ["A failing power supply", "A RAID failure", "A printer driver conflict"], "Unexpected homepage/search engine changes and unwanted toolbars are classic symptoms of a browser hijacker or potentially unwanted program (PUP).", 3),
      Q("A user's profile takes an unusually long time to load at sign-in, but only on this one particular user account. What is a likely cause?", "A corrupted user profile", ["A failing power supply", "A bad RAID controller", "A missing printer driver"], "When slow logon is isolated to one specific user profile, profile corruption is a common cause, often resolved by creating a fresh profile.", 3),
      Q("A Windows update fails repeatedly with the same error code each time it's attempted. What built-in tool can automatically detect and fix common Windows Update issues?", "Windows Update Troubleshooter", ["Disk Cleanup", "Local Users and Groups", "Character Map"], "The built-in Windows Update Troubleshooter checks for and automatically repairs common causes of failed updates, such as corrupted update components.", 3),
      Q("After installing a new peripheral, Device Manager shows a yellow exclamation mark next to the device. What does this typically indicate?", "A driver problem or resource conflict", ["A successful, fully functioning installation", "A firewall block", "A DNS resolution error"], "A yellow exclamation point in Device Manager indicates a driver issue or resource conflict preventing the device from functioning correctly.", 3),
      Q("A user's email client repeatedly asks for their password, even though it was entered correctly, and fails to sync new mail. What is a likely first step?", "Verify the account's server settings and confirm the password hasn't expired or changed", ["Reinstall the entire operating system", "Replace the SSD", "Disable Windows Update"], "Persistent authentication prompts in email are often caused by an expired/changed password or incorrect server settings, which should be verified first.", 3),
      Q("A specific application throws 'missing DLL' errors on launch after another program was recently uninstalled. What likely happened?", "The uninstalled program removed a shared DLL file still needed by the other application", ["The OS license expired", "The GPU driver is outdated", "The disk is out of space"], "Some uninstallers remove shared library (DLL) files that other applications also depend on, causing 'missing DLL' errors in the remaining software.", 3),
      Q("A laptop's touchpad and keyboard both stop responding only within a specific application, while working fine everywhere else in Windows. What does this suggest?", "The application itself is frozen/unresponsive rather than a hardware failure", ["The touchpad hardware has failed", "The keyboard hardware has failed", "The wireless card has failed"], "If input devices work normally outside one specific application, the issue is isolated to that unresponsive application rather than the input hardware itself.", 3),
      Q("A Windows PC hangs on a black screen with only a cursor visible, never reaching the login screen. What is a reasonable early troubleshooting step?", "Boot into Safe Mode to isolate whether a driver or startup app is at fault", ["Replace the motherboard immediately", "Reformat the drive without further diagnosis", "Replace the power supply"], "Safe Mode loads a minimal environment, helping determine whether a driver, startup program, or shell extension is preventing normal boot.", 3),
      Q("After a Windows Update, a user's display resolution and drivers appear to have reverted to a generic default. What should be checked first?", "Whether the video/graphics driver needs to be reinstalled or updated after the update", ["The RAID configuration", "The DNS servers", "The printer spooler"], "Windows Updates occasionally replace a manufacturer's graphics driver with a generic one; reinstalling or updating the correct driver typically resolves this.", 3),

      Q("A user reports that Windows repeatedly reinstalls a driver they previously removed, causing an old, incompatible peripheral to reappear. What Windows feature is likely responsible?", "Windows Update's automatic driver installation", ["System File Checker", "Disk Cleanup", "Local Group Policy"], "Windows Update can automatically reinstall drivers for detected hardware unless explicitly prevented, which explains a driver reappearing after removal.", 3),

      Q("A user's mobile email app fails to sync new messages, though Wi-Fi is clearly connected and other apps work fine. What should be checked?", "The specific app's permissions/background data settings and account sync settings", ["The phone's screen brightness", "The phone's wallpaper", "The phone's ringtone volume"], "When only one app fails to sync despite working connectivity, that app's specific permissions, background data restrictions, or account settings are the likely culprit.", 3),
      Q("A previously working application now displays a licensing error stating the trial period has expired, though the user purchased a full license. What should be verified first?", "That the license key was entered correctly and activation completed successfully", ["That the RAID array is healthy", "That the DNS server is reachable", "That Bluetooth is enabled"], "Trial-expiration errors after a purchase usually point to an activation problem, verifying the license key was entered and accepted is the logical first check.", 3),

      Q("A user's browser is extremely slow to load any page, though a speed test shows normal internet bandwidth. What browser-specific troubleshooting step should be tried first?", "Clear the browser cache and disable recently added extensions", ["Reinstall the operating system", "Replace the network cable", "Reformat the hard drive"], "A bloated cache or a misbehaving extension are common causes of browser-specific slowness when the underlying network connection itself tests fine.", 3),
      Q("An application on a Mac repeatedly quits unexpectedly, and Console.app shows repeated crash reports for the same process. What is a reasonable next step?", "Reinstall or update the specific application", ["Reinstall macOS entirely", "Replace the logic board", "Disable Wi-Fi"], "When crash reports consistently point to one specific application, reinstalling or updating that app is the appropriate targeted fix.", 3),
      Q("A Windows PC's Start menu and search function have stopped responding, though other parts of the desktop work fine. What is a quick step to try before deeper troubleshooting?", "Restart the Windows Explorer process via Task Manager", ["Reinstall the entire OS", "Replace the RAM", "Update the BIOS"], "Restarting the Explorer.exe process often resolves shell-related glitches, including a frozen Start menu or search, without needing a full reboot.", 3),
      Q("A file fails to open with the error 'this file is in use by another process,' even though no visible application has it open. What should be checked?", "Background processes or services (via Task Manager) that may be holding a lock on the file", ["The RAID configuration", "The Wi-Fi signal strength", "The printer's paper tray"], "A file lock can persist from a background process or crashed application instance; checking Task Manager for lingering processes can reveal and let you end the culprit.", 3),
      Q("After installing a new webcam, its video feed appears extremely dark and grainy in every application. What should be checked first?", "The webcam's driver and its exposure/lighting settings in the app or Windows camera settings", ["The RAID array", "The DNS cache", "The printer spooler"], "Dark, grainy video is typically caused by driver/exposure settings rather than a fundamental hardware fault, so checking those settings is the appropriate first step.", 3),
      Q("A previously stable system starts experiencing random application crashes shortly after new RAM was installed. What troubleshooting step should be performed to rule out the new RAM?", "Run a memory diagnostic tool (e.g., Windows Memory Diagnostic)", ["Reinstall all applications", "Replace the power supply", "Update the printer driver"], "Since the crashes began after a RAM change, running a memory diagnostic tool helps confirm or rule out faulty or incompatible memory as the cause.", 3),
      Q("A user's OS reports that a critical system service failed to start, and several features (like printing or networking) stop working. What tool shows the specific reason the service failed?", "Event Viewer", ["Character Map", "Disk Cleanup", "Sticky Keys"], "Event Viewer logs detailed error information about failed services, including the specific error code or reason, which helps pinpoint the root cause.", 3),

      Q("A user's laptop trackpad works fine in Windows but is completely unresponsive inside one specific full-screen application. What does this most likely indicate?", "An application-specific input/compatibility issue rather than a hardware fault", ["Failed trackpad hardware", "A failed digitizer", "A dead battery"], "If the trackpad works everywhere except inside one application, the issue is isolated to that app's input handling rather than the physical trackpad hardware.", 3),
      Q("A user reports that spell-check and autocorrect have stopped working in only one specific application, while working normally system-wide. What is the most reasonable first step?", "Check that application's specific language/proofing settings and reinstall or repair it if needed", ["Reinstall the entire operating system", "Replace the keyboard", "Update the BIOS"], "An issue isolated to one application's proofing feature is best addressed by checking that app's own settings, and repairing/reinstalling it if the settings appear correct but still fail.", 3),
    ],

      { h: 'Documentation & change management', html: '<ul><li>Documents: <b>asset inventory</b>, <b>network/topology diagrams</b>, <b>knowledge base/articles</b>, <b>SOPs</b>, <b>acceptable use policy (AUP)</b>, <b>incident reports</b>, and <b>ticketing</b> (clear problem description, steps, resolution).</li><li><b>Change management</b>: a <b>change request</b> with purpose, scope, <b>risk analysis</b>, <b>rollback (backout) plan</b>, approval by the <b>change board</b>, a <b>maintenance window</b>, then implementation and documentation. Never make unapproved production changes.</li><li>Backups: <b>3-2-1</b> (3 copies, 2 media, 1 offsite); test restores; know full vs incremental vs differential.</li></ul>' },
      { h: 'Safety, environment & privacy', html: '<ul><li>Safety: <b>ESD</b> protection (anti-static strap/mat, store parts in anti-static bags), lift with your legs, unplug before servicing, don\'t open PSUs/CRTs/laser power supplies.</li><li>Environment: proper <b>ventilation</b>, control <b>temperature/humidity</b>, use surge protectors/UPS, and follow <b>MSDS/SDS</b> for chemicals and battery/toner disposal rules.</li><li>Fire: use a <b>Class C</b> extinguisher on electrical fires.</li><li>Privacy & regulated data: <b>PII, PHI (HIPAA), PCI DSS</b> (cards), GDPR; handle, retain and dispose of data per policy; follow chain of custody for incidents.</li></ul>' },

    qs: [
      Q("Before opening a desktop case to work on internal components, what should a technician wear to prevent damaging sensitive electronics?", "An ESD (anti-static) wrist strap", ["Safety goggles only", "A dust mask only", "Steel-toed boots"], "An ESD strap grounds the technician, preventing static discharge that can damage sensitive electronic components like RAM, CPUs, and motherboards.", 4),
      Q("A technician needs to look up the specific chemical hazards, handling precautions, and first-aid measures for a can of compressed air cleaner. What document should they consult?", "Safety Data Sheet (SDS)", ["End-user license agreement (EULA)", "Acceptable Use Policy (AUP)", "Non-disclosure agreement (NDA)"], "A Safety Data Sheet (SDS) provides detailed information on a chemical product's hazards, safe handling, storage, and emergency response measures.", 4),
      Q("Which document defines what employees are and are not permitted to do with company IT resources, such as internet use and personal device policies?", "Acceptable Use Policy (AUP)", ["Safety Data Sheet", "Non-disclosure agreement", "Service-level agreement"], "An Acceptable Use Policy (AUP) outlines approved and prohibited uses of an organization's IT systems and resources by employees.", 4),

      Q("A technician signs a legal document promising not to disclose a client's confidential information learned while performing contracted work. What is this document called?", "Non-disclosure agreement (NDA)", ["End-user license agreement", "Acceptable Use Policy", "Service-level agreement"], "A Non-disclosure agreement (NDA) legally binds a party to keep specific information confidential and not disclose it to unauthorized parties.", 4),

(function () {
  'use strict';
  function $(s, r) { return (r || document).querySelector(s); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function head(L, api, tag) {
    return '<div class="row" style="margin-bottom:8px"><button class="btn sm ghost" data-go="' + api.back + '">← Back</button><span class="grow"></span>' +
      (L.hints && L.hints.length ? '<button class="btn sm ghost" id="hint">Hint</button>' : '') + '<button class="btn sm warn" id="rst">Reset</button></div>' +
      '<div class="tag">' + tag + ' · HANDS-ON LAB</div><h1 style="margin:4px 0 6px">' + esc(L.title) + '</h1>' +
      '<div class="panel tight small" style="margin-bottom:10px">' + L.brief + '</div>';
  }
  function common(m, L, api, redraw) {
    var hi = 0, h = $('#hint', m);
    if (h) h.onclick = function () { var k = Math.min(hi++, L.hints.length - 1); api.modal('<div class="tag">Hint ' + (k + 1) + ' of ' + L.hints.length + '</div><p>' + L.hints[k] + '</p><button class="btn" data-close>Got it</button>'); };
    $('#rst', m).onclick = function () { if (!confirm('Reset this lab?')) return; api.clear(); redraw(true); };
  }

    if (allOk) {

      if (!api.done()) { api.complete(); }

  }

  // ---------- STAGE ----------

  function reqChips(s) {

  function pLearn(p, s) {

  // ---------- flashcards (Leitner) ----------
  var BOX_DAYS = [0, 1, 2, 4, 8, 16, 30];
  function cardState(c) { return S.cards[c.id] || { box: 0, due: 0 }; }
  function dueCards(list) { var now = Date.now(); return list.filter(function (c) { return cardState(c).due <= now; }); }
  function cardSession(p, list, label) {
    var mode = 'term', deck = shuffle(dueCards(list)), extra = false;
    if (!deck.length) { deck = shuffle(list); extra = true; }
    var i = 0, flipped = false, done = 0;
    function draw() {
      if (i >= deck.length) {
        p.innerHTML = '<div class="panel center"><div class="big">✓</div><h2>Deck cleared</h2><p class="muted">' + done + ' cards reviewed. Cards you marked "Again" come back first next time.</p><button class="btn pri" id="again">Run it again</button></div>';

      p.innerHTML = '<div class="row small muted"><span>' + esc(label) + ' · ' + (i + 1) + '/' + deck.length + (extra ? ' (extra practice — nothing due)' : '') + '</span><span class="grow"></span>' +
        '<button class="btn sm ghost" id="swap">' + (mode === 'term' ? 'Term → Def' : 'Def → Term') + '</button></div>' +
        '<div class="flash' + (flipped ? ' flip' : '') + '" id="fc"><div class="in"><div class="f">' + front + '<div class="dim small" style="margin-top:12px">tap to flip · box ' + cs.box + '</div></div><div class="b">' + back + '</div></div></div>' +
        '<div class="grade"><button class="btn warn" data-g="0">Again</button><button class="btn" data-g="1">Hard</button><button class="btn pri" data-g="2">Got it</button></div>' +
        '<p class="dim small center" style="margin-top:10px">Laptop: Space flips · 1/2/3 grade</p>';
      $('#fc', p).onclick = function () { flipped = !flipped; this.classList.toggle('flip', flipped); };
      $('#swap', p).onclick = function () { mode = mode === 'term' ? 'def' : 'term'; flipped = false; draw(); };
      p.querySelectorAll('[data-g]').forEach(function (b) { b.onclick = function () { grade(+b.dataset.g); }; });
    }
    function grade(g) {
      var c = deck[i], cs = cardState(c);
      cs.box = g === 0 ? 0 : g === 1 ? Math.max(1, cs.box) : Math.min(6, cs.box + 1);
      cs.due = g === 0 ? Date.now() : Date.now() + BOX_DAYS[cs.box] * 864e5;
      S.cards[c.id] = cs; persist();
      if (g === 0) deck.push(c);
      i++; done++; flipped = false; draw();
    }
    function key(e) {
      if (!p.isConnected) { document.removeEventListener('keydown', key); return; }
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.code === 'Space') { e.preventDefault(); var f = $('#fc', p); if (f) f.click(); }
      if (e.key === '1' || e.key === '2' || e.key === '3') grade(+e.key - 1);

    document.addEventListener('keydown', key);
    cleanup = function () { document.removeEventListener('keydown', key); };
    draw();
  }
  function pCards(p, s) { cardSession(p, s.cards, s.title); }

  // ---------- questions ----------
  function letter(i) { return 'ABCDEFG'.charAt(i); }
  function normAns(s) { return String(s).trim().toLowerCase().replace(/\s+/g, ' ').replace(/;$/, ''); }
  function checkInput(q, val) {
    var v = normAns(val);
    return (q.accept || []).some(function (a) {
      if (a instanceof RegExp) return a.test(val.trim());
      return normAns(a) === v;
    });
  }
  function renderQ(q, opts) { // returns html
    var h = '<div class="q">' + (q.html ? q.q : esc(q.q)) + '</div>';
    if (q.input) h += '<input class="answer-in" id="ain" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="' + esc(q.ph || 'Type your answer') + '" enterkeyhint="done">' +
      '<div class="row" style="margin-top:8px"><button class="btn pri" id="asub">Submit</button></div>';
    else h += '<div class="choices">' + q.order.map(function (ci, k) { return '<button class="choice" data-c="' + ci + '"><span class="l">' + letter(k) + '</span><span>' + esc(q.c[ci]) + '</span></button>'; }).join('') + '</div>';
    return h;
  }
  function prep(q) { q = realize(q); var o = { order: q.c ? shuffle(q.c.map(function (_, i) { return i; })) : null }; for (var k in q) o[k] = q[k]; if (q.keep) o.order = q.c.map(function (_, i) { return i; }); return o; }
  function explainHtml(q, ok) {
    var ans = q.input ? (q.show || (q.accept && typeof q.accept[0] === 'string' ? q.accept[0] : '')) : q.c[q.a];
    return '<div class="explain"><b class="v" style="color:' + (ok ? 'var(--ok)' : 'var(--bad)') + '">' + (ok ? 'Correct.' : 'Not quite.') + '</b>' +
      (!ok ? '<div class="small" style="margin-bottom:6px">Answer: <code>' + esc(ans) + '</code></div>' : '') + '<div>' + (q.e || '') + '</div></div>';
  }

  function pPractice(p, s) {
    var pool = s.qs, missedOnly = false;
    var right = 0, total = 0;
    function next() {
      var src = missedOnly ? pool.filter(function (q, i) { return S.missed[s.id + ':' + i]; }) : pool;
      if (!src.length) { p.innerHTML = '<div class="panel">No missed questions here. Nice.</div>'; return; }

      p.innerHTML = '<div class="row small" style="margin-bottom:8px"><span class="muted">Practice · instant explanations · ' + right + '/' + total + '</span><span class="grow"></span>' +
        '<button class="btn sm ' + (missedOnly ? 'pri' : 'ghost') + '" id="mo">Missed only</button></div><div class="panel" id="qp">' + renderQ(q) + '</div>';
      $('#mo', p).onclick = function () { missedOnly = !missedOnly; next(); };
      wire($('#qp', p), q, function (ok) {
        total++; if (ok) right++;
        if (!q.gen) { if (ok) delete S.missed[s.id + ':' + idx]; else S.missed[s.id + ':' + idx] = 1; persist(); }
        var b = document.createElement('div'); b.className = 'row'; b.style.marginTop = '10px';
        b.innerHTML = '<button class="btn pri" id="nx">Next question</button>'; $('#qp', p).appendChild(b);
        $('#nx', p).onclick = next; $('#nx', p).focus();

    }

  }
  // wire answering for a rendered question. instant=true shows explanation.
  function wire(box, q, done, instant) {
    var answered = false;
    function finish(ok, picked) {
      if (answered) return; answered = true;
      if (!q.input && instant) box.querySelectorAll('.choice').forEach(function (b) {
        var ci = +b.dataset.c; if (ci === q.a) b.classList.add('right'); else if (ci === picked) b.classList.add('wrong'); b.disabled = true;
      });

      var inp = $('#ain', box), sub = $('#asub', box);
      sub.onclick = function () { if (!inp.value.trim()) return; inp.disabled = true; sub.disabled = true; finish(checkInput(q, inp.value), inp.value); };
      inp.onkeydown = function (e) { if (e.key === 'Enter') sub.click(); };
      if (document.body.classList.contains('pc')) inp.focus();
    } else box.querySelectorAll('.choice').forEach(function (b) { b.onclick = function () { finish(+b.dataset.c === q.a, +b.dataset.c); }; });
  }

  // ---------- gate test ----------
  function pGate(p, s) {
    var x = st(s.id);
    if (!gateReady(s)) {
      p.innerHTML = '<div class="panel"><h2>🔒 Gate locked</h2><p>Before you can test out of this step:</p><ul>' +
        '<li>' + (x.lesson ? '✓' : '○') + ' Read the lesson and mark it complete</li>' +
        ((s.labs || []).length ? '<li>' + (labsDone(s) === s.labs.length ? '✓' : '○') + ' Complete every lab (' + labsDone(s) + '/' + s.labs.length + ')</li>' : '') +
        '</ul><p class="muted">Then score <b>over ' + PASS + '%</b> to unlock the next step and earn your checkpoint phrase.</p></div>';
      return;
    }
    var cap = s.capstone, n = cap ? cap.n : Math.min(s.gateN || 15, s.qs.length);
    p.innerHTML = '<div class="panel"><h2>' + (cap ? 'Capstone exam' : 'Gate test') + '</h2>' +
      '<p>' + n + ' questions' + (cap ? ', weighted to the official domain percentages, ' + cap.minutes + '-minute timer' : '') + '. No hints or explanations until the end. You need <b>over ' + PASS + '%</b> (' + Math.floor(n * PASS / 100 + 1) + '/' + n + ' or better).</p>' +
      (x.passed ? '<p class="chip ok">Already passed — best ' + x.best + '%. Retakes keep your best.</p>' : '') +
      '<p class="muted small">Attempts: ' + x.attempts + (x.best ? ' · best ' + x.best + '%' : '') + '</p>' +
      '<button class="btn pri" id="go">Start ' + (cap ? 'exam' : 'gate test') + '</button></div>' +
      (x.passed ? '<div class="panel" style="margin-top:12px"><div class="tag">Checkpoint phrase for this step</div><div class="code" style="margin-top:8px">' + esc(s.code) + '</div></div>' : '');
    $('#go', p).onclick = function () { runTest(p, s, buildSet(s, n), cap); };
  }
  function buildSet(s, n) {
    if (s.capstone) {
      var pool = [];
      STAGES.forEach(function (o) {
        var inPool = s.capstone.pool ? s.capstone.pool.indexOf(o.id) >= 0 : (o.idx <= s.idx && o.tier !== 'pro' && o.track === s.track);
        if (inPool) o.qs.forEach(function (q) { if (q.d) pool.push(q); });
      });
      var W = s.capstone.weights || C.weights, out = [];
      var counts = {}, tot = 0;
      Object.keys(W).forEach(function (d) { counts[d] = Math.round(n * W[d] / 100); tot += counts[d]; });
      var dk = Object.keys(W).sort(function (a, b) { return W[b] - W[a]; }), k = 0;
      while (tot !== n) { counts[dk[k % dk.length]] += tot < n ? 1 : -1; tot += tot < n ? 1 : -1; k++; }
      Object.keys(counts).forEach(function (d) {
        var dp = shuffle(pool.filter(function (q) { return String(q.d) === d; }));
        out = out.concat(dp.slice(0, counts[d]));
      });
      if (out.length < n) out = out.concat(shuffle(pool.filter(function (q) { return out.indexOf(q) < 0; })).slice(0, n - out.length));
      return shuffle(out).map(prep);
    }
    return shuffle(s.qs).slice(0, n).map(prep);
  }
  function runTest(p, s, set, cap) {
    var i = 0, answers = [], t0 = Date.now(), timerId = null, limit = cap ? cap.minutes * 60 : 0;
    function tick() {
      var el = $('#tm', p); if (!el) return;
      var left = limit - Math.floor((Date.now() - t0) / 1000);
      if (left <= 0) { finish(); return; }
      el.textContent = Math.floor(left / 60) + ':' + ('0' + left % 60).slice(-2);
    }
    if (cap) { timerId = setInterval(tick, 1000); cleanup = function () { clearInterval(timerId); }; }
    function show() {
      if (i >= set.length) return finish();
      var q = set[i];
      p.innerHTML = '<div class="qmeta"><span>' + (cap ? 'CAPSTONE' : 'GATE') + ' · Q' + (i + 1) + '/' + set.length + (q.d && (cap && cap.domains || C.domains) ? ' · D' + q.d : '') + '</span>' + (cap ? '<span class="timer" id="tm"></span>' : '') + '</div>' +
        '<div class="bar" style="margin-bottom:12px"><i style="width:' + (100 * i / set.length) + '%"></i></div><div class="panel" id="qp">' + renderQ(q) + '</div>' +
        '<div class="row" style="margin-top:10px"><button class="btn sm ghost" id="quit">Abandon test</button></div>';
      if (cap) tick();
      $('#quit', p).onclick = function () { if (confirm('Abandon this attempt? It counts as an attempt but not a score.')) { st(s.id).attempts++; persist(); if (timerId) clearInterval(timerId); route(); } };
      wire($('#qp', p), q, function (ok, picked) {

        '<p>' + right + '/' + set.length + ' correct · needed over ' + PASS + '%</p>';
      if (passed) h += '<p class="muted">Write down your checkpoint phrase. Typing it into <b>Save → Restore</b> on any device puts you right back here.</p><div class="code" id="cp">' + esc(s.code) + '</div>' +
        '<div class="row" style="justify-content:center;margin-top:10px"><button class="btn" id="cpy">Copy phrase</button>' + (next ? '<button class="btn pri" data-go="#stage/' + next.id + '">Unlocked: ' + esc(next.title) + ' →</button>' : '') + '</div>';
      else h += '<p class="muted">Review every miss below, drill the cards, and use Practice → Missed only. Then retake — the questions reshuffle.</p>';
      h += '</div>';
      if (cap && byD) h += '<div class="panel" style="margin-top:12px"><h3>By domain</h3>' + Object.keys(byD).map(function (d) { var v = byD[d], pc = Math.round(100 * v[0] / v[1]); return '<div class="row small" style="margin:6px 0"><span style="flex:0 0 52%">' + esc(((cap && cap.domains) || C.domains || {})[d] || 'Other') + '</span><div class="bar grow"><i style="width:' + pc + '%;background:' + (pc > PASS ? 'var(--ok)' : pc >= 75 ? 'var(--lock)' : 'var(--bad)') + '"></i></div><span class="mono">' + pc + '%</span></div>'; }).join('') + '</div>';
      h += '<h3 style="margin-top:18px">Review</h3><div class="stack">';
