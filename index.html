est matches this?", "choices": ["Degraded performance (often from aging storage/battery or accumulated background processes)", "Broken screen", "Liquid damage", "Stylus does not work"], "correct": 0, "expl": "Gradual, month-over-month slowdown that persists even after a reset points to hardware-level degraded performance, such as aging flash storage or battery throttling.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 5, "q": "A user's smartphone repeatedly displays unexpected pop-up ads even outside of any browser app, and battery drains unusually fast. What is the likely cause?", "choices": ["Malware/adware infection", "A cracked digitizer", "A swollen battery only", "A missing SIM card"], "correct": 0, "expl": "Persistent out-of-browser pop-ups combined with rapid battery drain are classic indicators of a malware or adware infection on a mobile device.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 5, "q": "Wireless clients across an entire office building report simultaneously slow speeds during a specific hour each afternoon, coinciding with a neighboring business's known heavy wireless usage. What should be checked?", "choices": ["Channel overlap/interference from the neighboring wireless network", "The DHCP scope size", "The printer configuration", "The RAID array health"], "correct": 0, "expl": "Overlapping Wi-Fi channels between nearby networks is a common cause of shared-time-window slowdowns, and adjusting channel selection can mitigate it.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 5, "q": "A remote worker's VoIP calls consistently drop or freeze whenever another household member starts a large file download. What network symptom category does this fall under?", "choices": ["High latency/limited bandwidth contention", "Port flapping", "Authentication failure", "External interference"], "correct": 0, "expl": "Bandwidth contention from simultaneous heavy usage (like large downloads) can starve latency-sensitive VoIP traffic, causing call quality degradation.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 5, "q": "A newly installed switch port shows a solid link light but no traffic ever passes, and the port's status alternates between connected and disconnected every few seconds. What is this called?", "choices": ["Port flapping", "Jitter", "DNS failure", "RAID failure"], "correct": 0, "expl": "A link that repeatedly toggles connected/disconnected status is classic port flapping, often from a faulty cable, NIC, duplex mismatch, or failing switch port.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 5, "q": "A user is completely unable to reach any websites, but can still ping an internal server's IP address directly. What should be checked?", "choices": ["DNS server configuration/reachability", "The physical Ethernet cable", "The RAID array", "The printer spooler"], "correct": 0, "expl": "Being able to reach an IP directly but not resolve names to browse websites strongly points to a DNS resolution problem rather than basic connectivity.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 5, "q": "A branch office reports total loss of internet access for about five minutes several times a day, always at the same times, then it recovers on its own. What symptom category best matches this?", "choices": ["Intermittent internet connectivity", "Authentication failure", "Speckling", "Garbled print"], "correct": 0, "expl": "Recurring, temporary loss of internet access that self-recovers describes intermittent internet connectivity, which may stem from an ISP issue or scheduled interference.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 5, "q": "A laser-printed page comes out consistently lighter than normal across the entire sheet, though the image itself is not distorted. What is the most likely cause?", "choices": ["Low toner", "A torn paper fragment in the path", "A failed NIC", "A misconfigured IP address"], "correct": 0, "expl": "Uniformly faded output across the page is a classic sign of low toner in a laser printer, requiring cartridge replacement or redistribution.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 5, "q": "An inkjet printer feeds two sheets of paper into the printer at once for every job, resulting in a misfeed. What should be checked first?", "choices": ["The paper separator/feed rollers for wear or dirt", "The toner cartridge", "The network cable", "The Wi-Fi password"], "correct": 0, "expl": "Worn or dirty separator/feed rollers commonly fail to properly separate sheets, resulting in multiple pages feeding at once (multipage misfeed).", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 5, "q": "A shared network printer shows 'offline' status to all users despite being powered on and connected to the same network. What should be checked first?", "choices": ["The printer's IP address/connectivity settings and the print server's configuration", "The toner cartridge level", "The paper tray size", "The stapler unit"], "correct": 0, "expl": "An 'offline' status across all users typically indicates a network/connectivity issue between the printer and the print server, not a supply-level problem.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 5, "q": "A user selects landscape orientation in the print dialog, but the printed page still comes out in portrait layout. What is the most likely cause?", "choices": ["The application's print settings weren't applied correctly, or the wrong printer/driver was selected", "The toner is low", "The paper tray is empty", "The Wi-Fi signal is weak"], "correct": 0, "expl": "Orientation mismatches usually result from the print settings not actually being applied, often because the wrong printer or driver profile was selected.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 5, "q": "A desktop's fans spin up to full speed immediately at every boot and never throttle down, even when idle. What should be checked?", "choices": ["The BIOS/UEFI fan curve settings and temperature sensor readings", "The DNS configuration", "The printer's toner level", "The Bluetooth pairing status"], "correct": 0, "expl": "Fans stuck at full speed regardless of load often point to a fan curve misconfiguration in BIOS/UEFI or a faulty temperature sensor reporting inaccurate readings.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}];
const CORE2_BANK = [{"domain": 1, "q": "Which Windows file system supports large volume sizes, journaling, and file/folder permissions, and is the default for Windows installations?", "choices": ["FAT32", "exFAT", "NTFS", "ext4"], "correct": 2, "expl": "NTFS is the default modern Windows file system, supporting journaling, large file/volume sizes, and granular permissions, unlike FAT32/exFAT.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 1, "q": "A USB flash drive needs to be readable by both Windows and macOS and must support files larger than 4GB. Which file system fits best?", "choices": ["FAT32", "exFAT", "NTFS", "ext4"], "correct": 1, "expl": "exFAT is broadly cross-platform compatible and, unlike FAT32, supports individual files larger than 4GB, making it ideal for removable media shared between OSes.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 1, "q": "Which Linux command lists the contents of the current directory?", "choices": ["ls", "dir /w", "cd..", "chmod"], "correct": 0, "expl": "The 'ls' command lists directory contents in Linux/macOS terminals, analogous to 'dir' in Windows Command Prompt.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 1, "q": "A Linux administrator needs to change file permissions so only the owner can read and write a script. Which command is used?", "choices": ["chmod", "chown", "ps", "grep"], "correct": 0, "expl": "'chmod' modifies file permission bits (read/write/execute) for the owner, group, and others on Linux/macOS systems.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 1, "q": "Which command changes the ownership of a file to a different user on a Linux system?", "choices": ["chown", "chmod", "ls -l", "apt"], "correct": 0, "expl": "'chown' changes the owner (and optionally group) of a file or directory in Linux.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 1, "q": "On a Debian-based Linux distribution, which package manager is typically used to install new software from the command line?", "choices": ["apt", "brew", "yum", "chkdsk"], "correct": 0, "expl": "'apt' (Advanced Package Tool) is the standard package manager on Debian-based distributions like Ubuntu.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 1, "q": "On macOS, which package manager is commonly used to install third-party command-line tools not included by default?", "choices": ["Homebrew (brew)", "apt", "yum", "dnf"], "correct": 0, "expl": "Homebrew (brew) is a popular third-party package manager for macOS used to install command-line tools and applications.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 1, "q": "Which Windows tool would a technician use to view detailed logs of application crashes and system errors?", "choices": ["Event Viewer", "Disk Management", "Task Scheduler", "Device Manager"], "correct": 0, "expl": "Event Viewer (eventvwr) displays categorized logs including application, system, and security events, useful for diagnosing crashes and errors.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 1, "q": "Which Windows MMC snap-in is used to shrink, extend, or format disk partitions?", "choices": ["Disk Management", "Task Scheduler", "Certificate Manager", "Performance Monitor"], "correct": 0, "expl": "Disk Management (diskmgmt.msc) provides a graphical interface for managing partitions, volumes, and drive formatting.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 1, "q": "A technician needs to configure a script to run automatically every night at 2 AM on a Windows machine. Which tool should they use?", "choices": ["Task Scheduler", "Device Manager", "Local Users and Groups", "Group Policy Editor"], "correct": 0, "expl": "Task Scheduler (taskschd.msc) allows administrators to configure tasks and scripts to run automatically based on a defined schedule or trigger.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 1, "q": "Which Windows tool displays real-time CPU, memory, disk, and network utilization, and allows ending unresponsive processes?", "choices": ["Task Manager", "Event Viewer", "Certificate Manager", "Local Group Policy Editor"], "correct": 0, "expl": "Task Manager shows live resource usage across processes, users, startup items, and services, and lets a technician end tasks directly.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 1, "q": "A technician wants to disable an application from automatically launching when Windows boots, without uninstalling it. Where should they look?", "choices": ["The Startup tab in Task Manager", "Device Manager", "Disk Management", "Certificate Manager"], "correct": 0, "expl": "The Startup tab in Task Manager lists apps configured to launch at boot and lets a technician disable them individually.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 1, "q": "Which boot method allows a technician to install an OS over the network without any local removable media?", "choices": ["PXE (network boot)", "USB boot", "Internal hard drive boot", "Multiboot"], "correct": 0, "expl": "Preboot eXecution Environment (PXE) boot lets a machine load an OS installer image directly over the network, useful for mass deployments.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 1, "q": "A technician wants to install Windows on a new PC while completely erasing any existing data and configuration. What type of installation is this?", "choices": ["Clean install", "In-place upgrade", "Multiboot install", "Image deployment restore"], "correct": 0, "expl": "A clean install wipes the target drive and installs the OS fresh, as opposed to an in-place upgrade which preserves existing files, apps, and settings.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 1, "q": "A technician wants to upgrade a Windows 10 PC to Windows 11 while keeping all installed applications, files, and settings intact. What installation method should be used?", "choices": ["Clean install", "In-place upgrade", "Multiboot", "Network install"], "correct": 1, "expl": "An in-place upgrade installs the new OS version over the existing one, preserving apps, files, and most settings, unlike a clean install.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 1, "q": "Which Windows 11 hardware requirement is a dedicated security chip that stores cryptographic keys and enables features like Secure Boot integration?", "choices": ["TPM", "UEFI legacy CSM", "VRAM", "ECC RAM"], "correct": 0, "expl": "Windows 11 requires a Trusted Platform Module (TPM), typically version 2.0, along with UEFI firmware, as part of its minimum hardware requirements.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 1, "q": "A user account on a shared computer should be able to browse the internet and use installed apps but should not be able to install new software or change system settings. What account type fits best?", "choices": ["Standard account", "Administrator account", "Guest account with admin rights", "Domain Admin"], "correct": 0, "expl": "A standard account allows normal day-to-day use without the ability to make system-wide changes or install software requiring elevation, unlike an administrator account.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 1, "q": "Which Windows feature prompts a user for confirmation (or credentials) before allowing an action that requires administrative privileges?", "choices": ["User Account Control (UAC)", "BitLocker", "EFS", "Group Policy"], "correct": 0, "expl": "User Account Control (UAC) intercepts privileged actions and requires explicit confirmation or elevated credentials before they proceed.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 1, "q": "Which Windows feature encrypts an entire drive volume, including the operating system drive, protecting data if the physical disk is stolen?", "choices": ["BitLocker", "EFS (Encrypting File System)", "NTFS permissions", "Share permissions"], "correct": 0, "expl": "BitLocker performs full-volume encryption, protecting all data on the drive, whereas EFS only encrypts individual files or folders.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 1, "q": "A user needs to encrypt just a single sensitive folder on an NTFS volume without encrypting the entire drive. Which feature should they use?", "choices": ["EFS (Encrypting File System)", "BitLocker", "BitLocker To Go", "Share permissions only"], "correct": 0, "expl": "EFS allows selective encryption of individual files and folders on an NTFS volume, unlike BitLocker's full-volume approach.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 1, "q": "A file is shared over the network with 'Full Control' share permission, but the underlying NTFS permission on the folder is 'Read Only.' What is the user's effective access when connecting remotely?", "choices": ["Read Only", "Full Control", "Write only", "No access"], "correct": 0, "expl": "When share and NTFS permissions differ, the more restrictive of the two applies for remote (network) access, so Read Only wins here.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 1, "q": "An administrator wants to push a specific desktop wallpaper, password policy, and mapped drive to all computers in a Windows domain organizational unit. What tool should be used?", "choices": ["Group Policy", "Local Users and Groups", "Device Manager", "Disk Management"], "correct": 0, "expl": "Group Policy allows centralized configuration of settings, security policies, and resources across computers and users joined to an Active Directory domain.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 1, "q": "Which Active Directory action moves a computer or user object into a specific container to apply a distinct set of Group Policy settings?", "choices": ["Moving objects within organizational units", "Assigning a login script", "Configuring folder redirection", "Joining a domain"], "correct": 0, "expl": "Organizational units (OUs) group objects so that specific Group Policy Objects can be applied; moving an object into a different OU changes which policies apply to it.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 1, "q": "Which mobile OS feature lets IT remotely erase all data from a lost or stolen corporate smartphone?", "choices": ["Remote wipe", "App permissions review", "Biometric login", "OTA update"], "correct": 0, "expl": "Remote wipe, typically managed through MDM, erases data from a device remotely to protect corporate information if the device is lost or stolen.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 1, "q": "A vendor announces that a particular version of an operating system will no longer receive security patches or support. What term describes this milestone?", "choices": ["End-of-life (EOL)", "In-place upgrade", "Clean install", "Multiboot"], "correct": 0, "expl": "End-of-life (EOL) marks the point at which a vendor stops providing updates and support for a product, including security patches.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 2, "q": "Which wireless security protocol replaced WPA2 and introduces stronger encryption along with protections like forward secrecy?", "choices": ["WEP", "WPA3", "TKIP", "Open authentication"], "correct": 1, "expl": "WPA3 is the current wireless security standard, offering stronger encryption and protections such as forward secrecy compared to WPA2.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 2, "q": "Which outdated wireless encryption protocol is now considered fundamentally broken and should never be used?", "choices": ["WEP", "WPA3", "WPA2-Enterprise", "AES-CCMP"], "correct": 0, "expl": "Wired Equivalent Privacy (WEP) has well-known cryptographic weaknesses and can be cracked quickly; it should never be used on modern networks.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 2, "q": "A corporate wireless network requires each user to authenticate with individual domain credentials against a RADIUS server rather than a single shared passphrase. What is this called?", "choices": ["WPA2/WPA3-Enterprise", "WPA2-Personal", "WEP", "Open network"], "correct": 0, "expl": "Enterprise mode (WPA2/WPA3-Enterprise) authenticates each user individually against a RADIUS/AAA server, unlike Personal mode's shared pre-shared key.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 2, "q": "An email urgently asks an employee to wire money to a new vendor account, impersonating the CEO. What social engineering / attack category best describes this?", "choices": ["Business Email Compromise (BEC)", "Shoulder surfing", "Tailgating", "Dumpster diving"], "correct": 0, "expl": "Business Email Compromise (BEC) involves impersonating a trusted figure, often an executive, via email to trick an employee into a fraudulent transfer or action.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 2, "q": "An attacker follows closely behind an authorized employee through a secured door without badging in themselves. What social engineering technique is this?", "choices": ["Tailgating", "Phishing", "Vishing", "Shoulder surfing"], "correct": 0, "expl": "Tailgating (or piggybacking) is gaining unauthorized physical access by following someone with legitimate access through a secured entrance.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 2, "q": "A caller pretends to be from IT support over the phone, asking an employee to read back their password to 'verify their account.' What is this attack called?", "choices": ["Vishing", "Tailgating", "Dumpster diving", "Zero-day exploit"], "correct": 0, "expl": "Vishing (voice phishing) uses phone calls to trick victims into revealing sensitive information or credentials.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 2, "q": "Malware that appears to be a legitimate free utility, but secretly installs a backdoor once run, is best classified as which type?", "choices": ["Trojan", "Worm", "Ransomware", "Rootkit"], "correct": 0, "expl": "A Trojan disguises itself as legitimate or desirable software while covertly performing malicious actions once executed.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 2, "q": "Malware self-replicates and spreads across a network by exploiting vulnerabilities, without needing a user to open a file. What type of malware is this?", "choices": ["Worm", "Trojan", "Keylogger", "Adware"], "correct": 0, "expl": "A worm is self-propagating malware that spreads automatically across networks by exploiting vulnerabilities, unlike a virus which needs a host file.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 2, "q": "Malware encrypts all of a victim's files and displays a message demanding payment for the decryption key. What type of malware is this?", "choices": ["Ransomware", "Spyware", "Adware", "Worm"], "correct": 0, "expl": "Ransomware encrypts a victim's data and demands payment (a ransom) in exchange for the decryption key.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 2, "q": "Malware embeds itself deep in the OS kernel to hide its own presence and that of other malicious processes from normal detection tools. What is this called?", "choices": ["Rootkit", "Adware", "Keylogger", "Trojan"], "correct": 0, "expl": "A rootkit gains privileged, kernel-level access specifically to conceal itself and other malware from standard detection and monitoring tools.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 2, "q": "Which malware type silently records every keystroke a user types, including passwords, and sends the data to an attacker?", "choices": ["Keylogger", "Adware", "Worm", "Ransomware"], "correct": 0, "expl": "A keylogger captures keystrokes, often to steal credentials or sensitive information, and transmits them to the attacker.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 2, "q": "During SOHO malware remediation, after quarantining an infected system, what step should typically come next?", "choices": ["Disable System Restore (on Windows Home) before remediating", "Immediately enable System Restore", "Reconnect the system to the network", "Delete all user data"], "correct": 0, "expl": "Disabling System Restore before remediation prevents the infection from being reintroduced via an infected restore point during cleanup.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 2, "q": "After successfully removing malware from a workstation, what should a technician do before considering the incident closed?", "choices": ["Educate the end user on how the infection likely occurred", "Immediately reformat unrelated systems", "Disable the antivirus software", "Delete all system logs"], "correct": 0, "expl": "User education helps prevent reinfection by addressing the behavior or vulnerability (e.g., clicking a phishing link) that led to the original infection.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 2, "q": "Which authentication factor category does a fingerprint scan belong to?", "choices": ["Something you are", "Something you know", "Something you have", "Somewhere you are"], "correct": 0, "expl": "A fingerprint is a biometric trait, classified as 'something you are' in multifactor authentication models.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 2, "q": "A user logs in with a password and then must also approve a push notification on their registered phone. What security concept does this combination demonstrate?", "choices": ["Multifactor authentication (MFA)", "Single sign-on (SSO)", "Role-based access control", "Least privilege"], "correct": 0, "expl": "Requiring both a password (something you know) and a phone approval (something you have) is a practical example of multifactor authentication.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 2, "q": "A company wants users to log in once and gain access to multiple integrated applications without re-entering credentials for each one. What does this describe?", "choices": ["Single sign-on (SSO)", "Multifactor authentication", "BitLocker", "Role separation"], "correct": 0, "expl": "Single sign-on (SSO) allows a user to authenticate once and gain access to multiple connected services without logging in separately to each.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 2, "q": "Which principle states that users and processes should be granted only the minimum access necessary to perform their job functions?", "choices": ["Least privilege", "Zero trust", "Non-repudiation", "Defense in depth"], "correct": 0, "expl": "The principle of least privilege limits accounts and processes to only the access rights required to perform their specific tasks, reducing overall risk.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 2, "q": "Which Windows feature restricts what actions a standard user can perform on the local system, requiring elevation for privileged tasks?", "choices": ["UAC and standard account restrictions", "BitLocker To Go", "Windows Hello", "Group Policy on the domain controller only"], "correct": 0, "expl": "Standard accounts combined with UAC restrict privileged operations locally, requiring explicit elevation (often an administrator's credentials) to proceed.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 2, "q": "A company disables USB ports on workstations in a secure lab to prevent data exfiltration via removable media. What category of security control is this?", "choices": ["Workstation hardening technique", "Wireless security protocol", "MFA method", "Malware type"], "correct": 0, "expl": "Restricting physical ports like USB is a hardening technique aimed at reducing the attack surface and preventing data loss via removable devices.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 2, "q": "A security policy mandates that after several failed login attempts, an account is temporarily locked. What is this policy designed to prevent?", "choices": ["Brute-force password attacks", "Phishing", "Tailgating", "Rootkit installation"], "correct": 0, "expl": "Account lockout policies slow or prevent brute-force attacks that repeatedly guess passwords by locking the account after a set number of failed attempts.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 2, "q": "Which login method lets a Windows user authenticate using their face via an infrared camera, replacing the need to type a password?", "choices": ["Windows Hello", "BitLocker To Go", "EFS", "Guest account"], "correct": 0, "expl": "Windows Hello supports biometric login methods such as facial recognition (via IR camera) or fingerprint, offering passwordless authentication.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 2, "q": "A retail store requires visitors to scan a badge at the door, which logs their name and the time they entered a secured back-office area. What physical security control is this?", "choices": ["Badging with access logging", "BitLocker", "VLAN segmentation", "Antivirus scanning"], "correct": 0, "expl": "Badge-based access control combined with logging tracks who accessed a secured physical space and when, supporting accountability.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 2, "q": "Which social engineering technique involves searching through an organization's discarded trash for sensitive documents or discarded hardware?", "choices": ["Dumpster diving", "Vishing", "Tailgating", "Shoulder surfing"], "correct": 0, "expl": "Dumpster diving is the practice of retrieving sensitive information (documents, old drives) from an organization's trash.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 2, "q": "A coworker glances at a user's screen and monitor to catch a glimpse of their typed password. What is this called?", "choices": ["Shoulder surfing", "Vishing", "Dumpster diving", "Tailgating"], "correct": 0, "expl": "Shoulder surfing is observing someone's screen or keyboard, often to steal credentials or sensitive information, typically in person.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 2, "q": "A company installs privacy screens on laptop displays used in public spaces like airports. Which threat is this control primarily meant to reduce?", "choices": ["Shoulder surfing", "Ransomware", "Port flapping", "DHCP exhaustion"], "correct": 0, "expl": "Privacy screens narrow the viewing angle of a display, making it harder for someone nearby to shoulder-surf sensitive information.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 3, "q": "A Windows PC displays a blue screen with a stop code and reboots unexpectedly. What is this commonly known as?", "choices": ["BSOD (Blue Screen of Death)", "Boot loop", "Kernel panic", "Grey screen error"], "correct": 0, "expl": "A Blue Screen of Death (BSOD) is a Windows stop error indicating a serious system fault, often caused by a driver, hardware, or kernel-level issue.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 3, "q": "A Windows computer restarts repeatedly right after the manufacturer logo appears, never fully reaching the desktop. What is this symptom called?", "choices": ["Boot loop", "BSOD", "Slow profile load", "Application crash"], "correct": 0, "expl": "A boot loop occurs when the system continually restarts before completing startup, often due to corrupted system files or a failing update.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 3, "q": "A user reports that Windows takes several minutes to reach the desktop after login, though the machine performs normally once loaded. What should a technician check first?", "choices": ["Startup programs and services launching automatically", "The printer's toner level", "The RAID array status", "The projector bulb"], "correct": 0, "expl": "Excessive startup programs and services are a very common cause of slow boot/login times and should be reviewed first, e.g., via Task Manager's Startup tab.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 3, "q": "A specific application crashes immediately every time it's launched, while all other applications run fine. What is a good first troubleshooting step?", "choices": ["Reinstall or repair the application", "Reinstall the entire operating system", "Replace the hard drive", "Update the BIOS"], "correct": 0, "expl": "When only one application consistently crashes, reinstalling or repairing that specific application (fixing corrupted files) is the appropriate first step.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 3, "q": "A Windows system is running extremely slowly, with high disk activity even when idle. Which built-in tool best helps identify the responsible process?", "choices": ["Task Manager's Processes/Performance tab", "Disk Management", "Local Users and Groups", "Certificate Manager"], "correct": 0, "expl": "Task Manager's Processes and Performance tabs show real-time CPU, memory, and disk usage per process, helping pinpoint what's consuming resources.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 3, "q": "After a failed update, Windows will not boot normally. Which built-in recovery option lets a technician boot with only essential drivers and services loaded?", "choices": ["Safe Mode", "Fast Startup", "Sleep mode", "Airplane mode"], "correct": 0, "expl": "Safe Mode boots Windows with a minimal set of drivers and services, useful for troubleshooting issues that prevent a normal boot, including bad updates or drivers.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 3, "q": "A user's mouse pointer freezes and the whole system becomes completely unresponsive to any input. What is this described as?", "choices": ["A system lock-up/freeze", "A slow profile load", "A failed print job", "A blue screen"], "correct": 0, "expl": "A total freeze or lock-up describes a system that stops responding entirely to keyboard/mouse input, often requiring a hard reset.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 3, "q": "Which technique involves booting from external removable media to run diagnostic and repair tools when Windows itself cannot start?", "choices": ["Using a preinstallation/recovery environment (e.g., WinPE)", "Enabling System Restore", "Editing the registry live", "Disabling UAC"], "correct": 0, "expl": "A preinstallation environment (like WinPE) boots from external media to provide repair, diagnostic, and malware removal tools outside of the broken OS.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 3, "q": "After removing malware, a technician wants to confirm no traces remain and system files are intact. Which built-in Windows tool checks and repairs protected system files?", "choices": ["System File Checker (sfc /scannow)", "Disk Cleanup", "Task Scheduler", "Certificate Manager"], "correct": 0, "expl": "System File Checker (sfc /scannow) scans protected system files for corruption and attempts to repair them using cached copies.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 3, "q": "A mobile app on a smartphone repeatedly force-closes shortly after opening. Which troubleshooting step is most appropriate first?", "choices": ["Clear the app's cache/data or reinstall the app", "Factory reset the entire phone", "Replace the battery", "Disable cellular data permanently"], "correct": 0, "expl": "Clearing an app's cache/data or reinstalling it addresses corrupted local app data, which is a common and less drastic cause of repeated crashing.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 3, "q": "A smartphone user is unable to install any new applications, receiving a storage error each time. What should be checked first?", "choices": ["Available internal storage space", "The Wi-Fi password", "The wallpaper settings", "The wireless card"], "correct": 0, "expl": "Insufficient storage space is the most common cause of failed app installations; freeing up space usually resolves the error.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 3, "q": "A Windows machine shows a 'disk full' error even though Explorer reports plenty of free space remaining. What might explain this discrepancy?", "choices": ["Hidden system files, shadow copies, or a corrupted file system reporting incorrect free space", "A missing NIC driver", "An expired TPM certificate", "A jammed paper tray"], "correct": 0, "expl": "Discrepancies between reported free space and actual disk state can result from restore points/shadow copies, hidden data, or file system corruption needing a check disk.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 3, "q": "After a driver update, a video card starts showing graphical artifacts and random screen corruption. What is a reasonable first step?", "choices": ["Roll back the driver to the previous version", "Replace the motherboard", "Reinstall the OS from scratch", "Reformat the hard drive"], "correct": 0, "expl": "Rolling back to the previously working driver is a quick, low-risk way to resolve graphical issues introduced by a recent driver update.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 3, "q": "An application repeatedly prompts for activation even though a valid license key was entered correctly. What Windows tool can help review detailed licensing/activation status?", "choices": ["Command Prompt slmgr utility / Settings Activation page", "Disk Management", "Device Manager", "Local Group Policy Editor"], "correct": 0, "expl": "Windows provides the slmgr command-line tool and the Settings Activation page to review and troubleshoot license activation status in detail.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 3, "q": "A user reports their browser homepage keeps changing to an unfamiliar search site, and unwanted toolbars have appeared. What is this most likely caused by?", "choices": ["A potentially unwanted program (PUP) or browser hijacker", "A failing power supply", "A RAID failure", "A printer driver conflict"], "correct": 0, "expl": "Unexpected homepage/search engine changes and unwanted toolbars are classic symptoms of a browser hijacker or potentially unwanted program (PUP).", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 3, "q": "A user's profile takes an unusually long time to load at sign-in, but only on this one particular user account. What is a likely cause?", "choices": ["A corrupted user profile", "A failing power supply", "A bad RAID controller", "A missing printer driver"], "correct": 0, "expl": "When slow logon is isolated to one specific user profile, profile corruption is a common cause, often resolved by creating a fresh profile.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 3, "q": "A Windows update fails repeatedly with the same error code each time it's attempted. What built-in tool can automatically detect and fix common Windows Update issues?", "choices": ["Windows Update Troubleshooter", "Disk Cleanup", "Local Users and Groups", "Character Map"], "correct": 0, "expl": "The built-in Windows Update Troubleshooter checks for and automatically repairs common causes of failed updates, such as corrupted update components.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 3, "q": "After installing a new peripheral, Device Manager shows a yellow exclamation mark next to the device. What does this typically indicate?", "choices": ["A driver problem or resource conflict", "A successful, fully functioning installation", "A firewall block", "A DNS resolution error"], "correct": 0, "expl": "A yellow exclamation point in Device Manager indicates a driver issue or resource conflict preventing the device from functioning correctly.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 3, "q": "A user's email client repeatedly asks for their password, even though it was entered correctly, and fails to sync new mail. What is a likely first step?", "choices": ["Verify the account's server settings and confirm the password hasn't expired or changed", "Reinstall the entire operating system", "Replace the SSD", "Disable Windows Update"], "correct": 0, "expl": "Persistent authentication prompts in email are often caused by an expired/changed password or incorrect server settings, which should be verified first.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 3, "q": "A specific application throws 'missing DLL' errors on launch after another program was recently uninstalled. What likely happened?", "choices": ["The uninstalled program removed a shared DLL file still needed by the other application", "The OS license expired", "The GPU driver is outdated", "The disk is out of space"], "correct": 0, "expl": "Some uninstallers remove shared library (DLL) files that other applications also depend on, causing 'missing DLL' errors in the remaining software.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 3, "q": "A laptop's touchpad and keyboard both stop responding only within a specific application, while working fine everywhere else in Windows. What does this suggest?", "choices": ["The application itself is frozen/unresponsive rather than a hardware failure", "The touchpad hardware has failed", "The keyboard hardware has failed", "The wireless card has failed"], "correct": 0, "expl": "If input devices work normally outside one specific application, the issue is isolated to that unresponsive application rather than the input hardware itself.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 4, "q": "Before opening a desktop case to work on internal components, what should a technician wear to prevent damaging sensitive electronics?", "choices": ["An ESD (anti-static) wrist strap", "Safety goggles only", "A dust mask only", "Steel-toed boots"], "correct": 0, "expl": "An ESD strap grounds the technician, preventing static discharge that can damage sensitive electronic components like RAM, CPUs, and motherboards.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 4, "q": "A technician needs to look up the specific chemical hazards, handling precautions, and "}, {"domain": 4, "q": "A technician signs a legal document promising not to disclose a client's confidential information learned while performing contracted work. What is this document called?", "choices": ["Non-disclosure agreement (NDA)", "End-user license agreement", "Acceptable Use Policy", "Service-level agreement"], "correct": 0, "expl": "A Non-disclosure agreement (NDA) legally binds a party to keep specific information confidential and not disclose it to unauthorized parties.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 4, "q": "When communicating with a frustrated customer over the phone, which behavior best reflects proper professional communication technique?", "choices": ["Actively listen without interrupting, and avoid using jargon they may not understand", "Use as much technical jargon as possible to sound knowledgeable", "Interrupt frequently to speed up the call", "Place them on hold immediately without explanation"], "correct": 0, "expl": "Effective customer communication involves active listening, avoiding unnecessary jargon, and being patient, which builds trust and de-escalates frustration.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 4, "q": "A technician is servicing a computer at a customer's desk and needs to step away briefly. What is the best practice regarding the customer's personal items and data?", "choices": ["Avoid touching personal items and maintain the customer's privacy and confidentiality", "Browse the customer's files while waiting", "Take a personal item as informal payment", "Leave the workstation unlocked and walk away"], "correct": 0, "expl": "Professional conduct requires respecting customer privacy, not accessing personal data unnecessarily, and safeguarding their belongings and confidentiality.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 4, "q": "A used hard drive containing sensitive customer data is being retired. Simply deleting the files is not sufficient. What should be done to ensure the data cannot be recovered?", "choices": ["Perform a secure wipe or physical destruction of the drive", "Reformat the drive using a quick format only", "Rename the files", "Move the files to the Recycle Bin"], "correct": 0, "expl": "A quick format or simple deletion does not remove underlying data; secure erasure (multiple-pass wipe) or physical destruction is required to prevent data recovery.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 4, "q": "An organization must properly dispose of old printer toner cartridges in accordance with environmental regulations. What resource specifies proper handling and disposal procedures?", "choices": ["The manufacturer's Safety Data Sheet (SDS) and local regulations", "The company's NDA", "The end-user license agreement", "The change management ticket"], "correct": 0, "expl": "SDS documents and local environmental regulations specify proper handling, recycling, and disposal procedures for materials like toner cartridges and batteries.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 4, "q": "Which practice reduces the risk of injury when lifting a heavy server chassis, such as bending at the knees rather than the waist?", "choices": ["Proper lifting technique", "ESD strap usage", "Chain of custody", "Cable management"], "correct": 0, "expl": "Proper lifting technique (bending at the knees, keeping the back straight, and getting help for heavy items) reduces the risk of workplace injury.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 4, "q": "A data center enforces a maximum number of devices plugged into a single circuit to avoid overloading it and tripping a breaker. What safety concern does this address?", "choices": ["Electrical fire and equipment damage risk from circuit overload", "ESD damage to components", "Toner exposure", "Improper lifting"], "correct": 0, "expl": "Overloading an electrical circuit can cause overheating, tripped breakers, or fire; distributing load and following rated capacities mitigates this risk.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 4, "q": "A technician is unsure whether a proposed fix is authorized under company policy. What is the best course of action?", "choices": ["Escalate to a supervisor or follow the established escalation procedure", "Proceed anyway since the customer asked for it", "Ignore the concern and complete the task", "Document nothing and move on"], "correct": 0, "expl": "When uncertain about scope or authorization, escalating through the proper chain (a supervisor or documented escalation procedure) ensures compliance and reduces risk.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 4, "q": "Which practice involves keeping a technician's own personal opinions and unrelated conversations to a minimum while working directly with a customer?", "choices": ["Maintaining professionalism and staying on task", "Multitasking with personal calls", "Offering unsolicited personal advice", "Interrupting the customer with jokes"], "correct": 0, "expl": "Professional conduct includes staying focused on the customer's issue and avoiding personal or unrelated distractions during a service interaction.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 4, "q": "A technician receives conflicting instructions from two different supervisors about a single ticket. What is the best practice?", "choices": ["Clarify and confirm the correct direction through the proper escalation/chain of command", "Follow whichever instruction was received first", "Ignore both instructions and decide independently", "Cancel the ticket without explanation"], "correct": 0, "expl": "When instructions conflict, following the established chain of command to clarify direction avoids miscommunication and ensures accountability.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 4, "q": "An organization requires two-person authorization before anyone can physically access the locked server room. What security/procedural concept does this reflect?", "choices": ["Separation of duties for physical access control", "Chain of custody", "Asset tagging", "Change management"], "correct": 0, "expl": "Requiring two people to jointly authorize access enforces separation of duties, reducing the risk of a single individual misusing sensitive physical access.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 1, "q": "Which Windows file system, designed as a more resilient successor to NTFS, is primarily used on Storage Spaces and certain server workloads?", "choices": ["ReFS", "FAT32", "ext4", "APFS"], "correct": 0, "expl": "Resilient File System (ReFS) was designed by Microsoft to improve data resiliency and scalability over NTFS, primarily used with Storage Spaces on Windows Server.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 1, "q": "Which file system is native to modern macOS and supports features like native encryption and snapshots?", "choices": ["APFS", "NTFS", "FAT32", "ext4"], "correct": 0, "expl": "Apple File System (APFS) is the default file system on modern macOS and iOS, supporting native encryption, snapshots, and space sharing.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 1, "q": "Which Linux file system is a common default on ironment on a Windows PC.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 1, "q": "A technician needs to boot a Windows installation from a USB flash drive because the machine has no optical drive. Which boot method is being used?", "choices": ["USB boot", "Internal hard drive boot", "Network boot (PXE)", "Multiboot"], "correct": 0, "expl": "Booting from a properly prepared USB flash drive is a common installation method for machines lacking an optical drive.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 1, "q": "A technician sets up a single physical machine to offer a menu at startup letting the user choose between Windows and Linux, each installed on its own partition. What is this configuration called?", "choices": ["Multiboot", "In-place upgrade", "Clean install only", "PXE boot"], "correct": 0, "expl": "A multiboot configuration installs multiple operating systems on separate partitions and presents a boot menu for the user to choose which one to load.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 1, "q": "Which Windows edition feature difference typically distinguishes Home from Pro editions, often required in a corporate environment?", "choices": ["Ability to join an Active Directory domain and use BitLocker/gpedit", "Ability to browse the internet", "Ability to install any application", "Availability of the Start menu"], "correct": 0, "expl": "Windows Home editions cannot join a domain and lack tools like BitLocker (full GUI) and gpedit, which are commonly needed in corporate environments and are present in Pro.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 1, "q": "Which upgrade path installs the new OS version over an existing installation while attempting to preserve apps and data, but carries  security risk?", "choices": ["Administrator account", "Standard account", "Guest account", "Power user (legacy)"], "correct": 0, "expl": "Administrator accounts have full system privileges; using one as the default daily-use account increases risk if compromised, which is why standard accounts are recommended for routine use.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 1, "q": "A technician needs to view and modify low-level Windows registry settings directly. Which tool provides this access?", "choices": ["regedit", "msconfig", "Disk Cleanup", "Character Map"], "correct": 0, "expl": "regedit opens the Windows Registry Editor, allowing direct viewing and modification of registry keys and values (with caution, as errors can destabilize the system).", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 1, "q": "Which Windows tool lets a technician selectively disable startup services and programs to troubleshoot a boot issue, without permanently uninstalling anything?", "choices": ["System Configuration (msconfig)", "Disk Management", "Local Group Policy Editor", "Certificate Manager"], "correct": 0, "expl": "msconfig (System Configuration) provides a diagnostic startup mode, letting a technician selectively disable services/startup items to isolate boot problems.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 1, "q": "A technician needs to quickly free up disk space by removing temporary files, old Windows Update caches, and Recycle Bin contents. Which built-in tool is designed for this?", "choices": ["Disk Cleanup", "Disk Management", "Device Manager", "Task Scheduler"], "correct": 0, "expl": "Disk Cleanup scans for and removes categories of unneeded files, such as temp files, old update caches, and Recycle Bin contents, to reclaim disk space.", "link": "https://www.professo ining an infected system, which anti-malware related step should be performed before running scans to ensure detection is effective?", "choices": ["Update the anti-malware software's definitions", "Disable the firewall", "Enable macros in Office", "Delete all system restore points immediately"], "correct": 0, "expl": "Updating anti-malware definitions before scanning ensures the tool can detect the latest known threats, improving remediation effectiveness.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 2, "q": "Which authentication factor category does a physical security key (like a USB hardware token) belong to?", "choices": ["Something you have", "Something you know", "Something you are", "Somewhere you are"], "correct": 0, "expl": "A hardware token or security key is a physical object the user possesses, classified as 'something you have' in authentication factor models.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 2, "q": "Which authentication factor category does a memorized PIN or password belong to?", "choices": ["Something you know", "Something you have", "Something you are", "Something you do"], "correct": 0, "expl": "A memorized password or PIN is classified as 'something you know,' one of the classic authentication factor categories.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 2, "q": "A company requires that no single employee can both approve and process a financial payment, splitting the responsibilities between two people. What security principle is this?", "choices": ["Separation of duties", "Least privilege", "Single sign-on", "Multifactor authentication"], "correct": 0, "expl": "Separation of duties divides critical tasks between multiple people, reducing the risk of fraud or error by any single individual acting alone.", "link": "https://www.profe sing attacks.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 2, "q": "Which security control specifically limits which MAC addresses are permitted to connect to a given switch port?", "choices": ["Port security (MAC filtering)", "BitLocker", "EFS", "UAC"], "correct": 0, "expl": "Port security restricts a switch port to only accept traffic from specific, authorized MAC addresses, helping prevent unauthorized device connections.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 2, "q": "A user reports that a coworker was able to see their password as they typed it on a shared kiosk. What preventive control best addresses this going forward?", "choices": ["A privacy screen and better physical positioning of the keyboard/monitor", "A stronger firewall rule", "A longer DHCP lease", "A new DNS server"], "correct": 0, "expl": "Privacy screens and thoughtful physical layout reduce the risk of shoulder surfing on shared or public terminals.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 2, "q": "Which malware defense technique involves regularly updating software and operating systems to close known vulnerabilities before they can be exploited?", "choices": ["Patch management", "Port flapping mitigation", "VLAN tagging", "RAID configuration"], "correct": 0, "expl": "Patch management, keeping software and OS updated, closes known security vulnerabilities before attackers can exploit them.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 2, "q": "An organization segments its guest Wi-Fi network from its internal corporate network using a separate VLAN and firewall rules. What is the primary security benefit?", "choices": ["Preventing untrusted guest devices from directly accessing internal corporate resources", "Improving cessfully", "That the RAID array is healthy", "That the DNS server is reachable", "That Bluetooth is enabled"], "correct": 0, "expl": "Trial-expiration errors after a purchase usually point to an activation problem, verifying the license key was entered and accepted is the logical first check.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 3, "q": "After installing a new printer driver, several unrelated applications begin crashing on launch. What is a reasonable troubleshooting step?", "choices": ["Roll back or uninstall the recently installed driver to see if stability returns", "Reinstall the entire operating system immediately", "Replace the power supply", "Disable the network adapter"], "correct": 0, "expl": "Since the crashes began right after a driver install, rolling back that specific change is the most direct way to test whether it's the cause.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 3, "q": "A Windows system's time and date are significantly incorrect, causing certificate and login errors on secured websites. What two things should be checked?", "choices": ["The CMOS battery and the system's time synchronization (NTP) settings", "The GPU driver and the DNS cache", "The RAID configuration and the printer spooler", "The Wi-Fi password and SSID"], "correct": 0, "expl": "Incorrect system time can stem from a dead CMOS battery (losing time when powered off) or misconfigured/unreachable time sync settings, both of which should be checked.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 3, "q": "A user's laptop screen shows visible artifacts and color distortion specifically when running graphically intensive applications, but looks fine at the desktop. What is the most likely cause?", "choices": ["An overheating or failing GPU under load", "A DNS misconfiguration", "A missing printer driver", "An expired antivirus license"], "correct": 0, "expl": "Artifacts that appear specifically under GPU load often indicate the graphics card is overheating or beginning to fail under the added stress.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 3, "q": "After a bad update, Windows fails to boot and Automatic Repair also fails. Which advanced option can revert the system to a state before the update was installed?", "choices": ["System Restore (to a prior restore point)", "Disk Cleanup", "Character Map", "Sticky Keys"], "correct": 0, "expl": "System Restore reverts system files and settings to a previous restore point, which can undo the effects of a problematic recent update.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 3, "q": "A user's browser is extremely slow to load any page, though a speed test shows normal internet bandwidth. What browser-specific troubleshooting step should be tried first?", "choices": ["Clear the browser cache and disable recently added extensions", "Reinstall the operating system", "Replace the network cable", "Reformat the hard drive"], "correct": 0, "expl": "A bloated cache or a misbehaving extension are common causes of browser-specific slowness when the underlying network connection itself tests fine.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 3, "q": "An application on a Mac repeatedly quits unexpectedly, and Console.app shows repeated crash reports for the same process. What is a reasonable next step?", "choices": ["Reinstall or update the specific application", "Reinstall macOS entirely", "Replace the logic board", "Disable Wi-Fi"], "correct": 0, "expl": "When crash reports consistently point to one specific application, reinstalling or updating that app is the appropriate targeted fix.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 3, "q": "A Windows PC's Start menu and search function have stopped responding, though other parts of the desktop work fine. What is a quick step to try before deeper troubleshooting?", "choices": ["Restart the Windows Explorer process via Task Manager", "Reinstall the entire OS", "Replace the RAM", "Update the BIOS"], "correct": 0, "expl": "Restarting the Explorer.exe process often resolves shell-related glitches, including a frozen Start menu or search, without needing a full reboot.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 3, "q": "A file fails to open with the error 'this file is in use by another process,' even though no visible application has it open. What should be checked?", "choices": ["Background processes or services (via Task Manager) that may be holding a lock on the file", "The RAID configuration", "The Wi-Fi signal strength", "The printer's paper tray"], "correct": 0, "expl": "A file lock can persist from a background process or crashed application instance; checking Task Manager for lingering processes can reveal and let you end the culprit.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 3, "q": "After installing a new webcam, its video feed appears extremely dark and grainy in every application. What should be checked first?", "choices": ["The webcam's driver and its exposure/lighting settings in the app or Windows camera settings", "The RAID array", "The DNS cache", "The printer spooler"], "correct": 0, "expl": "Dark, grainy video is typically caused by driver/exposure settings rather than a fundamental hardware fault, so checking those settings is the appropriate first step.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 3, "q": "A previously stable system starts experiencing random application crashes shortly after new RAM was installed. What troubleshooting step should be performed to rule out the new RAM?", "choices": ["Run a memory diagnostic tool (e.g., Windows Memory Diagnostic)", "Reinstall all applications", "Replace the power supply", "Update the printer driver"], "correct": 0, "expl": "Since the crashes began after a RAM change, running a memory diagnostic tool helps confirm or rule out faulty or incompatible memory as the cause.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 3, "q": "A user's OS reports that a critical system service failed to start, and several features (like printing or networking) stop working. What tool shows the specific reason the service failed?", "choices": ["Event Viewer", "Character Map", "Disk Cleanup", "Sticky Keys"], "correct": 0, "expl": "Event Viewer logs detailed error information about failed services, including the specific error code or reason, which helps pinpoint the root cause.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 3, "q": "An application's installer fails partway through with a generic error, and reattempting produces the same failure at the same point. What should be tried?", "choices": ["Run the installer as an administrator and temporarily disable antivirus/security software that might be blocking it", "Reformat the drive", "Replace the CPU", "Disable the monitor"], "correct": 0, "expl": "Installer failures are often caused by insufficient privileges or security software blocking file writes; running as admin and temporarily disabling AV can reveal this.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 3, "q": "A user's laptop trackpad works fine in Windows but is completely unresponsive inside one specific full-screen application. What does this most likely indicate?", "choices": ["An application-specific input/compatibility issue rather than a hardware fault", "Failed trackpad hardware", "A failed digitizer", "A dead battery"], "correct": 0, "expl": "If the trackpad works everywhere except inside one application, the issue is isolated to that app's input handling rather than the physical trackpad hardware.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 3, "q": "A user reports that spell-check and autocorrect have stopped working in only one specific application, while working normally system-wide. What is the most reasonable first step?", "choices": ["Check that application's specific language/proofing settings and reinstall or repair it if needed", "Reinstall the entire operating system", "Replace the keyboard", "Update the BIOS"], "correct": 0, "expl": "An issue isolated to one application's proofing feature is best addressed by checking that app's own settings, and repairing/reinstalling it if the settings appear correct but still fail.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 4, "q": "A technician needs to safely discharge static electricity from a component before it is even removed from its packaging. Which precaution addresses this specifically?", "choices": ["Handling the component only by its edges and using anti-static bags/mats", "Wearing safety goggles", "Using a fire extinguisher nearby", "Wearing steel-toed boots"], "correct": 0, "expl": "Anti-static bags and mats, along with handling components by their edges, protect sensitive electronics from electrostatic discharge even before an ESD strap is connected.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 4, "q": "Which type of fire extinguisher is rated safe for use on live electrical equipment, such as a computer or server rack fire?", "choices": ["  noting its disposal date, method, and the technician who processed it. What operational procedure does this support?", "choices": ["Asset/inventory tracking through end-of-life disposal", "Change management approval", "Incident escalation", "Backup rotation scheduling"], "correct": 0, "expl": "Documenting the disposal process as part of asset tracking maintains accountability for hardware throughout its entire lifecycle, including retirement.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 4, "q": "A technician is unsure how to safely dispose of a leaking PC battery. Which resource should they consult first?", "choices": ["The battery manufacturer's Safety Data Sheet (SDS)", "The company's NDA", "The EULA for installed software", "The service-level agreement"], "correct": 0, "expl": "SDS documents provide specific guidance on the safe handling and disposal of hazardous materials such as batteries, including ones that are leaking or damaged.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 4, "q": "Which practice specifically reduces risk when working around exposed high-voltage components, such as inside a CRT monitor or a power supply?", "choices": ["Avoiding opening the sealed component and leaving high-voltage repairs to qualified specialists", "Wearing an ESD strap while working inside it", "Using a Class A fire extinguisher", "Wearing a dust mask"], "correct": 0, "expl": "High-voltage components can retain a dangerous charge even when unplugged; general technicians should avoid opening these and leave such repairs to qualified specialists.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 4, "q": "A support technician needs to explain a complex technical issue to a non-technical customer. What is the best communication approach?", "choices": ["Use plain language and relatable analogies instead of technical jargon", "Use as much precise technical terminology as possible", "Speak quickly to save time", "Avoid explaining anything and just fix it silently"], "correct": 0, "expl": "Effective technical communication with non-technical customers means translating jargon into plain language and relatable comparisons they can understand.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 4, "q": "Two technicians disagree about the best fix for a recurring issue. What is the most professional way to resolve this before acting on production systems?", "choices": ["Discuss the options, weigh risk and evidence together, and escalate to a supervisor if needed", "Each proceed independently without informing the other", "Ignore the disagreement and pick randomly", "Argue in front of the customer"], "correct": 0, "expl": "Working through disagreements collaboratively, and escalating when needed, avoids conflicting changes being made to a production system and keeps the customer's experience professional.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 4, "q": "A company requires that any change to a production server be tested first in a separate, non-production environment. What best describes the purpose of this step?", "choices": ["Reducing the risk of the change causing unexpected issues in the live/production environment", "Meeting the terms of a EULA", "Satisfying a chain-of-custody requirement", "Completing asset tagging"], "correct": 0, "expl": "Testing changes in a non-production environment first helps catch unexpected issues before they can impact live systems and users.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 4, "q": "Which is an appropriate way for a technician to handle a customer's confidential information observed incidentally while performing repair work, such as documents on a desk?", "choices": ["Not read, discuss, or disclose it, treating it as strictly confidential", "Mention it casually to the customer to show attentiveness", "Photograph it for personal reference", "Share it with coworkers as an interesting anecdote"], "correct": 0, "expl": "Incidentally observed confidential information should never be read, discussed, or disclosed; professional conduct requires treating it as strictly private.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}, {"domain": 4, "q": "A technician wants to verify a change was successful and did not introduce any new issues before closing a change management ticket. What should be done?", "choices": ["Test/verify full functionality of the affected systems before closing the ticket", "Close the ticket immediately after applying the change", "Skip verification to save time", "Ask the customer to verify it themselves without technician follow-up"], "correct": 0, "expl": "Verifying full functionality after a change, consistent with sound change management practice, confirms the fix worked and didn't introduce new problems before the ticket is closed.", "link": "https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"}];
