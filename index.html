<script>
/* ===================== utilities ===================== */
function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function pick(arr){return arr[randInt(0,arr.length-1)];}
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=randInt(0,i);[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ===================== dynamic question generators ===================== */
function generateSubnetQuestion(){
  const prefix = pick([24,25,26,27,28,29,30]);
  const hostBits = 32-prefix;
  const total = Math.pow(2,hostBits);
  const usable = Math.max(total-2,0);
  const distractors = new Set([total, usable+2, Math.max(usable-2,0), usable+total>0?total*2:total]);
  distractors.delete(usable);
  let opts = [usable, ...Array.from(distractors)].slice(0,4);
  while(opts.length<4){ const extra = usable + randInt(1,8)*(Math.random()<0.5?-1:1); if(extra>=0 && !opts.includes(extra)) opts.push(extra); }
  opts = shuffle(opts);
  return {
    domain:2, dynamic:true,
    q:`A subnet is configured with a /${prefix} CIDR mask. How many usable host addresses does this subnet provide?`,
    choices: opts.map(String),
    correct: opts.indexOf(usable),
    expl:`A /${prefix} mask leaves ${hostBits} host bits, giving 2^${hostBits} = ${total} total addresses. Subtracting the network address and broadcast address leaves ${usable} usable host addresses.`,
    link:"https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"
  };
}
function generateRaidCapacityQuestion(){
  const size = pick([500,1000,2000,4000]);
  const level = pick(["RAID 0","RAID 1","RAID 5","RAID 10"]);
  let drives, usableGB, label;
  if(level==="RAID 0"){ drives = pick([2,3,4]); usableGB = size*drives; }
  else if(level==="RAID 1"){ drives = 2; usableGB = size; }
  else if(level==="RAID 5"){ drives = pick([3,4,5]); usableGB = size*(drives-1); }
  else { drives = pick([4,6]); usableGB = size*(drives/2); }
  const distractors = new Set([size*drives, size, size*(drives-1), size*(drives/2)]);
  distractors.delete(usableGB);
  let opts = [usableGB, ...Array.from(distractors)].filter(v=>v>0).slice(0,4);
  while(opts.length<4){ opts.push(usableGB + randInt(1,3)*size*(Math.random()<0.5?1:-1)); opts = opts.filter(v=>v>0); opts=[...new Set(opts)]; }
  opts = shuffle(opts.slice(0,4));
  return {
    domain:3, dynamic:true,
    q:`A technician builds a ${level} array using ${drives} identical ${size}GB drives. How much usable storage capacity does the array provide?`,
    choices: opts.map(v=>v+" GB"),
    correct: opts.indexOf(usableGB),
    expl:`${level} with ${drives} x ${size}GB drives yields ${usableGB}GB usable: RAID 0 stripes with no redundancy (full sum), RAID 1 mirrors (one drive's worth), RAID 5 loses one drive to parity, and RAID 10 loses half the drives to mirroring.`,
    link:"https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"
  };
}
function generateEffectivePermissionsQuestion(){
  const levels = ["No Access","Read","Modify","Full Control"];
  const ntfsIdx = randInt(0,3);
  const shareIdx = randInt(0,3);
  const effectiveIdx = Math.min(ntfsIdx, shareIdx);
  const opts = shuffle(levels.slice());
  return {
    domain:1, dynamic:true,
    q:`A shared folder has an NTFS permission of "${levels[ntfsIdx]}" and a Share permission of "${levels[shareIdx]}". What is a user's effective access level when connecting to this folder over the network?`,
    choices: opts,
    correct: opts.indexOf(levels[effectiveIdx]),
    expl:`When NTFS and Share permissions differ, the more restrictive of the two applies for network access. Here that's "${levels[effectiveIdx]}."`,
    link:"https://www.professormesser.com/free-a-plus-training/220-1202/220-1202-training-course/"
  };
}
function generatePortMatchQuestion(){
  const ports = [
    ["21","FTP"],["22","SSH"],["23","Telnet"],["25","SMTP"],["53","DNS"],
    ["80","HTTP"],["110","POP3"],["143","IMAP"],["389","LDAP"],["443","HTTPS"],
    ["445","SMB/CIFS"],["3389","RDP"]
  ];
  const [port, protocol] = pick(ports);
  const wrongOnes = shuffle(ports.filter(p=>p[1]!==protocol)).slice(0,3).map(p=>p[1]);
  const opts = shuffle([protocol, ...wrongOnes]);
  return {
    domain:2, dynamic:true,
    q:`Which protocol uses port ${port} by default?`,
    choices: opts,
    correct: opts.indexOf(protocol),
    expl:`Port ${port} is the default port for ${protocol}.`,
    link:"https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"
  };
}

/* ===================== storage ===================== */
async function loadHistory(examId){
  try{
    const res = await window.storage.get(`history:${examId}`);
    return res && res.value ? JSON.parse(res.value) : [];
  }catch(e){ return []; }
}
async function saveHistoryEntry(examId, entry){
  try{
    const hist = await loadHistory(examId);
    hist.unshift(entry);
    await window.storage.set(`history:${examId}`, JSON.stringify(hist.slice(0,25)));
  }catch(e){ console.error("storage error",e); }
}

/* ===================== state ===================== */
const state = {
  view:"boot",
  examId:null,
  quiz:null, // {mode, domainId, questions, idx, answers[], answered, selected}
};

/* ===================== boot sequence ===================== */
function runBoot(){
  const el = document.getElementById("app");
  const lines = [
    "RUNNING POST...",
    "MOBO ......... OK",
    "MEMORY ....... OK",
    "STORAGE ...... OK",
    "LOADING CORE 1 (220-1201) QUESTION BANK ... "+CORE1_BANK.length+" ITEMS",
    "LOADING CORE 2 (220-1202) QUESTION BANK ... "+CORE2_BANK.length+" ITEMS",
    "DIAGNOSTIC CONSOLE READY"
  ];
  el.innerHTML = `<div id="boot"></div>`;
  const boot = document.getElementById("boot");
  let i=0;
  function nextLine(){
    if(i>=lines.length){ setTimeout(()=>{state.view="picker"; render();}, 350); return; }
    const isLast = i===lines.length-1;
    const div = document.createElement("div");
    div.className = isLast ? "boot-ok" : (i<4 ? "boot-line-dim" : "");
    div.textContent = lines[i];
    boot.appendChild(div);
    i++;
    setTimeout(nextLine, isLast? 200 : 160);
  }
  nextLine();
}

/* ===================== quiz engine ===================== */
function buildQuestionSet(examId, mode, domainId){
  const ex = EXAMS[examId];
  let pool;
  if(mode==="domain"){
    pool = shuffle(ex.bank.filter(q=>q.domain===domainId));
    pool = pool.slice(0, Math.min(20, pool.length));
    const gen = ex.generators.find(g=>{ const sample=g(); return sample.domain===domainId; });
    if(gen) pool.push(gen());
  } else {
    // Full exam: sample a fresh weighted subset (target 90) from the larger pool,
    // drawing from each domain in proportion to its official exam weight so repeated
    // attempts pull a genuinely different mix of questions, not just a different order.
    const target = 90;
    pool = [];
    ex.domains.forEach(d=>{
      const domainPool = shuffle(ex.bank.filter(q=>q.domain===d.id));
      const count = Math.min(domainPool.length, Math.round(target * d.pct/100));
      pool.push(...domainPool.slice(0,count));
    });
    // top up/trim to land as close to 90 as possible if rounding left a gap
    if(pool.length < target){
      const used = new Set(pool);
      const leftover = shuffle(ex.bank.filter(q=>!used.has(q)));
      pool.push(...leftover.slice(0, target-pool.length));
    }
    pool = shuffle(pool).slice(0, target);
    // swap in one freshly generated question per available generator for extra variety
    ex.generators.forEach(g=>{
      const dyn = g();
      const idx = pool.findIndex(q=>q.domain===dyn.domain);
      if(idx>-1) pool[idx]=dyn;
    });
  }
  // pre-shuffle each question's choices, tracking the correct index
  return pool.map(q=>{
    const order = shuffle(q.choices.map((c,i)=>i));
    return {
      ...q,
      choices: order.map(i=>q.choices[i]),
      correct: order.indexOf(q.correct)
    };
  });
}

function startDomainQuiz(domainId){
  state.quiz = { mode:"domain", domainId, questions: buildQuestionSet(state.examId,"domain",domainId), idx:0, answers:[], answered:false, selected:null };
  state.view="quiz"; render();
}
function startFullExam(){
  state.quiz = { mode:"full", domainId:null, questions: buildQuestionSet(state.examId,"full"), idx:0, answers:[], answered:false, selected:null };
  state.view="quiz"; render();
}

function renderQuiz(){
  const ex = EXAMS[state.examId];
  const quiz = state.quiz;
  const q = quiz.questions[quiz.idx];
  const el = document.getElementById("app");
  const domainName = ex.domains.find(d=>d.id===q.domain)?.name || "";
  const pct = Math.round(((quiz.idx)/quiz.questions.length)*100);

  const choicesHtml = q.choices.map((c,i)=>{
    let cls = "choice";
    if(quiz.answered){
      if(i===q.correct) cls += " correct";
      else if(i===quiz.selected) cls += " incorrect";
    } else if(i===quiz.selected){ cls += " selected"; }
    return `<button class="${cls}" data-i="${i}" ${quiz.answered?"disabled":""}><span class="letter">${String.fromCharCode(65+i)}</span><span>${escapeHtml(c)}</span></button>`;
  }).join("");

  el.innerHTML = `
    <div class="crumb"><button id="quitQuiz">&larr; Exit quiz</button></div>
    <div class="quiz-progress"><span>${quiz.mode==="full"?"Capstone Exam":"Domain "+q.domain+".0 Quiz"}</span><span>${quiz.idx+1} / ${quiz.questions.length}</span></div>
    <div class="quiz-bar"><div class="quiz-bar-fill" style="width:${pct}%"></div></div>
    <div class="q-domain-tag">${escapeHtml(domainName)}${q.dynamic?" · Generated":""}</div>
    <div class="q-text">${escapeHtml(q.q)}</div>
    <div class="choices">${choicesHtml}</div>
    <div id="feedbackSlot"></div>
    <div class="quiz-actions">
      <span></span>
      <button class="btn-primary" id="nextBtn" style="display:none;width:auto;padding:11px 20px;">${quiz.idx===quiz.questions.length-1?"See results":"Next question"} &rarr;</button>
    </div>
  `;
  document.getElementById("quitQuiz").addEventListener("click", ()=>{ state.view="examHome"; render(); });
  el.querySelectorAll(".choice").forEach(btn=>{
    btn.addEventListener("click", ()=>selectAnswer(parseInt(btn.dataset.i,10)));
  });
  const nextBtn = document.getElementById("nextBtn");
  nextBtn.addEventListener("click", advanceQuiz);
}

function selectAnswer(i){
  const quiz = state.quiz;
  if(quiz.answered) return;
  quiz.selected = i;
  quiz.answered = true;
  const q = quiz.questions[quiz.idx];
  const correct = i===q.correct;
  quiz.answers.push({domain:q.domain, correct, selectedIndex:i, selectedText:q.choices[i]});
  renderQuiz();
  const slot = document.getElementById("feedbackSlot");
  slot.innerHTML = `<div class="feedback-panel ${correct?'':'wrong'}">
      <span class="label">${correct?"Correct":"Not quite"}</span>
      ${escapeHtml(q.expl)}
      ${q.link?` <a href="${q.link}" target="_blank" rel="noopener">Review this topic — Professor Messer</a>`:""}
    </div>`;
  document.getElementById("nextBtn").style.display = "inline-block";
}

function advanceQuiz(){
  const quiz = state.quiz;
  if(quiz.idx < quiz.questions.length-1){
    quiz.idx++; quiz.answered=false; quiz.selected=null;
    renderQuiz();
  } else {
    finishQuiz();
  }
}

async function finishQuiz(){
  const quiz = state.quiz;
  const score = quiz.answers.filter(a=>a.correct).length;
  const total = quiz.answers.length;
  await saveHistoryEntry(state.examId, {date:Date.now(), mode:quiz.mode, domainId:quiz.domainId, score, total});
  state.view="results";
  render();
}

/* ===================== results ===================== */
function renderResults(){
  const ex = EXAMS[state.examId];
  const quiz = state.quiz;
  const score = quiz.answers.filter(a=>a.correct).length;
  const total = quiz.answers.length;
  const pct = Math.round((score/total)*100);

  const byDomain = {};
  quiz.questions.forEach((q,i)=>{
    byDomain[q.domain] = byDomain[q.domain] || {correct:0,total:0};
    byDomain[q.domain].total++;
    if(quiz.answers[i].correct) byDomain[q.domain].correct++;
  });
  const breakdownHtml = Object.keys(byDomain).sort().map(dId=>{
    const d = ex.domains.find(x=>x.id==dId);
    const b = byDomain[dId];
    const p = Math.round((b.correct/b.total)*100);
    return `<div class="weight-row">
      <div class="weight-label" title="${escapeHtml(d.name)}">${escapeHtml(d.name)}</div>
      <div class="weight-bar-track"><div class="weight-bar-fill" style="width:${p}%;background:${p>=70?'var(--success)':p>=50?'var(--amber)':'var(--error)'}"></div></div>
      <div class="weight-pct">${b.correct}/${b.total}</div>
    </div>`;
  }).join("");

  const reviewHtml = quiz.questions.map((q,i)=>{
    const a = quiz.answers[i];
    return `<div class="review-item ${a.correct?'was-correct':''}">
      <div class="rq">${i+1}. ${escapeHtml(q.q)}</div>
      <div class="ra">Correct answer: ${escapeHtml(q.choices[q.correct])}${a.correct? "" : " — you answered "+escapeHtml(a.selectedText||'')}</div>
    </div>`;
  }).join("");

  const el = document.getElementById("app");
  el.innerHTML = `
    <div class="crumb"><button id="toHome">&larr; ${ex.name} home</button></div>
    <div class="result-hero">
      <div class="result-score">${score}<span>/${total}</span></div>
      <div class="result-label">${pct}% — ${quiz.mode==="full"?"Full capstone exam":"Domain "+quiz.domainId+".0 quiz"}</div>
    </div>
    <div class="history-title">Score by domain</div>
    <div class="domain-breakdown">${breakdownHtml}</div>
    <div class="btn-row">
      <button class="btn-primary" style="width:auto;" id="retakeBtn">Retake (new random set)</button>
      <button class="btn-small" id="reviewToggle">Show full review</button>
    </div>
    <div id="reviewList" style="display:none;" class="review-list">${reviewHtml}</div>
    <footer><span>Original practice questions · not affiliated with CompTIA</span><span>Free video course: Professor Messer</span></footer>
  `;
  document.getElementById("toHome").addEventListener("click", ()=>{ state.view="examHome"; render(); });
  document.getElementById("retakeBtn").addEventListener("click", ()=>{
    if(quiz.mode==="full") startFullExam(); else startDomainQuiz(quiz.domainId);
  });
  document.getElementById("reviewToggle").addEventListener("click", (e)=>{
    const rl = document.getElementById("reviewList");
    const showing = rl.style.display !== "none";
    rl.style.display = showing ? "none":"flex";
    e.target.textContent = showing ? "Show full review" : "Hide full review";
  });
}

/* ===================== router ===================== */
function render(){
  if(state.view==="boot") return runBoot();
  if(state.view==="picker") return renderPicker();
  if(state.view==="examHome") return renderExamHome();
  if(state.view==="quiz") return renderQuiz();
  if(state.view==="results") return renderResults();
}
render();

</script>
