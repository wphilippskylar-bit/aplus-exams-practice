<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>A+ Core 1 &amp; Core 2 — Diagnostic Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a1628;
    --bg-panel:#0d1e34;
    --bg-card:#0f2138;
    --line:rgba(94,234,212,0.14);
    --line-soft:rgba(94,234,212,0.07);
    --cyan:#5eead4;
    --cyan-dim:#2f6f66;
    --orange:#ff6b35;
    --amber:#f5b942;
    --text:#e8edf2;
    --text-dim:#7d93a8;
    --text-faint:#4b5d70;
    --success:#4ade80;
    --error:#ff5470;
    --mono:'IBM Plex Mono', ui-monospace, monospace;
    --display:'Space Grotesk', ui-sans-serif, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(var(--line-soft) 1px, transparent 1px) 0 0/100% 28px,
      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px) 0 0/28px 100%,
      var(--bg);
    color:var(--text);
    font-family:var(--mono);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--cyan);color:#04141f;}
  a{color:var(--cyan);}
  button{font-family:inherit;cursor:pointer;}
  .app{max-width:920px;margin:0 auto;padding:24px 18px 72px;}

  /* ---------- header / status bar ---------- */
  .statusbar{
    display:flex;align-items:center;justify-content:space-between;
    font-size:11px;letter-spacing:.08em;color:var(--text-faint);
    border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:22px;
    text-transform:uppercase;
  }
  .statusbar .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--cyan);margin-right:6px;box-shadow:0 0 6px var(--cyan);}

  /* ---------- boot sequence ---------- */
  #boot{
    font-family:var(--mono);font-size:13px;line-height:1.9;color:var(--cyan);
    min-height:40vh;padding-top:8vh;white-space:pre-wrap;
  }
  #boot .cursor{display:inline-block;width:8px;height:15px;background:var(--cyan);vertical-align:middle;animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}
  .boot-line-dim{color:var(--text-faint);}
  .boot-ok{color:var(--success);}

  /* ---------- headings ---------- */
  h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;}
  .eyebrow{
    font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--cyan-dim);margin-bottom:6px;
  }
  .page-title{font-size:28px;margin-bottom:4px;}
  .page-sub{color:var(--text-dim);font-size:13.5px;margin-bottom:28px;max-width:60ch;}

  /* ---------- exam picker cards ---------- */
  .picker-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:640px){.picker-grid{grid-template-columns:1fr;}}
  .exam-card{
    background:var(--bg-card);border:1px solid var(--line);border-radius:2px;
    padding:20px 18px 18px;position:relative;overflow:hidden;transition:border-color .15s, transform .15s;
  }
  .exam-card:hover{border-color:var(--cyan);transform:translateY(-2px);}
  .exam-card::before{
    content:'';position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,var(--cyan),var(--orange));
  }
  .exam-code{font-family:var(--mono);font-size:11px;color:var(--text-faint);letter-spacing:.1em;}
  .exam-name{font-family:var(--display);font-size:21px;font-weight:600;margin:4px 0 14px;}
  .weight-row{display:flex;align-items:center;gap:8px;font-size:11.5px;margin-bottom:6px;color:var(--text-dim);}
  .weight-label{flex:0 0 auto;width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .weight-bar-track{flex:1;height:5px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;}
  .weight-bar-fill{height:100%;background:var(--cyan);border-radius:2px;}
  .weight-pct{flex:0 0 32px;text-align:right;color:var(--text-faint);}
  .exam-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--text-faint);margin-top:14px;padding-top:12px;border-top:1px solid var(--line);}
  .btn-primary{
    margin-top:16px;width:100%;background:var(--cyan);color:#04141f;border:none;
    padding:11px 14px;font-family:var(--mono);font-weight:600;font-size:12.5px;
    letter-spacing:.06em;text-transform:uppercase;border-radius:2px;
  }
  .btn-primary:hover{background:#8ff2e2;}

  /* ---------- nav / breadcrumb ---------- */
  .crumb{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text-faint);margin-bottom:18px;}
  .crumb button{background:none;border:1px solid var(--line);color:var(--text-dim);padding:5px 10px;border-radius:2px;font-size:11px;letter-spacing:.05em;}
  .crumb button:hover{border-color:var(--cyan);color:var(--cyan);}

  /* ---------- domain menu ---------- */
  .domain-list{display:flex;flex-direction:column;gap:10px;margin-bottom:26px;}
  .domain-row{
    display:flex;align-items:center;gap:14px;background:var(--bg-card);border:1px solid var(--line);
    padding:13px 14px;border-radius:2px;transition:border-color .15s;
  }
  .domain-row:hover{border-color:var(--cyan);}
  .domain-num{font-family:var(--display);font-size:18px;color:var(--cyan-dim);width:28px;flex:0 0 auto;}
  .domain-info{flex:1;min-width:0;}
  .domain-info .name{font-size:13.5px;color:var(--text);}
  .domain-info .meta{font-size:11px;color:var(--text-faint);margin-top:2px;}
  .btn-small{
    background:transparent;border:1px solid var(--cyan-dim);color:var(--cyan);
    padding:8px 12px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;border-radius:2px;flex:0 0 auto;
  }
  .btn-small:hover{background:var(--cyan);color:#04141f;}

  .capstone-card{
    background:linear-gradient(135deg, rgba(255,107,53,0.10), rgba(94,234,212,0.06));
    border:1px solid var(--orange);padding:18px;border-radius:2px;margin-bottom:26px;
  }
  .capstone-card .name{font-family:var(--display);font-size:17px;margin-bottom:4px;}
  .capstone-card .meta{font-size:12px;color:var(--text-dim);margin-bottom:12px;}
  .btn-orange{background:var(--orange);color:#1a0800;border:none;padding:11px 16px;font-family:var(--mono);font-weight:600;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;border-radius:2px;}
  .btn-orange:hover{background:#ff8a5f;}

  /* ---------- history ---------- */
  .history-block{margin-top:8px;}
  .history-title{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);margin-bottom:10px;}
  .history-row{display:flex;justify-content:space-between;font-size:12px;padding:8px 0;border-bottom:1px solid var(--line-soft);color:var(--text-dim);}
  .history-row .score{color:var(--cyan);font-weight:600;}
  .empty-note{font-size:12px;color:var(--text-faint);font-style:italic;}

  /* ---------- quiz view ---------- */
  .quiz-progress{display:flex;justify-content:space-between;font-size:11px;color:var(--text-faint);margin-bottom:8px;letter-spacing:.05em;text-transform:uppercase;}
  .quiz-bar{height:4px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;margin-bottom:26px;}
  .quiz-bar-fill{height:100%;background:var(--cyan);transition:width .25s;}
  .q-domain-tag{display:inline-block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);border:1px solid rgba(245,185,66,0.35);padding:3px 8px;border-radius:2px;margin-bottom:12px;}
  .q-text{font-family:var(--display);font-size:18px;line-height:1.45;margin-bottom:20px;color:var(--text);}
  .choices{display:flex;flex-direction:column;gap:9px;margin-bottom:20px;}
  .choice{
    text-align:left;background:var(--bg-card);border:1px solid var(--line);color:var(--text);
    padding:13px 14px;font-size:13.5px;font-family:var(--mono);border-radius:2px;line-height:1.4;
    display:flex;gap:10px;
  }
  .choice .letter{flex:0 0 auto;color:var(--cyan-dim);font-weight:700;}
  .choice:hover:not(:disabled){border-color:var(--cyan);}
  .choice.selected{border-color:var(--cyan);background:rgba(94,234,212,0.06);}
  .choice.correct{border-color:var(--success);background:rgba(74,222,128,0.10);}
  .choice.correct .letter{color:var(--success);}
  .choice.incorrect{border-color:var(--error);background:rgba(255,84,112,0.10);}
  .choice.incorrect .letter{color:var(--error);}
  .choice:disabled{cursor:default;}

  .feedback-panel{background:var(--bg-card);border-left:3px solid var(--cyan);padding:14px 16px;font-size:13px;line-height:1.6;color:var(--text-dim);margin-bottom:18px;border-radius:0 2px 2px 0;}
  .feedback-panel.wrong{border-left-color:var(--error);}
  .feedback-panel .label{color:var(--text);font-weight:600;display:block;margin-bottom:4px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;}
  .feedback-panel a{font-size:12px;}

  .quiz-actions{display:flex;justify-content:space-between;gap:10px;}

  /* ---------- results ---------- */
  .result-hero{text-align:center;padding:30px 10px 24px;}
  .result-score{font-family:var(--display);font-size:56px;font-weight:700;color:var(--cyan);line-height:1;}
  .result-score span{font-size:24px;color:var(--text-faint);}
  .result-label{font-size:13px;color:var(--text-dim);margin-top:8px;letter-spacing:.04em;}
  .domain-breakdown{display:flex;flex-direction:column;gap:10px;margin:26px 0;}
  .review-list{display:flex;flex-direction:column;gap:10px;margin-top:20px;}
  .review-item{background:var(--bg-card);border:1px solid var(--line);border-left:3px solid var(--error);padding:12px 14px;border-radius:0 2px 2px 0;font-size:12.5px;}
  .review-item.was-correct{border-left-color:var(--success);}
  .review-item .rq{color:var(--text);margin-bottom:6px;}
  .review-item .ra{color:var(--text-dim);font-size:11.5px;}

  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;}

  footer{margin-top:50px;padding-top:16px;border-top:1px solid var(--line);font-size:11px;color:var(--text-faint);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
const CORE1_BANK = [{"domain": 1, "q": "A laptop's battery has begun swelling and is pushing up on the trackpad. What should a technician do first?", "choices": ["Continue using the laptop until a replacement battery arrives", "Power off the device and stop using it immediately, then arrange safe disposal", "Puncture the battery to release trapped gas", "Charge the battery fully to test its capacity"], "correct": 1, "expl": "A swollen battery indicates a dangerous chemical breakdown and fire/rupture risk. The device should be powered off and not used until the battery is safely replaced and disposed of properly.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 1, "q": "Which mobile device component would a technician most likely replace to fix a laptop that no longer detects any wireless networks, when the antenna itself tests fine?", "choices": ["Wireless card", "Digitizer", "Inverter", "Trackpad"], "correct": 0, "expl": "The wireless (Wi-Fi) card is the component responsible for detecting and connecting to networks; if the antenna is confirmed good, the card itself is the next suspect.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 1, "q": "A user wants to unlock their phone using their face instead of a PIN. Which category of component enables this?", "choices": ["Physical privacy and security components (biometrics)", "Wireless card", "Digitizer", "Docking station"], "correct": 0, "expl": "Biometric hardware, such as a front-facing IR camera for facial recognition or a fingerprint reader, falls under physical privacy and security components.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 1, "q": "Which connection method is most associated with contactless mobile payments at a store terminal?", "choices": ["Bluetooth", "NFC", "Lightning", "Tethering"], "correct": 1, "expl": "Near-field communication (NFC) is a very short-range wireless technology commonly used for contactless payments and quick pairing.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 1, "q": "A technician wants to give a laptop access to full-size HDMI, Ethernet, and USB-A ports it lacks natively. What accessory accomplishes this?", "choices": ["Docking station", "Stylus", "Webcam", "Trackpad"], "correct": 0, "expl": "A docking station (or port replicator) expands the available ports on a laptop by connecting through a single cable or bay.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 1, "q": "Which technology allows a laptop to use a smartphone's cellular data connection over Wi-Fi?", "choices": ["Hotspot/tethering", "NFC", "Bluetooth pairing PIN", "SIM ejection"], "correct": 0, "expl": "Tethering (creating a mobile hotspot) shares a phone's cellular data connection with other devices over Wi-Fi, Bluetooth, or USB.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 1, "q": "During Bluetooth pairing, a phone displays a six-digit code that must match on both devices. What step of the pairing process is this?", "choices": ["Enabling Bluetooth", "Finding a device for pairing", "Entering the appropriate PIN code", "Testing connectivity"], "correct": 2, "expl": "Confirming a matching passkey/PIN is the authentication step of Bluetooth pairing, ensuring the correct device is being paired with.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 1, "q": "An organization allows employees to enroll their personal phones for corporate email while restricting corporate data with a management profile. What model does this describe?", "choices": ["BYOD (Bring Your Own Device)", "Corporate-owned device configuration", "Tethering", "APIPA"], "correct": 0, "expl": "Bring Your Own Device (BYOD) is an MDM configuration model where employees use personally owned hardware enrolled under corporate policy enforcement.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 1, "q": "Which mobile location technology can determine a device's position indoors, where GPS signals are typically weak or unavailable?", "choices": ["Cellular location services", "SIM swapping", "eSIM provisioning", "Bluetooth pairing"], "correct": 0, "expl": "Cellular (and Wi-Fi) location services triangulate position using nearby towers/access points, which works better indoors than GPS satellite signals.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 1, "q": "A user is warned they are about to exceed their monthly mobile plan allotment while streaming video over cellular. What mobile device synchronization concept does this describe?", "choices": ["Recognizing data caps", "Calendar sync", "Contact sync", "Cloud storage sync"], "correct": 0, "expl": "Recognizing data caps refers to monitoring and warning users about cellular data usage limits imposed by their carrier plan.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 1, "q": "Which component would a technician check first if a tablet's on-screen keyboard stops responding to touch in one specific area of the screen?", "choices": ["Digitizer", "Inverter", "Wireless card", "Microphone"], "correct": 0, "expl": "The digitizer is the touch-sensing layer; localized dead zones for touch input point to a digitizer issue rather than the display panel itself.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 1, "q": "A company issues corporate smartphones and pushes required apps, restricts the camera, and enforces a passcode policy remotely. Which technology enables this?", "choices": ["Mobile device management (MDM)", "NFC pairing", "Tethering", "eSIM"], "correct": 0, "expl": "MDM software lets an organization enforce policies, push corporate applications, and manage configurations on enrolled corporate or BYOD devices.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 2, "q": "Which port does HTTPS use by default?", "choices": ["21", "80", "443", "3389"], "correct": 2, "expl": "HTTPS (secure web traffic) uses TCP port 443 by default, while unencrypted HTTP uses port 80.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 2, "q": "A technician needs to securely copy files to a remote Linux server using an encrypted terminal session. Which port/protocol pair is used?", "choices": ["23 - Telnet", "22 - SSH", "25 - SMTP", "110 - POP3"], "correct": 1, "expl": "SSH (port 22) provides an encrypted remote shell and secure file transfer, replacing the unencrypted Telnet (port 23).", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 2, "q": "Which protocol resolves human-readable domain names like example.com into IP addresses?", "choices": ["DHCP", "DNS", "LDAP", "NTP"], "correct": 1, "expl": "DNS (port 53) translates domain names into IP addresses so devices can locate each other on a network.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 2, "q": "A workstation is configured to automatically request an IP address, subnet mask, and gateway from the network. Which protocol provides this on ports 67/68?", "choices": ["DHCP", "FTP", "SMB", "RDP"], "correct": 0, "expl": "Dynamic Host Configuration Protocol (DHCP) automatically leases IP addressing information to clients using UDP ports 67 (server) and 68 (client).", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 2, "q": "Which port is used by Remote Desktop Protocol (RDP) to remotely control a Windows machine's desktop?", "choices": ["445", "3389", "389", "143"], "correct": 1, "expl": "RDP uses TCP port 3389 to provide a full graphical remote desktop session to a Windows system.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 2, "q": "A file share on a Windows network is accessed using SMB. Which port does this use?", "choices": ["445", "110", "53", "23"], "correct": 0, "expl": "Server Message Block (SMB), used for Windows file and printer sharing, communicates over TCP port 445.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 2, "q": "Which of these protocols is connection-oriented and guarantees delivery through acknowledgments and retransmission?", "choices": ["UDP", "TCP", "ICMP", "ARP"], "correct": 1, "expl": "TCP is connection-oriented, using a handshake and acknowledgments to guarantee ordered, reliable delivery, unlike the connectionless UDP.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 2, "q": "An office wants a wireless frequency band with the least interference from older devices such as cordless phones and microwaves, at the cost of shorter range. Which should they choose?", "choices": ["2.4GHz", "5GHz", "900MHz", "AM band"], "correct": 1, "expl": "5GHz offers more non-overlapping channels and less interference from common household devices than 2.4GHz, though at shorter range.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 2, "q": "Which wireless technology is used for passive inventory tags that are read by a nearby scanner without a battery?", "choices": ["RFID", "Bluetooth", "NFC", "802.11ac"], "correct": 0, "expl": "Radio-frequency identification (RFID) tags, especially passive ones, are powered by the reader's signal and used widely for inventory tracking.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 2, "q": "A network appliance filters incoming email for spam and malware attachments before it reaches the mail server. What is this device called?", "choices": ["Spam gateway", "Load balancer", "Proxy server", "Syslog server"], "correct": 0, "expl": "A spam gateway inspects and filters inbound/outbound email traffic to block spam and malicious content before delivery.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 2, "q": "Which network appliance distributes incoming client requests across multiple servers to prevent any single server from being overwhelmed?", "choices": ["UTM", "Load balancer", "Proxy server", "Syslog collector"], "correct": 1, "expl": "A load balancer distributes traffic across multiple backend servers for performance and redundancy.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 2, "q": "A factory uses legacy embedded systems to monitor and control industrial equipment like pumps and valves remotely. What is this type of system called?", "choices": ["SCADA", "IoT thermostat", "SOHO router", "VLAN"], "correct": 0, "expl": "Supervisory Control and Data Acquisition (SCADA) systems are legacy embedded systems used to monitor and control industrial processes.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 2, "q": "Which DNS record type maps a domain name directly to an IPv4 address?", "choices": ["A", "AAAA", "CNAME", "MX"], "correct": 0, "expl": "An A record maps a hostname to an IPv4 address; the AAAA record does the same for IPv6.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 2, "q": "An email domain publishes a TXT record listing the servers authorized to send mail on its behalf, in order to reduce spoofing. What is this record?", "choices": ["SPF", "MX", "CNAME", "AAAA"], "correct": 0, "expl": "Sender Policy Framework (SPF) is a TXT record specifying which mail servers are authorized to send email for a domain, helping combat spoofing.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 2, "q": "A DHCP administrator wants a specific server to always receive the same IP address from the DHCP pool. What should they configure?", "choices": ["A DHCP reservation", "A DHCP exclusion", "A DHCP scope", "APIPA"], "correct": 0, "expl": "A DHCP reservation binds a specific MAC address to a specific IP address within the scope, so that device always leases the same address.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 2, "q": "Which device logically separates a single physical switch into multiple isolated broadcast domains?", "choices": ["Patch panel", "VLAN", "PoE injector", "ONT"], "correct": 1, "expl": "A Virtual LAN (VLAN) segments a physical switch into multiple logically isolated networks, each its own broadcast domain.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 2, "q": "A technician needs to power a ceiling-mounted wireless access point through the same cable that carries its data, with no nearby electrical outlet. What technology should be used?", "choices": ["Power over Ethernet (PoE)", "eSATA", "USB-C", "Thunderbolt"], "correct": 0, "expl": "PoE delivers electrical power over standard Ethernet cabling, eliminating the need for a separate power connection at devices like APs and cameras.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 2, "q": "A device 01-training-course/"}, {"domain": 3, "q": "Which display technology is self-emissive, meaning each pixel produces its own light without a separate backlight?", "choices": ["TN LCD", "IPS LCD", "OLED", "VA LCD"], "correct": 2, "expl": "OLED (organic light-emitting diode) panels emit their own light per pixel, allowing true blacks and no separate backlight, unlike LCD technologies.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 3, "q": "A monitor's specification lists how many distinct colors it can reproduce, particularly relevant to photo and video editing. What attribute is this?", "choices": ["Refresh rate", "Color gamut", "Pixel density", "Inverter output"], "correct": 1, "expl": "Color gamut describes the range of colors a display can reproduce; a wider gamut can display more colors accurately.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 3, "q": "Which cable category standard defines the pin arrangement used when terminating twisted-pair Ethernet cable to an RJ45 connector?", "choices": ["T568A/T568B", "SATA revision 3", "PCIe Gen4", "USB-C alt mode"], "correct": 0, "expl": "T568A and T568B are wiring standards that define the order of the eight conductors when terminating twisted-pair cable into RJ45 connectors.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 3, "q": "Which fiber connector type uses a small, square push-pull form factor and is common in modern SFP transceivers?", "choices": ["LC (Lucent connector)", "ST (straight tip)", "RJ11", "F-type"], "correct": 0, "expl": "The LC (Lucent connector) is a small-form-factor fiber connector widely used in modern networking equipment, including SFP transceivers.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 3, "q": "A technician needs cabling rated hannel configuration", "ECC configuration", "RAID 1", "SLI"], "correct": 0, "expl": "Populating matched memory slots in pairs (or more) enables dual/multi-channel configurations, increasing effective memory bandwidth.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 3, "q": "Which SSD communications interface offers the highest performance by connecting directly to the PCIe bus rather than a legacy storage controller?", "choices": ["SATA", "NVMe", "mSATA", "eSATA"], "correct": 1, "expl": "NVMe (Non-Volatile Memory Express) SSDs communicate directly over PCIe lanes, offering much higher throughput than SATA-based storage.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 3, "q": "Which RAID level mirrors data across two drives for redundancy but provides no capacity gain?", "choices": ["RAID 0", "RAID 1", "RAID 5", "RAID 10"], "correct": 1, "expl": "RAID 1 mirrors identical data across two drives, providing fault tolerance at the cost of usable capacity (50% overhead).", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 3, "q": "A server needs both redundancy and improved performance, and has at least four drives available. Which RAID level combines mirroring and striping?", "choices": ["RAID 0", "RAID 5", "RAID 6", "RAID 10"], "correct": 3, "expl": "RAID 10 (1+0) combines mirrored pairs that are then striped together, providing both redundancy and improved read/write performance.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 3, "q": "Which storage form factor is a small card-edge SSD commonly installed directly onto a motherboard slot without cables?", "choices": ["M.2", "2.5-inch SATA", "3.5-inch SATA", "5.25-inch bay"], "correct": 0, "expl": "M.2 drives are small, cable-free storage modules that plug directly into a matching motherboard slot, supporting either SATA or NVMe signaling.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 3, "q": "A technician is choosing a motherboard form factor for a compact home-theater PC build with minimal expansion needs. Which is the smallest common option?", "choices": ["ATX", "microATX", "ITX", "E-ATX"], "correct": 2, "expl": "ITX (Information Technology eXtended) is the smallest common motherboard form factor, ideal for compact builds with limited expansion slots.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 3, "q": "Which motherboard/BIOS feature cryptographically verifies that only trusted, signed bootloaders and OS components load during startup?", "choices": ["Secure Boot", "TPM pairing", "Fan curve control", "RAID controller"], "correct": 0, "expl": "Secure Boot uses UEFI firmware to check digital signatures on the bootloader and OS components, preventing unsigned or malicious code from loading at startup.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 3, "q": "Which onboard security chip stores encryption keys and is required by many OS-level full-disk encryption features such as BitLocker?", "choices": ["TPM", "HSM (standalone appliance)", "GPU", "NIC"], "correct": 0, "expl": "The Trusted Platform Module (TPM) is a dedicated chip on the motherboard that securely stores cryptographic keys used for features like BitLocker.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 3, "q": "Which CPU architecture is designed around a reduced, simpler instruction set and is common in mobile devices for its power efficiency?", "choices": ["x86", "x64", "ARM", "CISC (traditional desktop)"], "correct": 2, "expl": "ARM (Advanced RISC Machine) processors use a reduced instruction set, delivering strong power efficiency, which is why they're common in phones and tablets.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 3, "q": "A gaming PC's CPU is reaching unsafe temperatures under load. Which cooling solution offers the best heat dissipation for sustained high performance?", "choices": ["Stock heat sink alone", "Liquid cooling", "Thermal paste alone with no heat sink", "Leaving the case open"], "correct": 1, "expl": "Liquid cooling loops move heat away from the CPU more efficiently than air-based heat sinks, which is valuable for sustained high-load scenarios.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 3, "q": "What is the primary purpose of applying thermal paste between a CPU and its heat sink?", "choices": ["To electrically insulate the CPU", "To fill microscopic gaps and improve heat transfer", "To prevent corrosion on the socket pins", "To reduce fan noise"], "correct": 1, "expl": "Thermal paste fills tiny air gaps between the CPU's heat spreader and the cooler's base, improving thermal conductivity and heat transfer.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 3, "q": "A power supply is rated for 110-120 VAC in the US but the same unit can be switched to accept 220-240 VAC. What must a technician verify before shipping the PC overseas?", "choices": ["The voltage selector switch is set correctly for the destination region", "The wattage rating is doubled", "The PSU is non-modular", "The 20+4 pin connector is removed"], "correct": 0, "expl": "Many PSUs support dual input voltage ranges via a physical switch; setting it incorrectly for the region's mains voltage can damage the PSU or connected components.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 3, "q": "Which printer type uses toner and a heated fuser roller to bond print onto paper, well suited for high-volume office printing?", "choices": ["Laser", "Inkjet", "Thermal", "Impact"], "correct": 0, "expl": "Laser printers use a toner cartridge, drum, and heated fuser to bond powdered toner to the page, offering fast, high-volume printing.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 3, "q": "A receipt printer at a register produces output without any ink or toner cartridge, using heat-sensitive paper. What printer type is this?", "choices": ["Laser", "Inkjet", "Thermal", "Impact"], "correct": 2, "expl": "Thermal printers use a heating element to darken special heat-sensitive paper, commonly seen in receipt printers, with no ink or toner involved.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 4, "q": "A developer wants to test a new application in an isolated environment without risking the host system, and plans to discard the environment afterward. What is the best use of a VM here?", "choices": ["Sandbox", "Desktop virtualization", "Public cloud IaaS", "Load balancing"], "correct": 0, "expl": "A sandbox VM provides an isolated, disposable environment ideal for testing potentially unstable or unknown software safely.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 4, "q": "An organization runs an old accounting application that only supports a legacy operating system no longer installed on any physical machines. Which virtualization use case addresses this?", "choices": ["Application virtualization for legacy software/OS", "Cross-platform virtualization only", "Type 1 hypervisor on bare desktop", "Containerization only"], "correct": 0, "expl": "Running the legacy OS inside a VM lets the old application continue functioning on modern hardware without requiring dedicated legacy machines.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 4, "q": "Which hypervisor type runs directly on server hardware without a host operating system underneath it, typically used in datacenters?", "choices": ["Type 1 (bare-metal)", "Type 2 (hosted)", "Container runtime only", "Desktop emulator"], "correct": 0, "expl": "A Type 1 hypervisor installs directly on the hardware (bare-metal), offering better performance and is common in enterprise/datacenter deployments.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 4, "q": "A hypervisor such as VirtualBox or VMware Workstation runs as an application on top of Windows. What type of hypervisor is this?", "choices": ["Type 1", "Type 2", "Container engine", "Bare-metal"], "correct": 1, "expl": "A Type 2 (hosted) hypervisor runs as an application on top of an existing host operating system, unlike a Type 1 which runs directly on hardware.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 4, "q": "Which virtualization technology packages an application with its dependencies but shares the host OS kernel, making it more lightweight than a full VM?", "choices": ["Container", "Type 1 hypervisor", "VDI session", "Sandbox VM"], "correct": 0, "expl": "Containers share the host operating system's kernel and package only the application and its dependencies, making them more lightweight than full VMs.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 4, "q": "Employees connect from thin clients to centrally hosted desktop sessions running on datacenter servers. What is this architecture called?", "choices": ["VDI (Virtual Desktop Infrastructure)", "IaaS", "Community cloud", "SCADA"], "correct": 0, "expl": "Virtual Desktop Infrastructure (VDI) hosts full desktop operating systems centrally, letting users connect remotely from thin clients or other devices.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 4, "q": "A cloud provider allows a company to rent virtual servers, storage, and networking, while the company manages its own OS and applications on top. What cloud service model is this?", "choices": ["SaaS", "PaaS", "IaaS", "DaaS"], "correct": 2, "expl": "Infrastructure as a Service (IaaS) provides virtualized compute, storage, and network resources, leaving the OS and application layer to the customer.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 4, "q": "A cloud environment automatically adds or removes virtual server instances based on real-time demand. Which cloud characteristic does this describe?", "choices": ["Elasticity", "Multitenancy", "Metered utilization", "File synchronization"], "correct": 0, "expl": "Elasticity is the ability of a cloud environment to automatically scale resources up or down in response to changing demand.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 4, "q": "Several unrelated organizations share the same underlying physical cloud infrastructure while their data remains logically isolated from each other. What is this called?", "choices": ["Multitenancy", "Private cloud", "Community cloud", "VDI"], "correct": 0, "expl": "Multitenancy describes multiple customers (tenants) sharing the same physical infrastructure in a public cloud, with logical separation of their data.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 4, "q": "Several hospitals within the same healthcare network jointly fund and share a cloud environment tailored to their shared regulatory needs, but it is not open to the general public. What cloud model is this?", "choices": ["Public cloud", "Private cloud", "Community cloud", "Hybrid cloud"], "correct": 2, "expl": "A community cloud is shared by several organizations with common concerns (such as compliance requirements), and access is restricted to that community rather than the general public.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 5, "q": "A desktop emits a series of beeps on startup and does not display any video. What should a technician suspect first?", "choices": ["A POST (power-on self-test) failure, likely RAM or video card", "A printer driver conflict", "A DNS resolution failure", "A Bluetooth pairing failure"], "correct": 0, "expl": "Beep codes occur during POST when the system detects a critical hardware failure before video output initializes, often pointing to RAM, video, or other core components.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 5, "q": "A PC intermittently reboots at random and the case feels unusually warm. Which two symptoms most directly suggest a cooling problem?", "choices": ["Random shutdown and overheating", "Blank screen and no power", "Capacitor swelling and burning smell only", "Inaccurate system date/time and slow boot"], "correct": 0, "expl": "Random shutdowns combined with overheating strongly suggest the CPU or system is thermally throttling or shutting down to protect itself from heat damage.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 5, "q": "A user reports their PC's clock keeps resetting to 2002 every time it's powered off. What is the most likely cause?", "choices": ["A dead CMOS battery", "A failing power supply fan", "A corrupted printer driver", "A missing DHCP reservation"], "correct": 0, "expl": "A depleted CMOS battery causes the BIOS/UEFI to lose its saved date/time and other settings whenever the system loses power.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 5, "q": "A technician opens a case and notices several motherboard capacitors are visibly bulging at the top. What should they conclude?", "choices": ["The capacitors are failing and the board likely needs replacement", "This is normal wear and no action is needed", "The PSU wattage is too low", "The RAM needs reseating"], "correct": 0, "expl": "Bulging or swollen capacitors are a classic sign of capacitor failure, often leading to instability, and typically require motherboard replacement.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 5, "q": "A hard drive makes a repeated clicking sound and Windows can no longer detect it. What does this most likely indicate?", "choices": ["Mechanical failure of the drive (e.g., failing read/write heads)", "A loose HDMI cable", "A driver update is needed", "The drive needs to be defragmented"], "correct": 0, "expl": "Repeated clicking noises from a mechanical hard drive typically indicate the read/write head is failing to find data correctly, a sign of imminent drive failure.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 5, "q": "A RAID 5 array reports one failed drive but the array continues to function normally. What should the technician do?", "choices": ["Replace the failed drive promptly to restore redundancy before a second failure occurs", "Ignore it since the array still works", "Convert it to RAID 0 immediately", "Reformat all drives in the array"], "correct": 0, "expl": "RAID 5 can tolerate a single drive failure using parity, but the array is running in a degraded state; a second failure before the disk is replaced would cause data loss.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 5, "q": "S.M.A.R.T. monitoring on a drive reports a predictive failure warning. What should a technician do?", "choices": ["Immediately back up data and plan to replace the drive", "Ignore the warning since S.M.A.R.T. is often wrong", "Run a full format to clear the warning", "Increase the drive's spindle speed"], "correct": 0, "expl": "S.M.A.R.T. predictive failure alerts indicate the drive is reporting internal errors consistent with impending failure; data should be backed up and the drive replaced.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 5, "q": "A projected image is present but appears washed out and significantly darker than expected. What is the most likely cause?", "choices": ["An aging or failing bulb", "Incorrect subnet mask", "A missing printer driver", "A failed RAID array"], "correct": 0, "expl": "As projector bulbs age, brightness gradually degrades, producing a dim image; a dying bulb is the most common cause of this symptom.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 5, "q": "A monitor displays a persistent faint image of a previously static desktop icon, even after changing the wallpaper. What is this called?", "choices": ["Display burn-in", "Dead pixel", "Incorrect input source", "Sizing issue"], "correct": 0, "expl": "Burn-in occurs when a static image is displayed for a prolonged period, leaving a faint permanent ghost image on the panel.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 5, "q": "A user's external monitor shows the wrong content source, cycling between a blank screen and a 'no signal' message. What is the first thing to check?", "choices": ["That the correct input source is selected on the monitor", "The RAID configuration", "The DNS server address", "The printer's toner level"], "correct": 0, "expl": "Many monitors have multiple inputs (HDMI, DisplayPort, VGA); selecting the wrong one A (mini-SATA) was an earlier compact SSD form factor for laptops, largely replaced by the more flexible M.2 standard.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 3, "q": "Which storage interface, often used in enterprise servers, supports higher reliability and multiple simultaneous commands, distinct from consumer SATA drives?", "choices": ["SAS (Serial Attached SCSI)", "mSATA", "eSATA", "USB 2.0"], "correct": 0, "expl": "SAS drives are commonly used in enterprise/server environments, offering higher reliability, dual-porting, and better command queuing than consumer SATA drives.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 3, "q": "Which RAID level stripes data across all drives with no redundancy, maximizing capacity and performance but risking total data loss if any drive fails?", "choices": ["RAID 0", "RAID 1", "RAID 5", "RAID 6"], "correct": 0, "expl": "RAID 0 stripes data across all drives for maximum capacity and speed, but offers no fault tolerance \u2014 losing any single drive loses the entire array.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 3, "q": "Which RAID level can tolerate the failure of up to two drives simultaneously by using double parity?", "choices": ["RAID 0", "RAID 1", "RAID 5", "RAID 6"], "correct": 3, "expl": "RAID 6 adds a second parity block compared to RAID 5, allowing the array to survive the simultaneous failure of any two drives.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 3, "q": "Which motherboard connector type is specifically used to attach front-panel power/reset buttons and status LEDs to the board?", "choices": ["Headers", "M.2 slot", "PCIe slot", "eSATA port"], "correct": 0, "expl": "Front-panel headers are small pin groups on the motherboard used to connect the case's power button, reset button, and status LEDs.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 3, "q": "A technician wants to add a dedicated graphics card to a system that currently relies on integrated graphics. Which expansion slot is typically used?", "choices": ["PCIe", "PCI (legacy)", "M.2", "SATA"], "correct": 0, "expl": "Modern dedicated graphics cards connect via a PCIe slot, which offers the bandwidth needed for high-performance video output.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 3, "q": "Which CPU socket compatibility factor must a technician always verify before purchasing a new processor for an existing motherboard?", "choices": ["That the CPU's socket type matches the motherboard's socket (e.g., AMD vs Intel and specific generation)", "That the CPU has ECC memory support", "That the CPU includes an M.2 slot", "That the CPU uses a Molex power connector"], "correct": 0, "expl": "CPUs are only physically and electrically compatible with a matching motherboard socket type and chipset generation; mismatches simply won't fit or function.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 3, "q": "Which power supply specification indicates how efficiently it converts AC input to DC output, with less wasted heat at higher ratings?", "choices": ["80 PLUS / energy efficiency rating", "Wattage rating alone", "20+4 pin connector type", "Modular vs non-modular design"], "correct": 0, "expl": "Energy efficiency certifications (like 80 PLUS tiers) indicate how much input power is converted to usable DC output versus wasted as heat.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 3, "q": "An impact printer used for multipart carbon-copy forms relies on which mechanism to place ink onto the page?", "choices": ["A ribbon struck by pins against the paper", "A heated fuser bonding toner", "A heating element on thermal paper", "An inkjet nozzle spraying ink droplets"], "correct": 0, "expl": "Impact printers use pins striking an inked ribbon against the paper, which is why they're still used for multipart forms that require a physical impression through multiple layers.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 4, "q": "A software company wants developers to test their app across Windows, macOS, and Linux without owning separate physical machines for each. Which VM use case fits best?", "choices": ["Cross-platform virtualization", "SCADA monitoring", "PoE injection", "RAID striping"], "correct": 0, "expl": "Cross-platform virtualization lets a single physical host run VMs of different guest operating systems, enabling multi-OS testing without dedicated hardware for each.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 4, "q": "Which resource requirement is most critical to plan for when hosting many VMs on a single server, since each guest OS consumes its own share continuously?", "choices": ["RAM (memory) allocation", "Bluetooth pairing", "NFC range", "RFID tag count"], "correct": 0, "expl": "Because each VM runs its own OS instance, sufficient RAM allocation across all guests is one of the most critical resource planning factors on a virtualization host.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 4, "q": "Which virtualization requirement addresses isolating VM network traffic from other tenants or VMs on the same physical host?", "choices": ["Network requirements (segmentation/isolation)", "Storage requirements", "CPU core count", "Cooling requirements"], "correct": 0, "expl": "Proper network configuration, including VLANs or virtual switches, is required to isolate and secure traffic between VMs sharing a physical host.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 4, "q": "Which hypervisor type would a home user most likely install to run a single VM on their existing Windows gaming PC?", "choices": ["Type 2 (hosted) hypervisor", "Type 1 (bare-metal) hypervisor", "SCADA controller", "Container orchestrator only"], "correct": 0, "expl": "A Type 2 hosted hypervisor, like VirtualBox or VMware Workstation, installs as an application on an existing OS, which is the typical setup for home/desktop use.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 4, "q": "A datacenter runs dozens of VMs directly on server hardware with no underlying general-purpose OS, maximizing performance and resource allocation. Which hypervisor type is this?", "choices": ["Type 1 (bare-metal)", "Type 2 (hosted)", "Container runtime only", "Emulator"], "correct": 0, "expl": "Type 1 (bare-metal) hypervisors install directly on server hardware, avoiding the overhead of a host OS and offering better performance for many VMs.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 4, "q": "Which cloud model would best fit a startup that wants to avoid owning any physical servers and rents shared infrastructure from a major provider available to the general public?", "choices": ["Public cloud", "Private cloud", "Community cloud", "On-premises datacenter"], "correct": 0, "expl": "A public cloud is owned and operated by a third-party provider and made available to the general public/multiple customers on shared infrastructure.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 4, "q": "A large enterprise maintains its own dedicated cloud infrastructure, accessible only to its internal departments, for strict ector's bulb life"], "correct": 0, "expl": "If drives are powered but the array itself isn't recognized, the RAID controller's configuration, firmware, or cabling to the drives is the most likely point of failure.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 5, "q": "A storage array reports unusually low input/output operations per second (IOPS), causing sluggish database performance. What could explain this on a spinning-disk array?", "choices": ["The array may be degraded (a failed drive) or drives may be reaching their mechanical performance limits under heavy load", "The printer driver is outdated", "The DHCP scope is exhausted", "The DNS cache is corrupted"], "correct": 0, "expl": "Low IOPS on spinning disks can result from a degraded array recalculating parity, drive contention, or simply exceeding the mechanical throughput of HDDs under load.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 5, "q": "A monitor displays a single pixel that is always black regardless of what's on screen. What is this called?", "choices": ["A dead pixel", "Burn-in", "Incorrect input source", "Sizing issue"], "correct": 0, "expl": "A dead pixel fails to illuminate at all and remains black regardless of the displayed image, unlike a stuck pixel which is locked to one color.", "link": "https://www.professormesser.com/free-a-plus-training/220-1201/220-1201-training-course/"}, {"domain": 5, "q": "A projected image intermittently flickers and the projector shuts off on its own every 10-15 minutes, especially in a warm room. What is the most likely cause?", "choices": ["Overheating causing intermittent projector shutdown", "A missing HDMI driver", "A dead pixel on the projector panel", "Incorrect color display calibration"], "correct": 0, "expl": "Projectors that shut down intermittently, especially in warm environments, often suffer from inadequate cooling
