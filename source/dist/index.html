  RK.add({ track: TR, id: '3.1', dom: 3, short: 'Windows OS issues', title: 'Given a scenario, troubleshoot common Windows OS issues',
    goal: 'Diagnose and fix BSODs, boot failures, performance and stability problems, failing services, USB resource warnings, slow profiles and time drift.',
    kw: /\b(bsod|blue screen|stop code|boot (issue|failure|loop)|no os found|operating system not found|bootrec|degraded performance|sluggish|slow (pc|computer|boot)|frequent shutdown|services? (not|fail(ed|s)? to) start|application crash|low memory|usb controller|system instability|unstable|slow profile|user profile|time drift|clock|restore point|roll back|reimage|rebuild (the )?profile|sfc)/,
    parts: [
      P('Boot problems and BSODs', 'Diagnose blue screens, boot failures and "no OS found", and repair boot files from the recovery environment.',
        `<ul><li><b>Blue screen of death (BSOD)</b> — Windows stopped to protect itself. Note the <b>stop code</b> and any file named (e.g. a driver). Usual causes: bad/new driver, failing RAM or drive, overheating, recent update. Fixes: roll back the driver or update, test RAM (Windows Memory Diagnostic), check the drive.</li>
<li><b>Boot issues</b> — stuck at logo, boot loop, slow boot. Try <b>Startup Repair</b> and <b>Safe Mode</b> from the Windows Recovery Environment (WinRE).</li>
<li><b>No OS found</b> — first check hardware: is the drive detected in UEFI? Is it first in boot order? Is a USB stick taking priority? If the drive is fine, repair the boot data: <code>bootrec /rebuildbcd</code> (plus <code>/fixboot</code> and <code>/fixmbr</code> on older MBR systems).</li></ul>
<p>Reach WinRE: hold Shift while clicking Restart, interrupt boot three times, or boot from install media → Repair your computer.</p>` + pro('Write the BSOD stop code into the ticket before anything else. "CRITICAL_PROCESS_DIED" and "MEMORY_MANAGEMENT" lead to very different fixes.') + trap('"No OS found" with a USB stick plugged in is usually just the boot order.'),
        [['A PC shows "No operating system found". What should you check first?', 'Whether the drive is detected and first in the boot order', ['Reinstall Windows immediately', 'Run Disk Cleanup', 'Rebuild the user profile'], 'Hardware/boot order first.'],
         ['Which command rebuilds the Boot Configuration Data?', 'bootrec /rebuildbcd', ['sfc /scannow', 'chkdsk /f', 'gpupdate /force'], 'BCD repair.']],
        'c2-bootfix'),
      P('Performance, crashes and instability', 'Find what is causing slowness, low memory, crashes, instability and unexpected shutdowns.',
        `<ul><li><b>Degraded performance</b> — Task Manager / Resource Monitor: which process uses CPU, memory, disk? Check startup items, free disk space, malware, and whether the PC meets the app\'s requirements.</li>
<li><b>Low memory warnings</b> — a leaking process, too many apps, or genuinely too little RAM.</li>
<li><b>Applications crashing</b> — Event Viewer → Application log (Event ID 1000) names the faulting module. Update, repair or reinstall the app.</li>
<li><b>System instability</b> — random errors and freezes: corrupt system files (<code>DISM /Online /Cleanup-Image /RestoreHealth</code>, then <code>sfc /scannow</code>), bad drivers, failing hardware.</li>
<li><b>Frequent shutdowns</b> — overheating (dust, failed fan), failing power supply, or a power setting. Check the System log for unexpected shutdown events (Event ID 41).</li></ul>` + pro('Run DISM before sfc: DISM fixes the repair store, then sfc uses it to fix Windows files.') + trap('Low memory warnings do not always mean "add RAM". Find the process first.'),
        [['Which order should you run the Windows repair tools?', 'DISM /RestoreHealth, then sfc /scannow', ['sfc, then format', 'chkdsk, then DISM, then reimage', 'gpupdate, then sfc'], 'Fix the store, then the files.'],
         ['A PC shuts off under heavy load and the fans are clogged. Most likely cause?', 'Overheating', ['Corrupt profile', 'Time drift', 'Bad BCD'], 'Thermal protection.']],
        'c2-perfts'),
      P('Services, USB resources, profiles and time', 'Fix services that will not start, USB controller resource warnings, slow profile loads and time drift.',
        `<ul><li><b>Services not starting</b> — check the <b>start type</b> (Automatic/Manual/Disabled), <b>dependencies</b> (a required service is disabled), the <b>logon account</b> (expired password), and the System log. services.msc or <code>Get-Service</code>/<code>Set-Service</code>.</li>
<li><b>USB controller resource warnings</b> — too many devices (or high-bandwidth devices) on one controller/hub. Move devices to ports on another controller, use a powered hub, update chipset/USB drivers.</li>
<li><b>Slow profile load</b> — large roaming profiles, network drives that time out, or a corrupt profile (one user only). Fix the network path, or rebuild the profile (rename it, sign in fresh, copy data back).</li>
<li><b>Time drift</b> — clock wrong → Kerberos/certificate/cloud sign-in failures. <code>w32tm /query /status</code>, <code>w32tm /resync</code>. If it drifts again after power-off, replace the CMOS battery.</li></ul>` + pro('A service that "will not start" after a password change is almost always running under that account. Update the service\'s logon credentials.') + trap('If only one user is slow to sign in, suspect their profile; if everyone is, suspect the network, policies or the server.'),
        [['A service never starts after reboot but starts fine by hand. Likely cause?', 'Its start type is Manual', ['Corrupt BCD', 'Time drift', 'USB controller limits'], 'Set it to Automatic.'],
         ['Which command forces Windows to resync its clock?', 'w32tm /resync', ['sfc /scannow', 'bootrec /fixboot', 'net time /set'], 'Windows Time service.']],
        'c2-svcts'),
      P('Choosing the fix', 'Choose between reboot, service restart, app repair, more resources, sfc/repair, restore, rollback, profile rebuild and reimage.',
        `<p>CompTIA lists these common troubleshooting steps. Use the <b>least invasive</b> one that fits the evidence:</p>
<ol><li><b>Reboot</b>.</li>
<li><b>Restart services</b>.</li>
<li><b>Uninstall/reinstall/update applications</b>.</li>
<li><b>Add resources</b> (RAM, storage) and <b>verify requirements</b>.</li>
<li><b>System file check</b> (sfc, DISM) and <b>repair Windows</b> (repair install keeps apps and data).</li>
<li><b>Restore</b> (System Restore point) or <b>roll back updates</b>/drivers when trouble started after a change.</li>
<li><b>Rebuild Windows profiles</b> when one user is affected.</li>
<li><b>Reimage</b> — when nothing else works and data is backed up.</li></ol>` + pro('"When did it start, and what changed then?" usually points straight at roll back or restore.') + trap('Reimaging is the last option, not the first — unless the evidence is malware you cannot trust (then it is the right call).'),
        [['Problems started right after last night\'s update. Best first fix?', 'Roll back the update', ['Reimage', 'Add RAM', 'Rebuild every profile'], 'Undo the change.'],
         ['Only one of five users on a PC has a slow, broken sign-in. Likely fix?', 'Rebuild that user\'s Windows profile', ['Reimage the PC', 'Replace the RAM', 'Rebuild the BCD'], 'Profile-specific.']],
        'c2-fixpick')
    ],
    wrap: { recap: ['BSOD: read the stop code; roll back drivers/updates; test RAM and drive.', 'No OS found: drive detected? boot order? then bootrec /rebuildbcd from WinRE.', 'Slowness/low memory/crashes: find the process (Task Manager, Event Viewer); DISM then sfc.', 'Frequent shutdowns: heat, PSU, Event ID 41.', 'Services: start type, dependencies, logon account. USB resource warnings: spread devices across controllers.', 'Slow profile: one user → rebuild profile. Time drift: w32tm /resync; CMOS battery.'], lab: 'c2-winos-wrap' }
  });

    [['The OS update will not install', 'Free storage / charge / Wi-Fi for the OS update', 'Needs space, battery and Wi-Fi.'],
     ['Battery drains fast since installing a new app', 'Check battery usage by app', 'Find the app draining it.'],
     ['Two-year-old phone dies at 30% and is slow', 'Battery health / replace battery', 'Worn battery.'],
     ['Phone reboots randomly since a recent app was installed', 'Remove the faulty app or update the OS', 'Random reboots.'],
     ['Car audio will not connect after a phone update', 'Toggle Bluetooth and re-pair', 'Remove and re-add the pairing.'],
     ['Connects to every network except the office Wi-Fi after a password change', 'Forget and rejoin the Wi-Fi network', 'Stale saved credentials.'],
     ['Tap-to-pay does nothing at the register', 'Enable NFC / check payment app', 'NFC off or wallet not set.'],
     ['Screen does not rotate when the phone is turned', 'Turn off rotation lock', 'Autorotate setting.']],
    'Connectivity: toggle the radio, forget/re-pair, airplane mode on/off, restart, then reset network settings.');
  M('c2-mob-ts-wrap', 'Mobile help desk', 'Combined 3.2',
    'Pick the best first step.', ['Force-stop the app', 'Clear cache', 'Update the app', 'Free storage', 'Update the OS', 'Check battery usage', 'Re-pair Bluetooth', 'Reset network settings', 'Check rotation lock'],
    [['Banking app freezes on login', 'Force-stop the app', 'First step for a hung app.'],
     ['Photo app crashes when opening an album', 'Clear cache', 'Corrupt cache.'],
     ['App says "this version is no longer supported"', 'Update the app', 'Required update.'],
     ['Cannot install any new apps', 'Free storage', 'Storage full.'],
     ['Several apps require a newer system version', 'Update the OS', 'OS fails to update? Check space and charge.'],
     ['Battery lasts half a day since last week', 'Check battery usage', 'Find the culprit.'],
     ['Headset drops audio after an update', 'Re-pair Bluetooth', 'Remove and re-add.'],

  RK.add({ track: TR, id: '3.2', dom: 3, short: 'Mobile OS & application issues', title: 'Given a scenario, troubleshoot common mobile OS and application issues',
    goal: 'Fix mobile apps that fail to launch, close, update or install, slow devices, OS update failures, battery drain, random reboots, Bluetooth/Wi-Fi/NFC problems and autorotate.',
    kw: /\b(app(lication)? (fails?|won.t|will not|crash|freez)|fails? to (launch|close|update|install)|slow to respond|battery (life|drain)|random reboot|bluetooth|nfc|autorotat|rotation|mobile (os|app)|iphone|android|ios update|os fails to update)/,
    parts: [
      P('Mobile application issues', 'Fix apps that fail to launch, close, update or install, and slow responses.',
        `<table><tr><th>Symptom</th><th>Usual fixes (in order)</th></tr>
<tr><td><b>Fails to launch</b></td><td>Restart device → update app → clear cache (Android) / offload &amp; reinstall (iOS) → check OS compatibility</td></tr>
<tr><td><b>Fails to close / crashes</b></td><td>Force-stop → clear cache/data → update → reinstall</td></tr>
<tr><td><b>Fails to update</b></td><td>Free storage, stable Wi-Fi, correct account signed in to the store, OS version supported</td></tr>
<tr><td><b>Fails to install</b></td><td>Storage, OS version, store restrictions (MDM may block it), payment/account issues</td></tr>
<tr><td><b>Slow to respond</b></td><td>Restart, close background apps, free storage (keep 10%+ free), update</td></tr></table>
<p>Android lets you <b>clear cache</b> or <b>clear data</b> per app (Settings → Apps). iOS uses <b>offload app</b> (keeps data) or delete and reinstall.</p>` + pro('On managed phones, check MDM first: "cannot install" is often a policy block, not a fault.') + trap('Clear data resets the app completely (logins, settings). Clear cache is the gentler first step.'),
        [['An Android app crashes on open. Which gentle step comes before reinstalling?', 'Clear the app cache', ['Factory reset', 'Remote wipe', 'Replace the battery'], 'Least invasive first.'],
         ['An app update fails with "storage full". Fix?', 'Free up storage space', ['Turn off Wi-Fi', 'Enable developer mode', 'Rotate the screen'], 'Updates need space.']],
        'c2-mobapp'),
      P('OS, battery, reboots and connectivity', 'Fix OS update failures, battery drain, random reboots, Bluetooth/Wi-Fi/NFC problems and autorotate.',
        `<ul><li><b>OS fails to update</b> — needs free storage, battery above ~50% or charging, and Wi-Fi; device may no longer be supported.</li>
<li><b>Battery life issues</b> — Settings → Battery shows usage by app; screen brightness, location, background refresh. Old batteries lose capacity (check battery health); swollen = replace immediately.</li>
<li><b>Random reboots</b> — faulty app or OS bug (update/remove the app), overheating, failing battery.</li>
<li><b>Connectivity issues</b>:
<ul><li><b>Bluetooth</b> — toggle off/on, forget and re-pair, check the other device.</li>
<li><b>Wi-Fi</b> — forget and rejoin, toggle airplane mode, check captive portal, reset network settings.</li>
<li><b>NFC</b> — enabled? wallet/payment app set as default? case too thick?</li></ul></li>

        [['A phone will not install an OS update. What should you check?', 'Free storage, battery charge and Wi-Fi', ['Rotation lock', 'NFC', 'Developer mode'], 'Update prerequisites.'],
         ['Headphones stopped connecting after an update. First fix?', 'Forget the device and re-pair it', ['Factory reset', 'Replace the battery', 'Clear browser cache'], 'Bluetooth pairing refresh.']],

  RK.add({ track: TR, id: '3.3', dom: 3, moreLabs: ['c2-adb'], short: 'Mobile security issues', title: 'Given a scenario, troubleshoot common mobile OS and application security issues',

    kw: /\b(sideload|unofficial (app )?store|developer mode|root(ed|ing)?|jailbr|spoof(ed|ing)? app|high (network|data) traffic|data.usage|fake (security )?warning|leaked|unexpected app|mobile malware|ads on (the )?phone)/,

        `<ul><li><b>Application source / unofficial application stores</b> — installing outside the official store (<b>sideloading</b>) skips the store\'s malware screening.</li>
<li><b>Developer mode</b> — Android developer options (USB debugging, install over USB). Useful for developers, risky for everyone else.</li>
<li><b>Root access / jailbreak</b> — removes the OS sandbox and restrictions (root = Android, jailbreak = iOS). Malware gets full control; updates may break; MDM marks the device non-compliant.</li>
<li><b>Unauthorized/malicious application — application spoofing</b> — fake apps imitating real ones (copy-cat names and icons) to steal data or credentials.</li></ul>` + pro('Check the developer name and download count before installing — spoofed apps often have a slightly different publisher name.') + trap('Root is Android; jailbreak is iOS. Both have the same security consequence.'),
        [['What is the main risk of installing apps from an unofficial store?', 'The apps are not screened for malware', ['They use more battery', 'They cannot be updated', 'They disable NFC'], 'No vetting.'],
         ['Removing iOS restrictions to gain full control is called:', 'Jailbreaking', ['Rooting', 'Sideloading', 'Developer mode'], 'iOS = jailbreak.']],
        'c2-mobsec-concern'),
      P('Symptoms of a compromised device', 'Recognize mobile malware symptoms and respond.',
        `<p><b>Common symptoms:</b></p>
<ul><li><b>High network traffic</b> and <b>data-usage limit notifications</b> — something is uploading or downloading in the background.</li>
<li><b>Degraded response time</b> — lag, heat, fast battery drain.</li>
<li><b>Limited or no Internet connectivity</b> — malicious VPN/proxy profile intercepting traffic.</li>
<li><b>High number of ads</b> — adware, often from a sideloaded or fake app.</li>
<li><b>Fake security warnings</b> — scareware pushing a "cleaner" app.</li>
<li><b>Unexpected application behavior</b> — apps sending texts, opening by themselves, new unknown apps.</li>
<li><b>Leaked personal files/data</b>.</li></ul>
<p><b>Response:</b> remove suspicious apps and profiles, update the OS, scan with mobile security software, change passwords from a clean device; factory reset if in doubt (after confirming backups do not restore the bad app).</p>` + pro('Check Settings → VPN & device management (iOS) or Security → device admin apps (Android) for profiles and admin apps the user did not install.') + trap('A browser pop-up claiming the phone has viruses is itself the attack, not a real warning.'),

    ],

  T('c2-pcsec', 'Browser redirects and a hijacked PC', 'hosts file, proxy, DNS cache',
    'Ticket: "Every time I go to my bank, I get a different-looking site, and I get certificate warnings." Elevated Command Prompt on the PC.',
    { shell: 'cmd', prompt: 'C:\\Windows\\System32>' },
    [{ t: 'Show the contents of the Windows hosts file.', accept: [/^type c:\\windows\\system32\\drivers\\etc\\hosts$/i, /^type drivers\\etc\\hosts$/i, /^notepad c:\\windows\\system32\\drivers\\etc\\hosts$/i], show: 'type C:\\Windows\\System32\\drivers\\etc\\hosts', hint: 'type <path to hosts> — it is in System32\\drivers\\etc', out: '# Copyright (c) 1993-2009 Microsoft Corp.\n#\n# localhost name resolution is handled within DNS itself.\n185.243.115.7   www.firstbank.com\n185.243.115.7   firstbank.com', ask: { q: 'Which IP address is the bank\'s name being sent to?', accept: ['185.243.115.7'], why: 'Malware added a hosts entry: the bank name now resolves to an attacker\'s server — hence the redirect and the certificate warning.' }, why: 'The hosts file is checked before DNS.' },
     { t: 'Check whether a system proxy has also been set.', accept: [/^netsh winhttp show proxy$/i], show: 'netsh winhttp show proxy', hint: 'netsh winhttp show proxy', out: 'Current WinHTTP proxy settings:\n    Proxy Server(s) :  127.0.0.1:8877\n    Bypass List     :  (none)', ask: { q: 'Is a proxy set? (yes/no)', accept: ['yes'], why: 'A local proxy on 127.0.0.1:8877 — malware intercepting traffic. Legitimate company proxies point at a company server, not localhost.' }, why: 'Malware often changes proxy settings.' },
     { t: 'Reset the WinHTTP proxy to direct access.', accept: [/^netsh winhttp reset proxy$/i], show: 'netsh winhttp reset proxy', hint: 'netsh winhttp reset proxy', out: 'Current WinHTTP proxy settings:\n    Direct access (no proxy server).', why: 'Removes the rogue proxy (also check the browser/Internet Options proxy).' },
     { t: 'After removing the bad hosts lines (and running the malware removal procedure), clear the DNS cache.', accept: [/^ipconfig \/flushdns$/i], show: 'ipconfig /flushdns', hint: 'ipconfig with the flush switch.', out: 'Windows IP Configuration\n\nSuccessfully flushed the DNS Resolver Cache.', why: 'Removes any cached bad answers so the real bank address is used.' },
     { t: 'Confirm the bank now resolves through DNS.', accept: [/^nslookup (www\.)?firstbank\.com$/i], show: 'nslookup www.firstbank.com', hint: 'nslookup <name>', out: 'Server:  dns01.corp.local\nAddress:  10.20.30.5\n\nNon-authoritative answer:\nName:    www.firstbank.com\nAddress:  23.212.44.19', why: 'Real address; no certificate warning. Have the user change the bank password from a clean device.' }],
    'Redirects + certificate warnings = hosts file, proxy, DNS settings, or a malicious extension. Fix the setting, then run the full malware removal procedure, then change passwords.',
    ['hosts file → proxy → DNS cache → verify.']);

  RK.add({ track: TR, id: '3.4', dom: 3, short: 'PC security issues', title: 'Given a scenario, troubleshoot common personal computer (PC) security issues',
    goal: 'Recognize PC and browser symptoms of compromise and fix the settings malware changes.',
    kw: /\b(pop.?ups?|redirect|certificate warning|desktop alert|false alert|fake antivirus|rogue antivirus|altered (system )?files|renamed files|missing files|cannot access files|unwanted notification|update fail|hosts file|browser (slow|hijack)|degraded browser|unable to access the network)/,
    parts: [
      P('PC symptoms of compromise', 'Recognize network loss, false alerts, altered or inaccessible files, unwanted notifications and update failures as possible malware.',
        `<ul><li><b>Unable to access the network</b> — malware changed DNS, proxy or hosts settings, or disabled the adapter.</li>
<li><b>Desktop alerts</b> and <b>false alerts regarding antivirus protection</b> — scareware/fake antivirus demanding payment or an install.</li>
<li><b>Altered system or personal files</b> — <b>missing or renamed</b> files; extensions changed (ransomware).</li>
<li><b>Inability to access files</b> — encrypted (ransomware) or permissions changed.</li>
<li><b>Unwanted notifications within the OS</b> — a malicious app, or a website allowed to push notifications.</li>
<li><b>OS update failures</b> — malware often blocks Windows Update and antivirus updates to protect itself.</li></ul>
<p>Treat these as a possible infection: follow the malware removal procedure (2.6), then repair what was changed.</p>` + pro('Check for a malicious scheduled task or startup entry too — many infections reinstall themselves at every boot.') + trap('An antivirus alert from a product that is not installed is a false alert — the alert itself is the malware.'),
        [['Windows Update and Defender updates both fail repeatedly. What might this indicate?', 'Malware blocking updates', ['A slow profile', 'Rotation lock', 'A bad monitor'], 'Self-protection.'],
         ['Files suddenly have new extensions and will not open. Most likely?', 'Ransomware', ['Adware', 'Time drift', 'Low memory'], 'Encrypted files.']],
        'c2-pcsym'),
      P('Browser-related symptoms', 'Diagnose pop-ups, certificate warnings, redirection and degraded browser performance.',
        `<ul><li><b>Random/frequent pop-ups</b> — adware, a malicious extension, or site notifications the user allowed. Remove extensions, block notifications, reset the browser.</li>
<li><b>Certificate warnings</b> — the site\'s certificate is not trusted, expired, or for a different name. Could be interception (on-path, rogue proxy), a fake site from a hosts/DNS change, or a wrong PC clock. Never enter credentials past a warning on a sensitive site.</li>
<li><b>Redirection</b> — searches or sites go elsewhere: browser hijacker, changed hosts file, DNS or proxy.</li>
<li><b>Degraded browser performance</b> — too many extensions, cryptojacking scripts, or malware.</li></ul>
<p>Places to check: extensions list, browser proxy (and <code>netsh winhttp show proxy</code>), the <b>hosts</b> file (<code>C:\\Windows\\System32\\drivers\\etc\\hosts</code>), DNS servers in <code>ipconfig /all</code>, and the PC clock.</p>` + pro('A certificate warning on every HTTPS site at once usually means the clock is wrong or a proxy is intercepting — not that every website broke.') + trap('Clearing the cache will not fix a redirect caused by the hosts file or proxy; fix the setting.'),
        [['Every attempt to reach the bank goes to a look-alike site. Where do you look?', 'The hosts file, proxy and DNS settings', ['The rotation lock', 'Device Manager', 'Disk Management'], 'Redirection causes.'],
         ['Certificate warnings appear on every HTTPS site. A quick thing to check is:', 'The PC\'s date and time', ['The wallpaper', 'The keyboard layout', 'The screen resolution'], 'Wrong clock invalidates certificates.']],
        'c2-pcsec')
    ],
    wrap: { recap: ['PC symptoms: no network, desktop/false AV alerts, altered/renamed/missing files, inaccessible files, unwanted notifications, update failures.', 'Treat them as infection: malware removal procedure, then repair settings.', 'Browser: pop-ups (adware/extensions/notifications), certificate warnings (interception, fake site, clock), redirection (hijacker, hosts, DNS, proxy), slow browser.', 'Check extensions, proxy (netsh winhttp), hosts file, DNS, clock.', 'Never enter credentials past a certificate warning on a sensitive site.'], lab: 'c2-pcsec-wrap' }

/* A+ Core 2 (220-1202) — Domain 4.0 Operational Procedures — objectives 4.1 to 4.5 */
(function () {

  // ===================== 4.1 Documentation & support systems =====================
  M('c2-ticket', 'Write a good ticket', 'Put each detail in the right ticket field',
    'A user calls: "Hi, it\'s Dana Ruiz in Payroll, ext. 4412. My laptop LT-0388 can\'t print to the 2nd-floor printer since this morning, and payroll runs at 3 PM." Pick the ticket field for each piece.',

  M('c2-asset', 'Asset management', 'Inventory, CMDB, tags, life cycle',

     ['Request → purchase → receive → deploy → maintain → retire', 'Procurement life cycle', 'Cradle to grave.'],
     ['Vendor replaces a failed motherboard for free until next March', 'Warranty', 'Check before you pay for a repair.'],

     ['Disable the account at the exact end time (do not delete yet)', 'Stops access immediately; keeps data and audit trail.'],
     ['Revoke MFA tokens, VPN access, badges and remote sessions', 'Close every other door.'],

     ['Collect laptop, phone and keys; update the asset records', 'Asset management.'],

    'Onboarding and off-boarding checklists exist so nothing depends on memory. Disable first, delete last.');
  M('c2-docs-wrap', 'Which document?', 'Combined 4.1',
    'Pick the document or system for each need.', ['Ticketing system', 'CMDB', 'Incident report', 'Standard operating procedure (SOP)', 'Onboarding checklist', 'Off-boarding checklist', 'SLA', 'Knowledge base article'],
    [['Track a user\'s problem from first call to closure', 'Ticketing system', 'One record per issue.'],
     ['See which business services fail if a database server goes down', 'CMDB', 'Relationships between assets.'],
     ['Record what happened during a malware outbreak, timeline and actions', 'Incident report', 'After a security or major incident.'],
     ['Exact steps to install the custom accounting package the same way every time', 'Standard operating procedure (SOP)', 'Repeatable procedure.'],
     ['Account, laptop, licenses and training for a new hire', 'Onboarding checklist', 'New-user setup.'],
     ['Disable access and recover equipment when someone leaves', 'Off-boarding checklist', 'User removal.'],
     ['The internal promise that priority-1 tickets get a response within 15 minutes', 'SLA', 'Internal or external.'],
     ['A how-to so Tier 1 can fix the VPN error without escalating', 'Knowledge base article', 'Self-service and deflection.']],
    'Every one of these saves time the second time a problem happens.');

  RK.add({ track: TR, id: '4.1', dom: 4, moreLabs: ['c2-asset-ps'], short: 'Documentation & support systems', title: 'Given a scenario, implement best practices associated with documentation and support systems information management',
    goal: 'Write useful tickets, manage assets through their life cycle, and pick the right document for a job.',
    kw: /\b(ticket|asset (tag|management)|inventory|cmdb|procurement|warranty|knowledge base|kb article|incident report|standard operating|\bsop\b|onboarding|off.?boarding|\bsla\b|service.level|severity|escalat)/,
    parts: [
      RK.P('Ticketing systems', 'Write a ticket another technician can pick up and finish without calling the user again.',
        `<p>Every request goes into a <b>ticketing system</b>. A good ticket holds:</p>
<ul><li><b>User information</b> — name, department, contact.</li>
<li><b>Device information</b> — asset tag, model, OS.</li>
<li><b>Description of the issue</b> — what is wrong, since when, what still works, any error text.</li>
<li><b>Category</b> — hardware, software, network, access… Routes the ticket and drives reports.</li>
<li><b>Severity</b> — how much business impact (one user vs the whole site; deadline or not).</li>
<li><b>Escalation level</b> — Tier 1 (help desk) → Tier 2 (specialist) → Tier 3 (engineering/vendor).</li></ul>
<p><b>Clear, concise written communication</b> has three parts:</p>
<ol><li><b>Issue description</b> in the user's symptoms, not your guess.</li>
<li><b>Progress notes</b> — each thing you tried, with time and result.</li>
<li><b>Issue resolution</b> — the cause, the fix, and that the user confirmed it.</li></ol>` + pro('Write notes as if the next tech knows nothing. "Fixed it" helps no one; "Cleared stuck job, restarted Print Spooler, test page OK, user confirmed" does.') + trap('Severity is about business impact, not how loud the caller is.'),
        [['Which ticket field tells the team how much the problem affects the business?', 'Severity', ['Category', 'Device information', 'Progress notes'], 'Severity = impact and urgency.'],
         ['What belongs in the resolution section?', 'The cause, the fix, and that the user confirmed it', ['Only "fixed"', 'The user\'s phone number', 'A copy of the original complaint'], 'Resolution closes the loop.']],
        'c2-ticket'),
      RK.P('Asset management', 'Track a device from purchase to disposal with tags, an inventory and a CMDB.',
        `<ul><li><b>Inventory list</b> — every device: asset tag, serial number, model, location, status.</li>
<li><b>Asset tags and IDs</b> — a barcode/label on the device that matches its record.</li>
<li><b>Configuration management database (CMDB)</b> — more than an inventory: it records <i>relationships</i> (this server hosts that app, which serves that department). Used for impact analysis in change management.</li>
<li><b>Procurement life cycle</b> — request → approve → buy → receive → deploy → maintain → retire/dispose.</li>
<li><b>Warranty and licensing</b> — track expiry dates and seat counts; a warranty claim is cheaper than a repair, and an audit finds unlicensed installs.</li>
<li><b>Assigned users</b> — who has which device, for accountability and off-boarding.</li></ul>` + pro('Scan the asset tag into the ticket every time you touch a device. Over a year that history shows which models fail.') + trap('An inventory says what you have; a CMDB also says how the pieces depend on each other.'),
        [['What does a CMDB record that a simple inventory list does not?', 'Relationships between assets and services', ['Serial numbers', 'Purchase prices only', 'User passwords'], 'Configuration items and their dependencies.'],
         ['A laptop fails three months after purchase. What should you check before paying for a repair?', 'Warranty status', ['License seat count', 'The CMDB relationship', 'The escalation level'], 'Warranty repairs are free.']],
        'c2-asset'),
      RK.P('Types of documents', 'Choose between an incident report, SOP, onboarding/off-boarding checklist, SLA and knowledge base article.',
        `<table><tr><th>Document</th><th>Purpose</th></tr>
<tr><td><b>Incident report</b></td><td>What happened in a security or major incident: timeline, impact, actions, lessons.</td></tr>
<tr><td><b>Standard operating procedure (SOP)</b></td><td>Exact steps for a repeated task — e.g. a <b>software package custom installation procedure</b> (the company\'s exact way to install its custom installation of an app).</td></tr>
<tr><td><b>New-user setup (onboarding) checklist</b></td><td>Account, groups, mailbox, device, licenses, training.</td></tr>
<tr><td><b>User off-boarding checklist</b></td><td>Disable access, recover equipment, transfer data, remove licenses.</td></tr>
<tr><td><b>Service-level agreement (SLA)</b></td><td>Measurable promises. <b>Internal</b>: IT to the business. <b>External/third-party</b>: a vendor or ISP to you.</td></tr>
<tr><td><b>Knowledge base / articles</b></td><td>How-tos and known fixes, for techs and for user self-service.</td></tr></table>` + pro('When you solve something twice, write the knowledge base article. The third time it takes two minutes.') + trap('Off-boarding disables the account first and deletes it later. Deleting immediately loses data and the audit trail.'),
        [['Which document gives the exact repeatable steps to install a custom application?', 'Standard operating procedure', ['Incident report', 'SLA', 'Asset inventory'], 'SOPs make tasks repeatable.'],
         ['An ISP promises 99.9% uptime and credits if it misses. Which document?', 'External/third-party SLA', ['Internal SLA', 'Knowledge base article', 'Onboarding checklist'], 'A provider\'s commitment to you.']],
        'c2-offboard')
    ],
    wrap: { recap: ['Tickets: user, device, description, category, severity, escalation level.', 'Write clearly: issue description, progress notes, resolution with user confirmation.', 'Asset management: inventory, asset tags/IDs, CMDB (relationships), procurement life cycle, warranty, licensing, assigned users.', 'Incident report = what happened. SOP = exact repeatable steps. Knowledge base = known fixes.', 'Onboarding sets a user up; off-boarding disables first, deletes last.', 'SLA = measurable promises; internal (IT to business) or external (vendor to you).'], lab: 'c2-docs-wrap' }
  });

  // ===================== 4.2 Change management =====================
  M('c2-chgtype', 'Classify the change', 'Standard, normal or emergency',
    'Pick the change type.', ['Standard change', 'Normal change', 'Emergency change'],
    [['Adding a new user to an existing distribution group — pre-approved, low risk, done weekly', 'Standard change', 'Pre-approved and repeatable.'],
     ['Upgrading the firewall firmware next Saturday', 'Normal change', 'Goes to the change board.'],
     ['The mail server is down after a failed patch; roll it back now', 'Emergency change', 'Fix first, paperwork right after.'],
     ['Replacing the core switches during a planned maintenance window', 'Normal change', 'Planned, assessed, approved.'],
     ['Patching a zero-day being actively exploited, tonight', 'Emergency change', 'Expedited approval.'],
     ['Resetting a user\'s password via the documented process', 'Standard change', 'Routine.']],
    'Standard = pre-approved routine. Normal = full review. Emergency = urgent, approved fast, documented afterwards.');
  O('c2-chgflow', 'Run a normal change', 'Order the change process',
    'You will upgrade the file server OS. Put the change steps in order.',
    [['Fill in the change request form: purpose and scope', 'What and why.'],
     ['List affected systems and do a risk analysis (risk level)', 'Impact.'],

     ['The upgrade failed and nobody knew how to get the old version back', 'Rollback plan', 'Plan the undo first.'],
     ['The migration corrupted data and there was no copy taken beforehand', 'Backup plan', 'Back up before you change.'],
     ['Changing the DNS server broke the VPN, which nobody knew depended on it', 'Risk analysis / affected systems', 'Check dependencies (CMDB).'],

     ['The change ran during month-end close and stopped accounting', 'Maintenance window', 'Schedule around the business.'],
     ['A typo in an ACL went live because nobody else read the commands', 'Peer review', 'Second pair of eyes.'],
     ['IT closed the change but users could not open the new app', 'End-user acceptance', 'Users confirm it works.']],

  RK.add({ track: TR, id: '4.2', dom: 4, moreLabs: ['c2-change-ps'], short: 'Change management', title: 'Given a scenario, apply change management procedures',
    goal: 'Request, assess, approve, implement and close a change — with a tested rollback plan.',
    kw: /\b(change (management|request|control|board|advisory)|\bcab\b|rollback|back.?out|sandbox|maintenance window|change freeze|risk (analysis|level)|scope of (the )?change|peer review|end.user acceptance|emergency change|standard change)/,
    parts: [
      RK.P('The change request', 'Fill in a change request: purpose, scope, type, timing, affected systems and risk.',
        `<p><b>Change management</b> makes changes predictable. Every change starts with a <b>request form</b>:</p>
<ul><li><b>Purpose of the change</b> — why (fix, security, new feature).</li>
<li><b>Scope of the change</b> — exactly what will and will not be touched.</li>
<li><b>Change type</b>:
<ul><li><b>Standard</b> — routine, low risk, pre-approved (password reset process).</li>
<li><b>Normal</b> — planned, needs review and approval.</li>
<li><b>Emergency</b> — must happen now to restore service or stop an attack; approved quickly, documented after.</li></ul></li>
<li><b>Date and time</b> — inside a <b>maintenance window</b>, and never during a <b>change freeze</b> (e.g. month-end or holidays).</li>
<li><b>Affected systems / impact</b> — what else depends on it (the CMDB helps).</li>
<li><b>Risk analysis</b> — a <b>risk level</b> (low/medium/high) from likelihood × impact.</li></ul>` + pro('Write scope in one sentence a manager can read. If you cannot, the change is too big — split it.') + trap('An emergency change still gets documented and reviewed; it just happens before the paperwork is finished.'),
        [['Which change type is pre-approved and routine?', 'Standard', ['Normal', 'Emergency', 'Major'], 'No board review needed each time.'],
         ['What is a change freeze?', 'A period when no non-emergency changes are allowed', ['A failed change', 'A rollback', 'A type of backup'], 'Protects busy business periods.']],
        'c2-chgtype'),
      RK.P('Approval, testing and implementation', 'Get a change approved and implement it with sandbox testing, backup and rollback plans, peer review and user acceptance.',
        `<p><b>Documented business processes</b> that must exist before work starts:</p>
<ul><li><b>Sandbox testing</b> — try the change in a safe copy of production first.</li>
<li><b>Backup plan</b> — take a backup of what you are changing.</li>
<li><b>Rollback plan</b> — the exact steps to undo the change if it fails.</li>
<li><b>Responsible staff members</b> — who does it, who approves, who is on call.</li></ul>
<p><b>Then:</b></p>
<ol><li><b>Change board approval</b> — a change advisory board (CAB) reviews risk and timing.</li>
<li><b>Implementation</b> — in the window, following the plan.</li>
<li><b>Peer review</b> — another tech checks the work (or the commands before they run).</li>
<li><b>End-user acceptance</b> — users confirm it works. Only then is the change closed.</li></ol>` + pro('Set a "go/no-go" time in the window: if the change is not working by then, you roll back. Deciding that in advance prevents 4 a.m. heroics.') + trap('Testing happens in a sandbox before approval and implementation, not in production afterwards.'),
        [['What describes how to undo a change that fails?', 'Rollback plan', ['Scope', 'Change freeze', 'Risk level'], 'Plan the undo first.'],
         ['When is a change complete?', 'After end users confirm it works', ['When the tech finishes typing', 'When the CAB approves it', 'When the request is submitted'], 'End-user acceptance closes it.']],

    wrap: { recap: ['Request form: purpose, scope, type (standard, normal, emergency), date/time, affected systems, risk analysis.', 'Schedule in a maintenance window; never in a change freeze.', 'Before work: sandbox testing, backup plan, rollback plan, responsible staff.', 'Change board approves; implement; peer review; end-user acceptance closes it.', 'Emergency changes are approved fast and documented afterwards.'], lab: 'c2-chg-wrap' }

  // ===================== 4.3 Backup & recovery =====================
  C('c2-bkcalc', 'Backup math', 'Full, incremental, differential',
    'A server has <b>500 GB</b>. A full backup runs Sunday night. About <b>20 GB</b> of different data changes each weekday (Mon–Fri), and no file changes twice.',
    [['Size of Wednesday night\'s INCREMENTAL backup (GB)', 20, '20', 'Only Wednesday\'s changes.'],
     ['Size of Wednesday night\'s DIFFERENTIAL backup (GB)', 60, '60', 'Mon + Tue + Wed since the last full.'],
     ['Thursday crash, incremental scheme: how many backup sets must be restored? (full + each incremental through Wednesday)', 4, '4', 'Full + Mon + Tue + Wed.'],
     ['Thursday crash, differential scheme: how many backup sets must be restored?', 2, '2', 'Full + Wednesday\'s differential.']],
    'Incremental = small, fast backups but long restores. Differential = growing backups but a two-step restore.',
    ['Incremental: since the last backup of any kind. Differential: since the last full.']);
  M('c2-restore', 'Restore it the right way', 'In-place vs alternative location, testing',
    'Pick the best recovery approach.', ['In-place (overwrite)', 'Alternative location', 'Test restore'],
    [['A corrupted spreadsheet must be replaced by last night\'s good copy', 'In-place (overwrite)', 'Put the good copy back where it belongs.'],
     ['User wants yesterday\'s version but also to keep today\'s edits', 'Alternative location', 'Restore beside it and let them compare.'],
     ['Ransomware hit the server; restore to a clean, rebuilt server', 'Alternative location', 'Never restore onto the infected system.'],
     ['Monthly check that the backups can actually be read back', 'Test restore', 'An untested backup is a hope.'],
     ['Restore a whole folder over the damaged one after a bad script ran', 'In-place (overwrite)', 'Overwrite the damage.']],
    'When in doubt, restore to an alternative location: you never destroy anything by doing so.');
  M('c2-321', 'Rotation and storage', '3-2-1, GFS, onsite vs offsite',
    'Pick the term for each statement.', ['3-2-1 rule', 'Grandfather-father-son (GFS)', 'Onsite backup', 'Offsite backup'],
    [['Three copies of data, on two kinds of media, one of them off-site', '3-2-1 rule', 'Survives most disasters.'],
     ['Daily backups kept a week, weekly kept a month, monthly kept a year', 'Grandfather-father-son (GFS)', 'Son, father, grandfather.'],
     ['Backup appliance in the server room: fastest to restore from', 'Onsite backup', 'Quick, but shares the building\'s risks.'],
     ['Cloud or another building: survives fire and flood', 'Offsite backup', 'Slower, but separate.'],
     ['Why ransomware often fails to destroy all backups at a well-run company', '3-2-1 rule', 'At least one copy is off-site/offline.']],
    'Onsite for speed, offsite for survival. 3-2-1 gives you both.');
  M('c2-bk-wrap', 'Design the backup plan', 'Combined 4.3',
    'A 40-person office needs a backup plan. Pick the best answer for each requirement.', ['Full backup', 'Incremental backup', 'Differential backup', 'Synthetic full', 'Alternative-location restore', 'Monthly test restore', '3-2-1 rule', 'GFS rotation'],
    [['Weekend job that copies everything', 'Full backup', 'The baseline.'],
     ['Nightly job that must finish fast on a slow link', 'Incremental backup', 'Smallest nightly set.'],
     ['Nightly job where restores must need only two sets', 'Differential backup', 'Full + latest differential.'],
     ['Build a new full on the backup server from the last full plus incrementals, without re-reading the source', 'Synthetic full', 'Saves source load and bandwidth.'],
     ['Recover after ransomware without touching the infected server', 'Alternative-location restore', 'Clean target.'],
     ['Prove the backups work', 'Monthly test restore', 'Frequency matters.'],
     ['Keep a copy that survives the building burning down', '3-2-1 rule', 'One copy offsite.'],
     ['Keep a year of monthly restore points without keeping every daily', 'GFS rotation', 'Tiered retention.']],
    'A backup plan is only as good as its last successful test restore.');

  RK.add({ track: TR, id: '4.3', dom: 4, moreLabs: ['c2-backup-ps'], short: 'Backup & recovery', title: 'Given a scenario, implement workstation backup and recovery methods',
    goal: 'Choose backup types, restore safely, test backups, and keep copies with GFS and the 3-2-1 rule.',
    kw: /\b(backup|incremental|differential|synthetic|full backup|restore|recovery|3.2.1|grandfather|\bgfs\b|off.?site|on.?site|rotation)/,
    parts: [
      RK.P('Backup types', 'Explain full, incremental, differential and synthetic full backups, and what each costs at restore time.',
        `<table><tr><th>Type</th><th>Copies</th><th>Backup</th><th>Restore needs</th></tr>
<tr><td><b>Full</b></td><td>Everything</td><td>Slowest, biggest</td><td>Just the full</td></tr>
<tr><td><b>Incremental</b></td><td>Changes since the <b>last backup of any kind</b></td><td>Fastest, smallest</td><td>Last full + <b>every</b> incremental since</td></tr>
<tr><td><b>Differential</b></td><td>Changes since the <b>last full</b></td><td>Grows each day</td><td>Last full + <b>latest</b> differential</td></tr>
<tr><td><b>Synthetic full</b></td><td>A new full built on the backup server from the last full + incrementals</td><td>No load on the source</td><td>Like a full</td></tr></table>
<p>Typical plan: full on the weekend, incremental or differential nightly.</p>` + pro('Backups run when users are gone. If the nightly job is still running at 8 AM, switch to incrementals or synthetic fulls.') + trap('Incremental restores need every incremental since the full, in order. Lose one and the chain breaks.'),
        [['Which backup copies only data changed since the last full backup?', 'Differential', ['Incremental', 'Synthetic full', 'Full'], 'Differential grows until the next full.'],
         ['Which scheme has the fastest nightly backups but the most sets to restore?', 'Incremental', ['Differential', 'Full every night', 'Synthetic full'], 'Each night is small; restores need them all.']],
        'c2-bkcalc'),
      RK.P('Recovery and testing', 'Restore in place or to an alternative location, and test backups on a schedule.',
        `<ul><li><b>In-place / overwrite</b> — restore over the original. Fast and simple; destroys whatever is there now.</li>
<li><b>Alternative location</b> — restore to a different folder or server. Safe: nothing is overwritten. Use it when the user wants to compare versions, or after ransomware (restore onto a clean system).</li></ul>
<p><b>Backup testing</b>:</p>
<ul><li>A backup that has never been restored is unproven. Test-restore a few files <b>monthly</b> and a full system at least <b>yearly</b> (or per policy).</li>
<li>Check the backup job reports every day: a job "completed with warnings" may have skipped the files that matter.</li>
<li>Time the restore. If it takes 14 hours and the business can only be down for 4, the plan has failed already.</li></ul>` + pro('After any restore, have the user open the files. "Restored" and "usable" are not the same thing.') + trap('Backup testing frequency is part of the objective: the answer is regular, scheduled tests, not "after a disaster".'),
        [['A user wants yesterday\'s version of a document but must keep today\'s edits. How do you restore?', 'To an alternative location', ['In-place overwrite', 'Full system restore', 'Delete and recreate'], 'Restoring beside it keeps both.'],
         ['Why test restores regularly?', 'To prove the backups can actually be recovered', ['To make backups faster', 'To free disk space', 'To change the rotation'], 'Untested backups often fail.']],
        'c2-restore'),
      RK.P('Rotation: onsite, offsite, GFS and 3-2-1', 'Plan backup rotation with onsite/offsite copies, GFS and the 3-2-1 rule.',
        `<ul><li><b>Onsite</b> — in the building. Fast restores; lost with the building (fire, flood, theft, ransomware on the same network).</li>
<li><b>Offsite</b> — cloud or another location. Survives a site disaster; slower to restore.</li>
<li><b>Grandfather-father-son (GFS)</b> — keep <i>sons</i> (daily, ~1 week), <i>fathers</i> (weekly, ~1 month), <i>grandfathers</i> (monthly, ~1 year). Long history without keeping every daily.</li>
<li><b>3-2-1 rule</b> — <b>3</b> copies of the data, on <b>2</b> different media types, <b>1</b> offsite. Many add "1 offline/immutable" against ransomware.</li></ul>` + pro('Make at least one backup copy immutable or offline. Ransomware operators look for backup servers first.') + trap('3-2-1 counts copies of the data, including the live copy — not three backup jobs.'),
        [['What does the "1" in the 3-2-1 rule mean?', 'One copy is kept offsite', ['One backup per day', 'One media type', 'One restore test'], 'Survives a site disaster.'],
         ['In GFS, which backups are the "grandfathers"?', 'Monthly backups', ['Daily backups', 'Weekly backups', 'Incremental backups'], 'Son = daily, father = weekly, grandfather = monthly.']],
        'c2-321')
    ],
    wrap: { recap: ['Full = everything. Incremental = since last backup. Differential = since last full. Synthetic full = built on the backup server.', 'Incremental restore = full + every incremental. Differential restore = full + latest differential.', 'In-place overwrites; alternative location keeps both and suits ransomware recovery.', 'Test restores on a schedule (monthly files, yearly full system).', 'Onsite = fast; offsite = survives disasters. GFS = daily/weekly/monthly retention.', '3-2-1: three copies, two media, one offsite.'], lab: 'c2-bk-wrap' }

  RK.add({ track: TR, id: '4.4', dom: 4, short: 'Safety procedures', title: 'Given a scenario, use common safety procedures',
    goal: 'Protect equipment from static and yourself from electricity, lifting injuries, fire and dust.',
    kw: /\b(esd|electrostatic|static|wrist strap|antistatic|ground(ing|ed)|lift(ing)?|fire (safety|extinguisher)|class c|goggles|mask|safety|shock|cable management)/,
    parts: [
      RK.P('Protecting equipment: ESD and handling', 'Use ESD straps, mats and bags, grounding and proper handling to protect components.',
        `<p><b>Electrostatic discharge (ESD)</b> — the spark you feel from a doorknob is thousands of volts. Far less can damage a chip, often without any visible sign.</p>
<ul><li><b>ESD strap</b> — wrist strap clipped to the PC's bare metal frame or a ground point, so you and the PC are at the same potential.</li>
<li><b>ESD mat</b> — a grounded work surface for parts.</li>
<li><b>Antistatic bags</b> — store and move components in them (the shiny shielded ones).</li>
<li><b>Proper component handling and storage</b> — hold boards by the edges; never touch contacts or chips; store in bags, in a dry place.</li>
<li><b>Equipment grounding</b> — racks and cases bonded to earth so an electrical fault cannot make the metal live.</li>
<li><b>Cable management</b> — no trip hazards, no cables blocking airflow.</li>
<li><b>Compliance with government regulations</b> — workplace safety laws (e.g. OSHA in the US) apply to IT work too.</li></ul>` + pro('No strap? Touch bare metal on the case often and keep one hand on it. It is not as good, but far better than nothing.') + trap('An ESD strap is never worn while working inside a CRT or power supply: you would be the path to ground.'),
        [['What equalizes static between you and the computer while you work?', 'An ESD wrist strap', ['Safety goggles', 'A surge suppressor', 'An air filter mask'], 'Clip it to the case frame.'],
         ['How should a spare memory module be stored?', 'In an antistatic bag', ['In a plastic sandwich bag', 'Loose in a drawer', 'Wrapped in paper'], 'Shielded bags block static.']],
        'c2-esd'),
      RK.P('Personal safety', 'Work safely: power off, lift correctly, handle fires, and protect eyes and lungs.',
        `<ul><li><b>Disconnect power before repairing a PC</b> — unplug it, then press the power button to drain stored charge. Remove laptop batteries where possible.</li>
<li><b>Lifting techniques</b> — bend at the knees, keep the back straight, hold the load close, do not twist. Get help or a cart for anything heavy (UPSs, servers, printers).</li>
<li><b>Fire safety</b> — electrical fires need a <b>Class C</b> (CO₂ or clean-agent) extinguisher. Never water. Know the exits and the extinguisher location.</li>
<li><b>Safety goggles</b> — when cutting, using compressed air, or around batteries and chemicals.</li>
<li><b>Air filter mask</b> — when cleaning toner, dust or debris.</li></ul>
<p>If someone is being shocked: do not touch them. Cut the power first, then call for help.</p>` + pro('Two-person lifts for anything above about 20 kg. Back injuries end careers in field service.') + trap('Power supplies and CRT monitors hold dangerous charge even when unplugged. The exam answer is "replace, do not open".'),
        [['Which extinguisher is used on an electrical fire?', 'Class C (CO₂)', ['Class A (water)', 'Class K', 'Class B foam only'], 'Non-conductive agent.'],
         ['What is the correct lifting technique?', 'Bend the knees and keep the back straight', ['Bend at the waist', 'Twist while lifting', 'Lift with the arms straight out'], 'Legs do the work.']],
        'c2-personal')
    ],
    wrap: { recap: ['ESD strap clipped to bare metal; ESD mat; antistatic bags for storage.', 'Hold components by the edges; ground equipment; manage cables.', 'Follow government safety regulations.', 'Unplug and drain power before working inside a PC; never open a PSU or CRT.', 'Lift with the legs; Class C extinguisher for electrical fires; goggles and air filter masks.'], lab: 'c2-safety-wrap' }

  M('c2-dispose', 'Dispose of it properly', 'SDS, batteries, toner, devices',

    [['A tech spilled toner and wants to know if it is hazardous to clean up', 'Check the SDS', 'Safety data sheet.'],
     ['A swollen lithium-ion laptop battery', 'Battery recycling', 'Never in the trash; it can catch fire.'],
     ['Empty laser toner cartridges', 'Toner return/recycling program', 'Many vendors take them back.'],

  RK.add({ track: TR, id: '4.5', dom: 4, short: 'Environmental impacts & controls', title: 'Summarize environmental impacts and local environment controls',
    goal: 'Handle and dispose of hazardous materials properly and protect equipment from heat, humidity, dust and power problems.',
    kw: /\b(msds|\bsds\b|safety data sheet|dispos|recycl|toner|battery|batteries|temperature|humidity|ventilation|dust|compressed air|vacuum|surge|brownout|blackout|\bups\b|power (problem|outage))/,
    parts: [
      RK.P('Hazardous materials and disposal', 'Use SDS documentation and dispose of batteries, toner and devices properly.',
        `<p>A <b>safety data sheet (SDS)</b>, formerly MSDS, comes with every chemical product (toner, cleaning solvents, batteries, thermal paste). It lists hazards, safe handling, protective equipment, first aid, spill cleanup and <b>disposal</b>. Find it on the vendor's website.</p>
<ul><li><b>Proper battery disposal</b> — lithium-ion, NiMH and lead-acid (UPS) batteries go to recycling, never the trash. Swollen lithium batteries are a fire risk: store them in a fireproof container until collected.</li>
<li><b>Proper toner disposal</b> — return or recycle cartridges. Clean spills with a toner vacuum or damp cloth; a normal vacuum can melt toner or spread it.</li>
<li><b>Other devices and assets</b> — monitors, PCs, phones contain heavy metals: use a certified e-waste recycler and follow local regulations. Wipe data first (objective 2.9).</li></ul>` + pro('Keep a labelled bin for dead batteries in every IT room. If disposal is easy, people do it.') + trap('The document is the SDS (or MSDS). It is the answer whenever the question asks about a chemical\'s hazards or disposal.'),
        [['Which document describes how to handle and dispose of a toner cartridge safely?', 'Safety data sheet (SDS)', ['End-user license agreement', 'Acceptable use policy', 'Service-level agreement'], 'SDS covers chemical hazards.'],
         ['How should a swollen lithium-ion battery be handled?', 'Store it safely and send it to battery recycling', ['Throw it in the trash', 'Puncture it to release pressure', 'Keep using it carefully'], 'It is a fire hazard.']],
        'c2-dispose'),
      RK.P('Climate, dust and power', 'Protect equipment from temperature, humidity, dust and power surges, brownouts and blackouts.',
        `<ul><li><b>Temperature and ventilation</b> — hot equipment fails early. Keep air flowing, leave clearance around vents and racks.</li>
<li><b>Humidity-level awareness</b> — too dry → static; too humid → condensation and corrosion. Aim for about 40–60%.</li>
<li><b>Location / equipment placement</b> — away from heaters, windows, water pipes, floors that get mopped, and dusty areas.</li>
<li><b>Dust cleanup</b> — compressed air (outdoors, short bursts, hold fans still) or an <b>ESD-safe vacuum</b>.</li></ul>
<table><tr><th>Power problem</th><th>Is</th><th>Protection</th></tr>
<tr><td><b>Surge</b></td><td>Short voltage spike</td><td>Surge suppressor</td></tr>
<tr><td><b>Brownout</b></td><td>Voltage sag</td><td>UPS (line conditioning)</td></tr>
<tr><td><b>Blackout</b></td><td>Total loss</td><td>UPS (battery), generator for long outages</td></tr></table>` + pro('Plug the UPS\'s USB/network cable into the server and configure automatic shutdown. A UPS that just runs flat helps nobody.') + trap('A surge suppressor does nothing during a blackout. Only a UPS keeps equipment running.'),
        [['Which device keeps a PC running through a short power outage?', 'UPS', ['Surge suppressor', 'Power strip', 'PDU'], 'Battery backup.'],
         ['What problem does very high humidity cause?', 'Condensation and corrosion', ['Static discharge', 'Brownouts', 'Faster fans'], 'Too wet.']],
        'c2-power-env')
    ],
    wrap: { recap: ['SDS/MSDS: hazards, handling, first aid and disposal for chemicals and batteries.', 'Recycle batteries, toner and e-waste; never the trash.', 'Control temperature and ventilation; keep humidity about 40–60%.', 'Place equipment away from heat, water and dust; clean with compressed air or an ESD-safe vacuum.', 'Surge → surge suppressor. Brownout and blackout → UPS.'], lab: 'c2-env-wrap' }

/* A+ Core 2 (220-1202) — Domain 4.0 Operational Procedures — objectives 4.6 to 4.10 + domain wrap lab */
(function () {
  var RK = window.RK, P = RK.P, M = RK.M, O = RK.O, T = RK.T, TR = 'core2';
  function pro(t) { return '<div class="callout pro"><b class="k">On the job</b>' + t + '</div>'; }
  function trap(t) { return '<div class="callout trap"><b class="k">Exam trap</b>' + t + '</div>'; }

  // ===================== 4.6 Prohibited content, privacy, licensing =====================
  O('c2-ir-order', 'You found prohibited content', 'Incident response steps',
    'While repairing a laptop you see what looks like illegal content. Put your actions in order.',
    [['Stop working on the device and do not browse further', 'Do not alter evidence.'],
     ['Inform management (and follow policy on law enforcement)', 'Escalate; you are not the investigator.'],
     ['Secure the device; start a chain-of-custody record', 'Who had it, when, and why.'],
     ['Preserve data: a forensic copy of the drive is made by the authorized team', 'Data integrity — work on the copy.'],
     ['Collect volatile data first if instructed (RAM before disk)', 'Order of volatility.'],
     ['Document everything you saw and did, with times', 'Incident documentation.']],
    'Your job is to stop, report and preserve — never to investigate or delete.');
  M('c2-license', 'Which license or agreement?', 'EULA, DRM, licenses, NDA',
    'Pick the license or agreement for each case.', ['EULA', 'DRM', 'Perpetual license', 'Subscription / corporate-use license', 'Personal-use license', 'Open-source license', 'NDA', 'Mutual NDA'],
    [['The terms you accept when installing software', 'EULA', 'End-user license agreement.'],
     ['Technology that stops a purchased e-book being copied', 'DRM', 'Digital rights management.'],
     ['Buy once, use that version forever', 'Perpetual license', 'No renewal needed for that version.'],
     ['Company pays per seat per year to use the office suite at work', 'Subscription / corporate-use license', 'Business use, counted seats.'],
     ['Free "home" edition that forbids commercial use', 'Personal-use license', 'Using it at work breaks the terms.'],
     ['Source code you may read, change and share under the license terms', 'Open-source license', 'e.g. GPL, MIT.'],
     ['A contractor promises not to disclose the client\'s data', 'NDA', 'One-way non-disclosure.'],
     ['Two companies exploring a merger both agree to keep each other\'s information secret', 'Mutual NDA', 'Two-way.']],
    'Installing personal-use software on company PCs is a licensing violation the company pays for in an audit.');
  M('c2-regdata', 'Regulated data and policy', 'PII, PCI, healthcare, AUP, retention',
    'Pick the category for each item.', ['Credit card payment information', 'Government-issued information', 'PII', 'Healthcare data', 'Data retention requirement', 'Acceptable use policy (AUP)', 'Splash screen'],
    [['Card numbers stored by the online shop', 'Credit card payment information', 'PCI DSS applies.'],
     ['Passport and driver\'s license scans in HR files', 'Government-issued information', 'High-value identity data.'],
     ['Name + home address + date of birth', 'PII', 'Personally identifiable information.'],
     ['Patient diagnoses at a clinic', 'Healthcare data', 'HIPAA in the US.'],
     ['Financial records must be kept for seven years, then destroyed', 'Data retention requirement', 'Keep for the required time — no longer.'],
     ['Rules on what staff may do with company PCs and Internet', 'Acceptable use policy (AUP)', 'Signed by users.'],
     ['Warning banner at sign-in: "Authorized use only; activity is monitored"', 'Splash screen', 'Legal notice before access.']],
    'Regulated data is protected by law; the AUP and splash screen tell users the rules before they start.');
  M('c2-priv-wrap', 'Policy desk', 'Combined 4.6',
    'Pick the best answer for each situation.', ['Chain of custody', 'Order of volatility', 'Inform management', 'Valid license', 'Open-source license', 'Mutual NDA', 'PII', 'Data retention', 'AUP', 'Splash screen'],
    [['Record every person who handled the seized laptop', 'Chain of custody', 'Admissible evidence.'],
     ['Capture RAM before shutting down the PC', 'Order of volatility', 'Most volatile first.'],
     ['A tech finds prohibited content on a user\'s PC', 'Inform management', 'Escalate per policy.'],
     ['Audit finds 30 installs but only 20 seats purchased', 'Valid license', 'Buy seats or remove installs.'],
     ['The team wants to modify a tool\'s source and ship it internally', 'Open-source license', 'Check its terms.'],
     ['Both partners must keep each other\'s plans secret', 'Mutual NDA', 'Two-way.'],
     ['A spreadsheet of names with Social Security numbers', 'PII', 'Protect and minimize.'],
     ['Old emails must be deleted after the legally required period', 'Data retention', 'Policy-driven deletion.'],
     ['A user is warned for running a personal business on the company laptop', 'AUP', 'Acceptable use.'],
     ['Legal notice displayed before anyone can log in', 'Splash screen', 'Sets expectations.']],
    'Your role with prohibited content and regulated data: follow policy, protect, escalate, document.');

  RK.add({ track: TR, id: '4.6', dom: 4, short: 'Prohibited content, privacy & licensing', title: 'Explain the importance of prohibited content/activity and privacy, licensing, and policy concepts',
    goal: 'Respond correctly to prohibited content, respect licenses and agreements, and protect regulated data.',
    kw: /\b(prohibited|chain of custody|order of volatility|incident response|law enforcement|licens|\beula\b|\bdrm\b|open.source|\bnda\b|non.disclosure|\bpii\b|personally identifiable|pci|healthcare|hipaa|retention|acceptable use|\baup\b|splash screen|regulat)/,
    parts: [
      RK.P('Incident response to prohibited content', 'Respond to prohibited content with chain of custody, escalation, a drive copy and documentation.',
        `<p>If you find prohibited or illegal content or activity, you are <b>first response</b>, not the investigator:</p>
<ul><li><b>Inform management</b> (and law enforcement as necessary, per company policy and law).</li>
<li><b>Chain of custody</b> — a written record of everyone who has had the evidence, when and why. A gap can make evidence useless in court.</li>
<li><b>Copy of drive (data integrity and preservation)</b> — investigators work on a forensic copy, verified with a hash, never on the original.</li>
<li><b>Order of volatility</b> — collect the most short-lived data first: CPU cache/RAM → running processes and network connections → disk → logs → backups.</li>
<li><b>Incident documentation</b> — what you saw, what you did, timestamps.</li></ul>` + pro('Do not power off, delete, or "check one more folder". Stop, step back, and call your manager.') + trap('Order of volatility puts RAM before the hard drive: shutting the PC down destroys what was in memory.'),
        [['What records everyone who handled a piece of evidence?', 'Chain of custody', ['Order of volatility', 'EULA', 'Incident ticket category'], 'Unbroken custody record.'],
         ['According to order of volatility, which is collected first?', 'RAM contents', ['Hard drive image', 'Backup tapes', 'Printed logs'], 'Most volatile first.']],
        'c2-ir-order'),
      RK.P('Licensing, DRM, EULA and NDAs', 'Tell perpetual, personal, corporate and open-source licenses apart, and explain EULA, DRM and NDAs.',
        `<ul><li><b>Valid licenses</b> — every install needs one; audits compare installs to purchases.</li>
<li><b>Perpetual license agreement</b> — pay once, use that version indefinitely (updates may cost extra).</li>
<li><b>Personal-use vs corporate-use</b> — "free for personal use" software is <i>not</i> licensed for business. Corporate licenses are usually per user/device, often subscriptions.</li>
<li><b>Open-source license</b> — source is available to use, modify and share, under conditions (GPL requires sharing changes; MIT is permissive).</li>
<li><b>EULA</b> (end-user license agreement) — the terms you accept on install.</li>
<li><b>DRM</b> (digital rights management) — technology that enforces copying/usage limits on media and software.</li>
<li><b>NDA</b> — you agree not to disclose confidential information. <b>Mutual NDA</b> — both parties agree.</li></ul>` + pro('Keep proof of purchase and license keys in the asset system. "We bought it years ago" does not pass an audit.') + trap('Open source does not mean "no rules". The license still sets conditions.'),
        [['A user installs a "free for personal use" tool on a company PC. What is the issue?', 'It violates the license terms for business use', ['It needs a perpetual license key', 'It is protected by DRM', 'It requires an NDA'], 'Personal-use licenses exclude business use.'],
         ['Which agreement do you accept when installing software?', 'EULA', ['NDA', 'SLA', 'AUP'], 'End-user license agreement.']],
        'c2-license'),
      RK.P('Regulated data and policies', 'Identify regulated data types, retention requirements, AUPs and splash screens.',
        `<p><b>Regulated data</b> — protected by law or industry rules:</p>
<ul><li><b>Credit card payment information</b> — PCI DSS.</li>
<li><b>Personal government-issued information</b> — passport, driver\'s license, Social Security numbers.</li>
<li><b>PII</b> (personally identifiable information) — anything that identifies a person.</li>
<li><b>Healthcare data</b> — HIPAA in the US.</li>
<li><b>Data retention requirements</b> — keep certain records for a set time, then dispose of them securely.</li></ul>
<ul><li><b>Acceptable use policy (AUP)</b> — what users may and may not do with company systems; users sign it.</li>
<li><b>Regulatory and business compliance requirements</b> — the laws and contracts the company must meet; IT controls often exist because of them.</li>
<li><b>Splash screens</b> — a sign-in banner stating that use is monitored and authorized users only, so users cannot claim they were not told.</li></ul>` + pro('Never copy regulated data to a USB stick or personal email to "work on it from home". That single act can be a reportable breach.') + trap('Retention cuts both ways: keeping data longer than required is also a compliance problem.'),
        [['Which document do employees sign that defines permitted use of company IT?', 'Acceptable use policy', ['EULA', 'Mutual NDA', 'SDS'], 'AUP.'],
         ['A banner at login warns that the system is monitored. What is it called?', 'Splash screen', ['Order of volatility', 'DRM', 'Chain of custody'], 'Legal notice before access.']],
        'c2-regdata')
    ],
    wrap: { recap: ['Prohibited content: stop, inform management/law enforcement per policy, preserve.', 'Chain of custody; forensic copy of the drive; order of volatility (RAM first); document everything.', 'Valid licenses; perpetual vs subscription; personal vs corporate use; open source has conditions.', 'EULA = install terms. DRM = copy protection. NDA one-way; mutual NDA two-way.', 'Regulated data: card data, government IDs, PII, healthcare; retention requirements.', 'AUP sets user rules; splash screen warns before login.'], lab: 'c2-priv-wrap' }
  });

  // ===================== 4.7 Communication & professionalism =====================
  M('c2-pro-do', 'Professional or not?', 'Pick the professional response',
    'Pick the best behaviour for each situation.', ['Explain without jargon', 'Listen without interrupting', 'Call ahead if late', 'Ignore your phone', 'Use their title', 'Dress for the environment', 'Stay positive and confident'],
    [['A manager asks why the server was down; you are about to say "DNS TTL and a stale A record"', 'Explain without jargon', 'Plain words.'],
     ['The user is describing the problem and you already think you know the answer', 'Listen without interrupting', 'You may be wrong; they feel heard.'],

  RK.add({ track: TR, id: '4.7', dom: 4, short: 'Communication & professionalism', title: 'Given a scenario, use proper communication techniques and professionalism',
    goal: 'Communicate clearly and respectfully, handle difficult customers, set expectations and protect confidential material.',
    kw: /\b(customer|jargon|listen|interrupt|professional|attire|appearance|on time|late|distraction|difficult|argue|defensive|judgmental|open.ended|expectation|follow up|confidential|culturally|polite|courteous)/,
    parts: [
      RK.P('Professional behaviour', 'Dress, speak, listen and act professionally with users.',
        `<ul><li><b>Professional appearance and attire</b> — match the environment: <i>formal</i> (bank, law firm) or <i>business casual</i>.</li>
<li><b>Use proper language</b> — avoid jargon, acronyms and slang. Explain in the user\'s terms.</li>
<li><b>Maintain a positive attitude / project confidence</b> — even when you do not know yet: "Let me find out."</li>
<li><b>Actively listen</b>, take notes, and <b>avoid interrupting</b>.</li>
<li><b>Be culturally sensitive</b> — use appropriate professional titles where the culture expects them.</li>
<li><b>Be on time</b> — if you will be late, contact the customer.</li>
<li><b>Avoid distractions</b> — personal calls, texting/social media, personal interruptions.</li></ul>` + pro('Repeat the user\'s problem back in one sentence before you start. It proves you listened and catches misunderstandings early.') + trap('"Avoid jargon" includes acronyms: "your DHCP lease expired" is jargon to most users.'),
        [['What should you do if you will be late to an onsite appointment?', 'Contact the customer before the scheduled time', ['Arrive late without comment', 'Reschedule by email next week', 'Send another tech without telling them'], 'Respect their time.'],
         ['Which is an example of active listening?', 'Letting the user finish, then restating the problem', ['Typing a fix while they talk', 'Finishing their sentences', 'Checking your phone while they speak'], 'Listen, then confirm.']],
        'c2-pro-do'),
      RK.P('Difficult customers, expectations and confidentiality', 'De-escalate difficult customers, set and meet expectations, and handle confidential material.',
        `<p><b>Dealing with difficult customers or situations:</b></p>
<ul><li>Do not argue or be defensive. Do not dismiss the problem. Do not be judgmental.</li>
<li>Clarify with <b>open-ended questions</b> and <b>restate</b> the issue to show understanding.</li>
<li>Use discretion and professionalism — including on social media.</li></ul>
<p><b>Set and meet expectations/timeline and communicate status:</b></p>
<ul><li>Offer <b>repair or replacement options</b> where they exist.</li>
<li>Provide proper <b>documentation</b> of what was done.</li>
<li><b>Follow up</b> with the customer to verify satisfaction.</li></ul>
<p><b>Confidential and private materials</b> — documents, screens, email, files on a PC you repair: do not read, copy, discuss or remove them. Lock screens and printouts are not your business.</p>` + pro('Under-promise and over-deliver: "by end of day" and done at 2 PM beats "in an hour" and done at 3.') + trap('With an angry customer, the exam answer is never to argue, defend yourself or blame the user — even when they are wrong.'),
        [['A user is shouting about repeated failures. What should you do first?', 'Listen without arguing and acknowledge the frustration', ['Explain it is their fault', 'Hang up and call back later', 'Transfer them immediately'], 'De-escalate first.'],
         ['What do you do after a repair to confirm success?', 'Follow up with the customer to verify satisfaction', ['Close the ticket silently', 'Post about it on social media', 'Ask a coworker'], 'Verify satisfaction.']],
        'c2-callflow')
    ],
    wrap: { recap: ['Dress for the environment; use plain language, no jargon or slang.', 'Positive attitude, active listening, no interrupting; culturally appropriate titles.', 'Be on time (call if late); avoid personal distractions.', 'Difficult customers: do not argue, dismiss or judge; open-ended questions; restate.', 'Set expectations, give status, offer options, document, follow up.', 'Never read, share or remove confidential materials.'], lab: 'c2-comm-wrap' }
  });

  T('c2-ps-script', 'Run an inventory script safely', 'PowerShell execution policy and a .ps1',
    'You have been given <b>Get-Inventory.ps1</b> to collect PC details. Read it before you run it, then run it properly.',
    { shell: 'ps', prompt: 'PS C:\\Scripts>' },
    [{ t: 'Show the contents of <b>Get-Inventory.ps1</b> before running anything.', accept: [/^(get-content|gc|cat|type) \.?\\?get-inventory\.ps1$/i], show: 'Get-Content .\\Get-Inventory.ps1', hint: 'The PowerShell cmdlet that reads a file (Get-…).', out: '$pc = $env:COMPUTERNAME\n$os = (Get-CimInstance Win32_OperatingSystem).Caption\n$ram = [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory/1GB)\n"$pc,$os,$ram GB" | Out-File \\\\fs01\\it\\inventory.csv -Append', ask: { q: 'Where does the script write its results? (the UNC path)', accept: ['\\\\fs01\\it\\inventory.csv', 'fs01\\it\\inventory.csv'], why: 'It only reads system info and appends one line to a share — safe to run. Always read a script before you run it.' }, why: 'Never run a script you have not read.' },
     { t: 'Check the current PowerShell execution policy.', accept: [/^get-executionpolicy$/i], show: 'Get-ExecutionPolicy', hint: 'Get-…Policy', out: 'Restricted', why: 'Restricted = no scripts run at all (the Windows client default).' },
     { t: 'Allow locally-created scripts (and signed downloaded ones) for <b>your user only</b>.', accept: [/^set-executionpolicy remotesigned -scope currentuser( -force)?$/i, /^set-executionpolicy -executionpolicy remotesigned -scope currentuser( -force)?$/i, /^set-executionpolicy -scope currentuser remotesigned( -force)?$/i], show: 'Set-ExecutionPolicy RemoteSigned -Scope CurrentUser', hint: 'Set-ExecutionPolicy RemoteSigned -Scope CurrentUser', out: 'Execution Policy Change\nDo you want to change the execution policy? [Y] Yes  [N] No: Y', why: 'RemoteSigned for the current user is the usual, least-invasive setting.' },
     { t: 'Run the script from the current folder.', accept: [/^\.\\get-inventory\.ps1$/i, /^& \.\\get-inventory\.ps1$/i], show: '.\\Get-Inventory.ps1', hint: 'PowerShell needs .\\ in front of a script in the current folder.', out: '', why: 'PowerShell does not run scripts from the current folder without .\\ — a safety feature.' },
     { t: 'Confirm the result by showing the last 3 lines of <b>\\\\fs01\\it\\inventory.csv</b>.', accept: [/^get-content \\\\fs01\\it\\inventory\.csv -tail 3$/i, /^gc \\\\fs01\\it\\inventory\.csv -tail 3$/i, /^get-content -path \\\\fs01\\it\\inventory\.csv -tail 3$/i], show: 'Get-Content \\\\fs01\\it\\inventory.csv -Tail 3', hint: 'Get-Content with -Tail.', out: 'WS-ACCT-012,Microsoft Windows 11 Pro,16 GB\nWS-ACCT-013,Microsoft Windows 11 Pro,8 GB\nWS-ACCT-014,Microsoft Windows 11 Pro,16 GB', why: 'Gathering information across many PCs is a classic scripting use case.' }],
    'Read → check policy → allow scripts as narrowly as possible → run with .\\ → verify the output.',
    ['PowerShell cmdlets are Verb-Noun: Get-Content, Get-ExecutionPolicy.']);
  T('c2-sh-script', 'Review a backup script before it runs', 'Bash script safety',
    'A colleague wrote <b>cleanup.sh</b> to delete old backups nightly. You are asked to review and schedule it.',
    { shell: 'bash', prompt: 'tech@backup01:~$' },
    [{ t: 'Print the script.', accept: [/^cat (\.\/)?cleanup\.sh$/, /^less (\.\/)?cleanup\.sh$/], show: 'cat cleanup.sh', hint: 'cat prints a file.', out: '#!/bin/bash\nBACKUP_DIR=$1\ncd $BACKUP_DIR\nrm -rf *', ask: { q: 'If the script is run with NO argument, which directory does "cd" go to? (type home or backups)', accept: ['home', '~', 'the home directory', 'home directory'], why: 'An empty $1 makes "cd" go home, then rm -rf * deletes your whole home directory. Scripts can destroy data or change settings by accident.' }, why: 'This is how scripts "inadvertently change system settings" or delete data.' },
     { t: 'Check the script\'s syntax without running it.', accept: [/^bash -n (\.\/)?cleanup\.sh$/], show: 'bash -n cleanup.sh', hint: 'bash with -n = read but do not execute.', out: '', why: 'No output = no syntax errors. Syntax-valid is not the same as safe.' },
     { t: 'After your colleague fixes it (it now refuses to run without a valid directory and only deletes files older than 30 days), make it executable.', accept: [/^chmod (\+x|u\+x|7[0-5][0-5]) (\.\/)?cleanup\.sh$/], show: 'chmod +x cleanup.sh', hint: 'chmod +x', out: '', why: 'Scripts need execute permission to run as ./cleanup.sh.' },
     { t: 'Test-run it against the backup folder <b>/srv/backups</b>.', accept: [/^\.\/cleanup\.sh \/srv\/backups\/?$/, /^bash cleanup\.sh \/srv\/backups\/?$/], show: './cleanup.sh /srv/backups', hint: './script argument', out: 'Deleting 12 files older than 30 days in /srv/backups\nDone. 1.4 GB freed.', why: 'Automated backups and cleanup are common scripting use cases — once the script is safe.' },
     { t: 'List your scheduled jobs to confirm the nightly entry.', accept: [/^crontab -l$/], show: 'crontab -l', hint: 'crontab with -l (list).', out: '# m h dom mon dow  command\n30 2 * * * /home/tech/cleanup.sh /srv/backups >> /var/log/cleanup.log 2>&1', ask: { q: 'At what time does the job run? (24-hour, e.g. 02:30)', accept: ['02:30', '2:30', '2:30 am', '0230'], why: 'Minute 30, hour 2 — 02:30 every day, with output logged for review.' }, why: 'cron schedules scripts on Linux; Task Scheduler does it on Windows.' }],
    'Before a script runs on a schedule: read it, check what happens with bad input, test it once by hand, log its output.',
    ['Unquoted, unchecked variables are the classic scripting accident.']);
  M('c2-script-wrap', 'Script it?', 'Combined 4.8',
